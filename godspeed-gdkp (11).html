<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Godspeed GDKP</title>
<link rel="icon" type="image/x-icon" href="./favicon.ico" />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
<script src="https://wow.zamimg.com/widgets/power.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --gold:#d4a93c;--gold-light:#f0cc6a;--gold-dim:#8a6830;
    --bg-deep:#0e0c09;--bg-panel:#1a1610;--bg-card:#221d14;--bg-input:#161208;
    --border-gold:rgba(212,169,60,0.35);--border-gold-strong:rgba(212,169,60,0.65);
    --text-bright:#f8f0d8;--text-muted:#a89060;
    --epic:#b44aff;--rare:#2288ff;--uncommon:#44ff44;--common:#ffffff;--poor:#aaaaaa;
    --red:#ff6060;--green:#60cc80;--amber:#f0a830;
  }
  html{font-size:20px;}
  body{background:var(--bg-deep);font-family:'Inter',sans-serif;color:var(--text-bright);min-height:100vh;}

  /* Background image */
  body::before{
    content:'';
    position:fixed;inset:0;
    background:url('./tbc.jpg') center center / cover no-repeat;
    filter:brightness(0.28) saturate(0.8);
    z-index:-1;
  }

  #app{min-height:100vh;display:flex;flex-direction:column;}
  .hdr{border-bottom:1px solid var(--border-gold);padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;background:rgba(10,8,5,0.88);backdrop-filter:blur(6px);}
  .logo{font-family:'Cinzel',serif;font-size:1.6rem;font-weight:600;color:var(--gold);letter-spacing:.1em;}
  .logo-sub{font-family:'Cinzel',serif;font-size:.75rem;letter-spacing:.25em;color:var(--text-muted);text-transform:uppercase;margin-top:.1rem;}
  .rl-badge{font-family:'Cinzel',serif;font-size:.75rem;letter-spacing:.1em;background:rgba(212,169,60,0.18);color:var(--gold);border:1px solid var(--border-gold-strong);padding:.25rem .65rem;border-radius:2px;margin-right:.5rem;}
  .usr-chip{font-family:'Cinzel',serif;font-size:.85rem;letter-spacing:.05em;color:var(--gold-light);background:rgba(212,169,60,0.1);border:1px solid var(--border-gold);padding:.3rem .8rem;border-radius:3px;}
  .conn-dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:.4rem;background:var(--green);}
  .btn{font-family:'Cinzel',serif;font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;border-radius:3px;padding:.6rem 1.2rem;transition:all .15s;}
  .btn-gold{background:var(--gold);color:var(--bg-deep);border:1px solid var(--gold);font-weight:600;}
  .btn-gold:hover{background:var(--gold-light);}
  .btn-outline{background:transparent;color:var(--gold);border:1px solid var(--border-gold-strong);}
  .btn-outline:hover{border-color:var(--gold);background:rgba(212,169,60,0.09);}
  .btn-green{background:transparent;color:var(--green);border:1px solid rgba(96,204,128,0.45);}
  .btn-green:hover{background:rgba(96,204,128,0.12);border-color:var(--green);}
  .btn-amber{background:#b87010;color:#fff;border:2px solid #e8900a;font-weight:600;letter-spacing:.1em;}
  .btn-amber:hover{background:#d08318;border-color:#f0a020;}
  .btn-amber-resume{background:#1a6b30;color:#fff;border:2px solid #28a048;font-weight:600;letter-spacing:.1em;}
  .btn-amber-resume:hover{background:#236b33;border-color:#40ff66;}
  .qb-custom{background:#1a5c2a !important;color:#6aff8a !important;border:1px solid #2ecc52 !important;border-style:solid !important;font-weight:600;}
  .qb-custom:hover{background:#236b33 !important;border-color:#40ff66 !important;}
  .qb-custom.active-custom{background:#0e3d1c !important;color:#4dff70 !important;border-color:#28cc44 !important;}
  .btn-sm{padding:.38rem .8rem;font-size:.76rem;}
  .btn-danger{background:transparent;color:var(--red);border:1px solid rgba(255,96,96,0.35);font-size:.76rem;}
  .btn-danger:hover{background:rgba(255,96,96,0.12);border-color:var(--red);}
  .main{flex:1;padding:1.5rem 2rem;max-width:1600px;margin:0 auto;width:100%;}
  input[type=text],input[type=number],input[type=password]{width:100%;background:var(--bg-input);border:1px solid var(--border-gold);color:var(--text-bright);padding:.6rem .8rem;font-family:'Inter',sans-serif;font-size:1rem;border-radius:3px;outline:none;transition:border-color .2s;}
  input[type=text]:focus,input[type=number]:focus,input[type=password]:focus{border-color:var(--gold);}
  .lbl{font-family:'Cinzel',serif;font-size:.75rem;letter-spacing:.1em;color:var(--text-muted);text-transform:uppercase;margin-bottom:.3rem;}
  .fg{display:flex;flex-direction:column;gap:.3rem;position:relative;}
  .login-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;gap:1.75rem;}
  .login-brand .wordmark{font-family:'Cinzel',serif;font-size:3rem;font-weight:600;color:var(--gold);letter-spacing:.15em;text-align:center;text-shadow:0 0 40px rgba(212,169,60,0.5);}
  .login-brand .wordmark-sub{font-family:'Cinzel',serif;font-size:.85rem;letter-spacing:.35em;color:var(--text-muted);margin-top:.3rem;text-align:center;}
  .login-box{background:rgba(22,19,12,0.96);border:1px solid var(--border-gold);padding:2.25rem 2.5rem;border-radius:4px;width:100%;max-width:400px;display:flex;flex-direction:column;gap:1rem;backdrop-filter:blur(10px);}
  .pot-bar{background:rgba(30,26,16,0.92);border:1px solid var(--border-gold);border-radius:4px;padding:1.1rem 1.5rem;display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;gap:1rem;flex-wrap:wrap;backdrop-filter:blur(4px);}
  .pot-val{font-family:'Cinzel',serif;font-size:2rem;color:var(--gold);font-weight:600;}
  .pot-lbl{font-family:'Cinzel',serif;font-size:.78rem;color:var(--text-muted);letter-spacing:.1em;text-transform:uppercase;}
  .settings-bar{background:rgba(30,26,16,0.92);border:1px solid var(--border-gold);border-radius:4px;padding:.9rem 1.5rem;display:flex;align-items:center;gap:1.75rem;margin-bottom:1.5rem;flex-wrap:wrap;backdrop-filter:blur(4px);}
  .settings-bar input{width:100px;}
  .tabs{display:flex;border-bottom:1px solid var(--border-gold);margin-bottom:1.5rem;}
  .tab{font-family:'Cinzel',serif;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;padding:.7rem 1.4rem;cursor:pointer;color:var(--text-muted);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s;}
  .tab:hover{color:var(--text-bright);}
  .tab.active{color:var(--gold);border-bottom-color:var(--gold);}
  .sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.2rem;flex-wrap:wrap;gap:.5rem;}
  .sec-title{font-family:'Cinzel',serif;font-size:1.15rem;color:var(--gold);letter-spacing:.08em;font-weight:500;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1.2rem;margin-bottom:1.75rem;}
  .card{background:rgba(30,26,16,0.93);border:1px solid var(--border-gold);border-radius:5px;padding:1.2rem 1.3rem;display:flex;flex-direction:column;gap:.7rem;position:relative;transition:border-color .2s;backdrop-filter:blur(4px);}
  .card:hover{border-color:var(--border-gold-strong);}
  .card.leading{border-color:rgba(212,169,60,0.7);}
  .card.expiring{border-color:rgba(255,96,96,0.6);}
  .card.queued{border-color:rgba(212,169,60,0.18);opacity:.88;}
  .card.paused{border-color:rgba(240,168,48,0.55);}
  .item-header{display:flex;align-items:center;gap:.75rem;}
  .item-icon{width:48px;height:48px;border-radius:4px;border:1px solid rgba(212,169,60,0.35);flex-shrink:0;object-fit:cover;}
  .item-icon-placeholder{width:48px;height:48px;border-radius:4px;border:1px solid rgba(212,169,60,0.2);background:var(--bg-input);flex-shrink:0;}
  .item-name{font-family:'Cinzel',serif;font-size:1.05rem;font-weight:500;}
  .item-name.epic{color:var(--epic);}
  .item-name.rare{color:var(--rare);}
  .item-name.uncommon{color:var(--uncommon);}
  .item-name.common{color:var(--common);}
  .item-name.poor{color:var(--poor);}
  .item-name.legendary{color:#ff8000;}
  .item-slot{font-size:.9rem;color:var(--text-muted);}
  .bid-section{border-top:1px solid rgba(212,169,60,0.15);padding-top:.7rem;display:flex;flex-direction:column;gap:.55rem;}
  .bid-amt{font-family:'Cinzel',serif;font-size:1.3rem;color:var(--gold-light);font-weight:500;}
  .bid-ldr{font-size:.88rem;color:var(--text-muted);}
  .bid-ldr.you{color:var(--green);}
  .min-bid-note{font-size:.85rem;color:var(--text-muted);}
  .quick-bids{display:flex;gap:.45rem;flex-wrap:wrap;}
  .qb{font-family:'Cinzel',serif;font-size:.75rem;letter-spacing:.05em;cursor:pointer;border-radius:3px;padding:.35rem .7rem;background:rgba(212,169,60,0.1);border:1px solid var(--border-gold);color:var(--gold-light);transition:all .15s;}
  .qb:hover{background:rgba(212,169,60,0.22);border-color:var(--gold);}
  .qb-custom{background:rgba(212,169,60,0.05);color:var(--text-muted);border-style:dashed;}
  .qb-custom.active-custom{background:rgba(212,169,60,0.15);border-color:var(--gold);color:var(--gold);border-style:solid;}
  .custom-bid-row{display:flex;gap:.45rem;align-items:center;}
  .custom-bid-row input{flex:1;padding:.45rem .6rem;font-size:1rem;}
  .badge{font-family:'Cinzel',serif;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;padding:.22rem .55rem;border-radius:2px;position:absolute;top:.85rem;right:.85rem;}
  .badge-open{background:rgba(96,204,128,0.18);color:var(--green);border:1px solid rgba(96,204,128,0.4);}
  .badge-sold{background:rgba(212,169,60,0.12);color:var(--gold-dim);border:1px solid var(--border-gold);}
  .badge-queued{background:rgba(212,169,60,0.08);color:var(--text-muted);border:1px solid var(--border-gold);}
  .badge-paused{background:rgba(240,168,48,0.15);color:var(--amber);border:1px solid rgba(240,168,48,0.45);}
  .badge-expired{background:rgba(255,96,96,0.12);color:var(--red);border:1px solid rgba(255,96,96,0.4);}
  .timer-row{display:flex;align-items:center;gap:.5rem;}
  .timer{font-family:'Cinzel',serif;font-size:.88rem;color:var(--text-muted);letter-spacing:.05em;}
  .timer-bar{flex:1;height:4px;background:rgba(212,169,60,0.18);border-radius:2px;overflow:hidden;}
  .timer-fill{height:100%;background:var(--gold);border-radius:2px;transition:width .9s linear;}
  .hist{font-size:.9rem;color:var(--text-muted);max-height:110px;overflow-y:auto;border-top:1px solid rgba(212,169,60,0.12);padding-top:.5rem;display:flex;flex-direction:column;gap:.22rem;}
  .hist-row{display:flex;justify-content:space-between;}
  .you-bid{color:var(--green);}
  .empty{text-align:center;padding:3rem 1rem;color:var(--text-muted);border:1px dashed var(--border-gold);border-radius:4px;background:rgba(30,26,16,0.75);font-size:1rem;}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.78);display:flex;align-items:center;justify-content:center;z-index:50;}
  .modal{background:#161310;border:1px solid var(--border-gold-strong);border-radius:4px;padding:1.5rem 1.75rem;width:400px;display:flex;flex-direction:column;gap:.85rem;max-height:90vh;overflow-y:auto;}
  .modal-title{font-family:'Cinzel',serif;font-size:1rem;color:var(--gold);letter-spacing:.08em;font-weight:500;}
  .q-row{display:flex;gap:.5rem;}
  .q-btn-base{flex:1;padding:.55rem .4rem;border:2px solid #444;background:#1a1a1a;color:#888;cursor:pointer;border-radius:4px;font-family:'Cinzel',serif;font-size:.7rem;letter-spacing:.06em;font-weight:500;}
  .modal-divider{height:1px;background:var(--border-gold);margin:.25rem 0;}
  .modal-actions{display:flex;gap:.5rem;justify-content:flex-end;margin-top:.35rem;}
  .toast{position:fixed;bottom:1.25rem;right:1.25rem;background:rgba(30,26,20,0.97);border:1px solid var(--border-gold-strong);color:var(--text-bright);padding:.6rem 1.1rem;border-radius:4px;font-size:.88rem;z-index:200;opacity:0;transform:translateY(6px);transition:all .2s;pointer-events:none;}
  .toast.show{opacity:1;transform:translateY(0);}
  .three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.5rem;}
  .rl-controls{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.2rem;}
  .search-wrap{position:relative;}
  .search-preview{display:flex;align-items:center;gap:.5rem;padding:.35rem .5rem;background:rgba(201,168,76,0.06);border:1px solid var(--border-gold);border-radius:3px;margin-top:.3rem;}
  .search-preview img{width:24px;height:24px;border-radius:2px;}
  .search-preview-name{font-size:.85rem;}
  .search-preview-name.epic{color:var(--epic);}
  .search-preview-name.rare{color:var(--rare);}
  .search-preview-name.uncommon{color:var(--uncommon);}
  .search-preview-name.legendary{color:#ff8000;}
  .search-preview-clear{margin-left:auto;cursor:pointer;color:var(--text-muted);font-size:.75rem;background:none;border:none;font-family:'Cinzel',serif;letter-spacing:.05em;}
  .search-preview-clear:hover{color:var(--red);}
  .dropdown{position:absolute;top:100%;left:0;right:0;background:#1a1612;border:1px solid var(--border-gold-strong);border-radius:3px;z-index:200;max-height:240px;overflow-y:auto;margin-top:2px;box-shadow:0 4px 16px rgba(0,0,0,0.7);}
  .dropdown-item{display:flex;align-items:center;gap:.6rem;padding:.45rem .65rem;cursor:pointer;transition:background .1s;}
  .dropdown-item:hover{background:rgba(201,168,76,0.1);}
  .dropdown-item img{width:24px;height:24px;border-radius:2px;flex-shrink:0;}
  .dropdown-item-icon-placeholder{width:24px;height:24px;border-radius:2px;background:var(--bg-input);flex-shrink:0;}
  .dropdown-item-name{font-size:.9rem;text-decoration:none !important;}
  a.dropdown-item-name:link,a.dropdown-item-name:visited,a.dropdown-item-name:hover{text-decoration:none !important;}
  .dropdown-item-name.epic{color:var(--epic) !important;}
  .dropdown-item-name.rare{color:var(--rare) !important;}
  .dropdown-item-name.uncommon{color:var(--uncommon) !important;}
  .dropdown-item-name.legendary{color:#ff8000 !important;}
  .dropdown-item-name.common{color:var(--text-bright) !important;}
  .dropdown-item-name.poor{color:var(--poor) !important;}
  .dropdown-item-sub{font-size:.72rem;color:var(--text-muted);margin-left:auto;white-space:nowrap;}
  .dropdown-status{padding:.6rem .65rem;font-size:.82rem;color:var(--text-muted);}

  /* Side panel */
  .side-panel{position:fixed;top:0;right:-420px;width:400px;height:100vh;background:rgba(16,13,10,0.97);border-left:1px solid var(--border-gold-strong);z-index:100;transition:right .3s ease;display:flex;flex-direction:column;backdrop-filter:blur(8px);}
  .side-panel.open{right:0;}
  .side-panel-hdr{padding:1rem 1.25rem;border-bottom:1px solid var(--border-gold);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
  .side-panel-title{font-family:'Cinzel',serif;font-size:.9rem;color:var(--gold);letter-spacing:.1em;}
  .side-panel-body{flex:1;overflow-y:auto;padding:1rem 1.25rem;display:flex;flex-direction:column;gap:1rem;}
  .raider-row{background:rgba(30,26,20,0.8);border:1px solid var(--border-gold);border-radius:4px;padding:.75rem .9rem;}
  .raider-name{font-family:'Cinzel',serif;font-size:.85rem;color:var(--gold-light);margin-bottom:.4rem;display:flex;justify-content:space-between;}
  .raider-total{font-family:'Cinzel',serif;font-size:.8rem;color:var(--gold);}
  .raider-item{display:flex;align-items:center;gap:.5rem;font-size:.78rem;color:var(--text-muted);padding:.2rem 0;}
  .raider-item img{width:20px;height:20px;border-radius:2px;}
  .raider-item-name{flex:1;}
  .raider-item-price{color:var(--gold-light);font-family:'Cinzel',serif;font-size:.75rem;}

  /* My loot box (raider view) */
  .my-loot{background:rgba(30,26,20,0.9);border:1px solid var(--border-gold);border-radius:4px;padding:.9rem 1.25rem;margin-bottom:1.25rem;backdrop-filter:blur(4px);}
  .my-loot-title{font-family:'Cinzel',serif;font-size:.7rem;letter-spacing:.12em;color:var(--text-muted);text-transform:uppercase;margin-bottom:.6rem;}
  .my-loot-items{display:flex;flex-direction:column;gap:.3rem;}
  .my-loot-item{display:flex;align-items:center;gap:.5rem;font-size:.82rem;}
  .my-loot-item img{width:22px;height:22px;border-radius:2px;}
  .my-loot-total{font-family:'Cinzel',serif;font-size:.85rem;color:var(--gold);margin-top:.5rem;border-top:1px solid var(--border-gold);padding-top:.5rem;}

  /* Splits tab */
  .splits-wrap{display:flex;flex-direction:column;gap:1rem;}
  .splits-summary{background:rgba(30,26,20,0.9);border:1px solid var(--border-gold);border-radius:4px;padding:.9rem 1.25rem;display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;backdrop-filter:blur(4px);}
  .splits-stat{display:flex;flex-direction:column;gap:.2rem;}
  .splits-stat-lbl{font-family:'Cinzel',serif;font-size:.6rem;letter-spacing:.12em;color:var(--text-muted);text-transform:uppercase;}
  .splits-stat-val{font-family:'Cinzel',serif;font-size:1.1rem;color:var(--gold);font-weight:500;}
  .splits-stat-val.warn{color:var(--red);}
  .splits-stat-val.ok{color:var(--green);}
  .role-section{background:rgba(30,26,20,0.9);border:1px solid var(--border-gold);border-radius:4px;overflow:hidden;backdrop-filter:blur(4px);}
  .role-hdr{padding:.6rem 1rem;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border-gold);}
  .role-title{font-family:'Cinzel',serif;font-size:.75rem;letter-spacing:.1em;color:var(--gold);text-transform:uppercase;}
  .role-summary{font-size:.72rem;color:var(--text-muted);}
  .splits-table{width:100%;border-collapse:collapse;}
  .splits-table th{font-family:'Cinzel',serif;font-size:.6rem;letter-spacing:.1em;color:var(--text-muted);text-transform:uppercase;padding:.5rem .75rem;text-align:left;border-bottom:1px solid var(--border-gold);}
  .splits-table td{padding:.45rem .75rem;border-bottom:1px solid rgba(201,168,76,0.08);font-size:.85rem;}
  .splits-table tr:last-child td{border-bottom:none;}
  .splits-table input[type=text]{background:transparent;border:none;border-bottom:1px solid rgba(201,168,76,0.2);border-radius:0;padding:.15rem .25rem;font-size:.85rem;width:100%;}
  .splits-table input[type=number]{background:transparent;border:none;border-bottom:1px solid rgba(201,168,76,0.2);border-radius:0;padding:.15rem .25rem;font-size:.85rem;width:60px;}
  .splits-table input:focus{border-bottom-color:var(--gold);}
  .payout-cell{font-family:'Cinzel',serif;color:var(--gold-light);font-size:.82rem;}
  .add-slot-btn{font-family:'Cinzel',serif;font-size:.6rem;letter-spacing:.08em;cursor:pointer;background:transparent;border:1px dashed var(--border-gold);color:var(--text-muted);padding:.3rem .75rem;border-radius:3px;margin:.5rem .75rem;transition:all .15s;}
  .add-slot-btn:hover{border-color:var(--gold);color:var(--gold);}
  .remove-slot-btn{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:.8rem;padding:.1rem .3rem;}
  .remove-slot-btn:hover{color:var(--red);}
  .admin-cut-bar{background:rgba(30,26,20,0.9);border:1px solid var(--border-gold);border-radius:4px;padding:.75rem 1.25rem;display:flex;align-items:center;gap:1.5rem;backdrop-filter:blur(4px);}
  .sanity-ok{color:var(--green);font-family:'Cinzel',serif;font-size:.72rem;}
  .sanity-warn{color:var(--red);font-family:'Cinzel',serif;font-size:.72rem;}

  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div id="app">
  <div class="hdr">
    <div><div class="logo">Godspeed GDKP</div><div class="logo-sub">Gold DKP Run</div></div>
    <div id="hdr-user" style="display:flex;align-items:center;gap:.6rem;"></div>
  </div>
  <div class="main" id="main">
    <div style="display:flex;align-items:center;justify-content:center;min-height:60vh;flex-direction:column;gap:1rem;">
      <div style="width:32px;height:32px;border:2px solid var(--border-gold);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;"></div>
      <div style="font-family:'Cinzel',serif;font-size:.8rem;color:var(--text-muted);letter-spacing:.15em;">Connecting...</div>
    </div>
  </div>
</div>

<!-- Side Panel -->
<div class="side-panel" id="side-panel">
  <div class="side-panel-hdr">
    <div class="side-panel-title">Raider Summary</div>
    <button class="btn btn-outline btn-sm" onclick="togglePanel()">&#x2715; Close</button>
  </div>
  <div class="side-panel-body" id="side-panel-body"></div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getDatabase, ref, set, get, update, onValue, push, remove }

function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),2800);}
function fmtTime(s){if(s==null||s<0)return'0s';if(s>=60)return Math.floor(s/60)+'m '+(s%60).toString().padStart(2,'0')+'s';return s+'s';}
function auctionList(){return Object.values(auctions||{});}
function pot(){return auctionList().filter(a=>a.status==='sold').reduce((s,a)=>s+(a.currentBid||0),0);}
function raiderCount(){const n=new Set(auctionList().flatMap(a=>Object.values(a.bids||{}).map(b=>b.bidder)));if(user)n.add(user);return Math.max(n.size,1);}
function runRef(p=''){return ref(db,`runs/${runId}${p}`);}
function iconUrl(icon){return icon?`https://wow.zamimg.com/images/wow/icons/medium/${icon}.jpg`:'';}

// Raider loot summary
function getRaiderLoot(name){
  const won=[];
  auctionList().filter(a=>a.status==='sold').forEach(a=>{
    const bids=Object.values(a.bids||{}).sort((x,y)=>y.amount-x.amount);
    if(bids[0]&&bids[0].bidder===name){
      won.push({name:a.name,price:a.currentBid,icon:a.itemIcon||null,quality:a.quality||'common',itemId:a.itemId||null});
    }
  });
  return won;
}

function getAllRaiderLoot(){
  const map={};
  auctionList().filter(a=>a.status==='sold').forEach(a=>{
    const bids=Object.values(a.bids||{}).sort((x,y)=>y.amount-x.amount);
    if(!bids[0])return;
    const winner=bids[0].bidder;
    if(!map[winner])map[winner]=[];
    map[winner].push({name:a.name,price:a.currentBid,icon:a.itemIcon||null,quality:a.quality||'common',itemId:a.itemId||null});
  });
  return map;
}

// ── Search ────────────────────────────────────────────────────────────────
async function searchWowhead(query){
  if(!query||query.length<2){searchResults=[];isSearching=false;refreshDropdown();return;}
  isSearching=true;refreshDropdown();
  try{
    const res=await fetch(`${SEARCH_WORKER_URL}?q=${encodeURIComponent(query)}`);
    if(!res.ok)throw new Error('Worker '+res.status);
    searchResults=await res.json();
  }catch(e){searchResults=[];}
  isSearching=false;refreshDropdown();
}

function refreshDropdown(){
  const dd=document.getElementById('item-dropdown');if(!dd)return;
  if(isSearching){dd.innerHTML='<div class="dropdown-status">Searching...</div>';dd.style.display='block';return;}
  if(!searchResults.length&&searchQuery.length>=2){dd.innerHTML='<div class="dropdown-status">No items found</div>';dd.style.display='block';return;}
  if(!searchResults.length){dd.style.display='none';return;}
  dd.innerHTML=searchResults.map(item=>`
    <div class="dropdown-item" onclick="selectItem(${item.id})">
      ${item.icon?`<img src="${iconUrl(item.icon)}" onerror="this.style.display='none'" />`:'<div class="dropdown-item-icon-placeholder"></div>'}
      <a class="dropdown-item-name ${item.quality||'common'}" href="https://www.wowhead.com/tbc/item=${item.id}" data-wowhead="item=${item.id}&domain=tbc" onclick="return false;">${item.name}</a>
      <span class="dropdown-item-sub">${item.slot||''}</span>
    </div>`).join('');
  dd.style.display='block';
  if(window.$WowheadPower) window.$WowheadPower.refreshLinks();
}

function selectItem(id){
  const item=searchResults.find(r=>r.id===id);if(!item)return;
  selectedItem=item;modalQuality=item.quality==='legendary'?'epic':item.quality||'epic';
  searchQuery=item.name;searchResults=[];
  const inp=document.getElementById('item-search-input');if(inp)inp.value=item.name;
  const dd=document.getElementById('item-dropdown');if(dd)dd.style.display='none';
  const slotInp=document.getElementById('m-slot');if(slotInp&&item.slot)slotInp.value=item.slot;
  renderSearchPreview();
  ['epic','rare','uncommon'].forEach(x=>{
    const b=document.getElementById('q-'+x);if(!b)return;
    const s=x===modalQuality?Q_STYLES[x].on:Q_STYLES[x].off;
    b.setAttribute('style',s+"font-family:'Cinzel',serif;font-size:.7rem;letter-spacing:.06em;font-weight:"+(x===modalQuality?'600':'400')+';');
  });
}

function renderSearchPreview(){
  const wrap=document.getElementById('search-preview-wrap');if(!wrap)return;
  if(!selectedItem){wrap.innerHTML='';return;}
  wrap.innerHTML=`<div class="search-preview">
    ${selectedItem.icon?`<img src="${iconUrl(selectedItem.icon)}" onerror="this.style.display='none'" />`:''}
    <span class="search-preview-name ${selectedItem.quality||'common'}">${selectedItem.name}</span>
    <span class="dropdown-item-sub">${selectedItem.slot||''}</span>
    <button class="search-preview-clear" onclick="clearItemSelection()">&#x2715; Clear</button>
  </div>`;
}

function clearItemSelection(){selectedItem=null;searchQuery='';const inp=document.getElementById('item-search-input');if(inp){inp.value='';inp.focus();}const wrap=document.getElementById('search-preview-wrap');if(wrap)wrap.innerHTML='';}

// ── Tick ──────────────────────────────────────────────────────────────────
function startTick(){
  if(tickInterval)clearInterval(tickInterval);
  tickInterval=setInterval(()=>{
    const now=Date.now();
    auctionList().forEach(a=>{
      if(a.status!=='open'||a.paused||!a.endsAt)return;
      const r=Math.max(0,Math.floor((a.endsAt-now)/1000));
      const pct=Math.round((r/(a.duration||120))*100),urgent=r<=15;
      const fe=document.getElementById('tfill-'+a.id),te=document.getElementById('ttext-'+a.id);
      if(fe){fe.style.width=pct+'%';fe.style.background=urgent?'#e26060':'#c9a84c';}
      if(te){te.textContent=fmtTime(r);te.style.color=urgent?'var(--red)':'var(--text-muted)';}
      if(r===0&&isRL){
        const bids=Object.values(a.bids||{}).sort((x,y)=>y.amount-x.amount);
        if(bids.length>0){
          update(runRef(`/auctions/${a.id}`),{status:'sold',remaining:0});
          toast(a.name+' sold to '+bids[0].bidder+' for '+(a.currentBid||0).toLocaleString()+'g');
        } else {
          update(runRef(`/auctions/${a.id}`),{status:'expired',remaining:0});
          toast(a.name+' expired — no bids placed');
        }
      }
    });
  },1000);
}

function subscribeToRun(){
  if(unsubRun)unsubRun();
  unsubRun=onValue(runRef(),snap=>{
    const data=snap.val()||{};
    auctions=data.auctions||{};
    if(data.settings)raidSettings={...raidSettings,...data.settings};
    if(data.splits&&!splitsLoaded){splits=data.splits;splitsLoaded=true;}
    render();
    if(panelOpen)renderPanel();
  });
}

async function getOrCreateRun(){
  const snap=await get(ref(db,'runs'));const runs=snap.val()||{};
  const keys=Object.keys(runs).filter(k=>!runs[k].archived).sort().reverse();
  if(keys.length>0){runId=keys[0];}
  else{const nr=push(ref(db,'runs'));runId=nr.key;await set(nr,{createdAt:Date.now(),settings:raidSettings,auctions:{}});}
  splitsLoaded=false;
  subscribeToRun();startTick();
}

function join(){
  const name=document.getElementById('li')?.value?.trim();if(!name)return;
  user=name;isRL=document.getElementById('rlcode')?.value===RAID_LEADER_CODE;
  localStorage.setItem('gdkp_user',user);
  localStorage.setItem('gdkp_isRL',isRL?'1':'0');
  getOrCreateRun();renderHdr();
}
function logout(){
  user=null;isRL=false;
  localStorage.removeItem('gdkp_user');
  localStorage.removeItem('gdkp_isRL');
  if(unsubRun)unsubRun();if(tickInterval)clearInterval(tickInterval);panelOpen=false;render();
}

function renderMain(){
  const all=auctionList();
  const queued=all.filter(a=>a.status==='queued'),active=all.filter(a=>a.status==='open'),sold=all.filter(a=>a.status==='sold'),expired=all.filter(a=>a.status==='expired');
  const p=pot();

  // My loot (raider view)
  const myWon=getRaiderLoot(user);
  const myTotal=myWon.reduce((s,i)=>s+i.price,0);
  const myLootHTML=myWon.length?`<div class="my-loot">
    <div class="my-loot-title">Your Loot This Run</div>
    <div class="my-loot-items">${myWon.map(i=>`
      <div class="my-loot-item">
        ${i.icon?`<img src="${iconUrl(i.icon)}" />`:''}
        <span class="item-name ${i.quality}" style="font-size:.8rem;">${i.name}</span>
        <span style="margin-left:auto;font-family:'Cinzel',serif;font-size:.75rem;color:var(--gold-light);">${i.price.toLocaleString()}g</span>
      </div>`).join('')}
    </div>
    <div class="my-loot-total">Total spent: ${myTotal.toLocaleString()}g</div>
  </div>`:'';

  const potBar=isRL?`<div class="pot-bar">
    <div><div class="pot-lbl">Total Pot</div><div style="font-size:.8rem;color:var(--text-muted);">${sold.length} item${sold.length!==1?'s':''} sold</div></div>
    <div class="pot-val">${p.toLocaleString()}g</div>
    <div style="text-align:right;"><div class="pot-lbl">Est. cut (${raiderCount()} raiders)</div><div style="color:var(--gold-light);font-family:'Cinzel',serif;font-size:.95rem;font-weight:500;">${Math.floor(p/raiderCount()).toLocaleString()}g</div></div>
  </div>`:'';

  const settingsBar=isRL?`<div class="settings-bar">
    <div style="font-family:'Cinzel',serif;font-size:.65rem;color:var(--text-muted);letter-spacing:.1em;">Raid defaults</div>
    <div class="fg"><div class="lbl">Default timer (s)</div><input type="number" id="s-timer" value="${raidSettings.defaultTimer}" min="10" max="600" step="10" style="width:85px;" onchange="updateSettings()" /></div>
    <div class="fg"><div class="lbl">Default increment (g)</div><input type="number" id="s-inc" value="${raidSettings.defaultIncrement}" min="1" step="50" style="width:85px;" onchange="updateSettings()" /></div>
    <div style="margin-left:auto;display:flex;gap:.5rem;">
      <button class="btn btn-danger btn-sm" onclick="confirmReset()">&#x21BA; Reset Run</button>
    </div>
  </div>`:'';

  const tabs=`<div class="tabs">
    <div class="tab ${tab==='active'?'active':''}" onclick="setTab('active')">Live (${active.length})</div>
    <div class="tab ${tab==='queued'?'active':''}" onclick="setTab('queued')">Queue (${queued.length})</div>
    <div class="tab ${tab==='sold'?'active':''}" onclick="setTab('sold')">Sold (${sold.length})</div>
    ${expired.length||isRL?`<div class="tab ${tab==='expired'?'active':''}" onclick="setTab('expired')" style="${expired.length?'color:var(--red);':''}">Expired (${expired.length})</div>`:''}
    ${isRL?`<div class="tab ${tab==='splits'?'active':''}" onclick="setTab('splits')">Splits</div>`:''}
  </div>`;

  let secActions='';
  if(isRL&&tab!=='splits'){
    if(tab==='active') secActions=`<div class="rl-controls"><button class="btn btn-outline btn-sm" onclick="openModal()">+ Add Item</button></div>`;
    else if(tab==='queued') secActions=`<div class="rl-controls">${queued.length?`<button class="btn btn-green btn-sm" onclick="startAll()">&#9654; Start All</button>`:''}<button class="btn btn-outline btn-sm" onclick="openModal()">+ Add Item</button></div>`;
  }

  let content='';
  if(tab==='splits'&&isRL){content=renderSplits();}
  else if(tab==='active') content=renderGrid(active,'open');
  else if(tab==='queued') content=renderGrid(queued,'queued');
  else if(tab==='expired') content=renderGrid(expired,'expired');
  else content=renderGrid(sold,'sold');

  const mHTML=modal?(editId?buildModal('Edit Item',auctions[editId],'saveEdit'):buildModal('Add Item to Queue',null,'addToQueue')):'';

  document.getElementById('main').innerHTML=`
    ${potBar}${myLootHTML}${settingsBar}${tabs}
    ${tab!=='splits'?`<div class="sec-hdr"><div class="sec-title">${tab==='active'?'Live Auctions':tab==='queued'?'Auction Queue':tab==='expired'?'Expired (No Bids)':'Sold Items'}</div>${secActions}</div>`:''}

function updateSettings(){
  raidSettings.defaultTimer=Math.max(10,parseInt(document.getElementById('s-timer')?.value)||120);
  raidSettings.defaultIncrement=Math.max(1,parseInt(document.getElementById('s-inc')?.value)||100);
  update(runRef('/settings'),raidSettings);
}

// ── Splits ────────────────────────────────────────────────────────────────
function renderSplits(){
  const p=pot();
  const adminAmt=Math.floor(p*(splits.adminCut/100));
  const distributable=p-adminAmt;
  const totalPct=splits.roles.reduce((s,r)=>s+r.slots.reduce((ss,sl)=>ss+(parseFloat(sl.pct)||0),0),0);
  const sanityOk=Math.abs(totalPct-100)<0.01;

  const roleSections=splits.roles.map((role,ri)=>{
    const rolePct=role.slots.reduce((s,sl)=>s+(parseFloat(sl.pct)||0),0);
    const rolePayout=Math.floor(distributable*(rolePct/100));
    const rows=role.slots.map((sl,si)=>{
      const payout=Math.floor(distributable*((parseFloat(sl.pct)||0)/100));
      return`<tr>
        <td><input type="text" value="${sl.label}" oninput="updateSlot(${ri},${si},'label',this.value)" style="width:80px;" /></td>
        <td><input type="text" value="${sl.player}" oninput="updateSlot(${ri},${si},'player',this.value)" placeholder="Name..." /></td>
        <td><input type="number" value="${sl.pct}" step="0.25" min="0" oninput="updateSlot(${ri},${si},'pct',this.value)" style="width:65px;" /></td>
        <td><div class="payout-cell">${payout.toLocaleString()}g</div></td>
        <td><input type="text" value="${sl.note}" oninput="updateSlot(${ri},${si},'note',this.value)" placeholder="Note..." /></td>
        <td><button class="remove-slot-btn" onclick="removeSlot(${ri},${si})">&#x2715;</button></td>
      </tr>`;
    }).join('');
    return`<div class="role-section">
      <div class="role-hdr">
        <div class="role-title">${role.name}</div>
        <div class="role-summary">${rolePct.toFixed(2)}% &nbsp;|&nbsp; ${rolePayout.toLocaleString()}g</div>
      </div>
      <table class="splits-table">
        <thead><tr><th>Slot</th><th>Name</th><th>%</th><th>Payout</th><th>Note</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <button class="add-slot-btn" onclick="addSlot(${ri})">+ Add Slot</button>
    </div>`;
  }).join('');

  return`<div class="splits-wrap">
    <div class="admin-cut-bar">
      <div style="font-family:'Cinzel',serif;font-size:.65rem;color:var(--text-muted);letter-spacing:.1em;">Admin Cut</div>
      <div class="fg" style="flex-direction:row;align-items:center;gap:.5rem;">
        <input type="number" id="admin-cut-inp" value="${splits.adminCut}" min="0" max="99" step="1" style="width:70px;" oninput="updateAdminCut(this.value)" />
        <span style="font-size:.85rem;color:var(--text-muted);">%</span>
      </div>
      <div style="font-family:'Cinzel',serif;font-size:.85rem;color:var(--gold);">${adminAmt.toLocaleString()}g admin</div>
      <div style="font-family:'Cinzel',serif;font-size:.85rem;color:var(--gold-light);">${distributable.toLocaleString()}g to raiders</div>
      <div style="margin-left:auto;">${sanityOk?`<span class="sanity-ok">&#10003; 100%</span>`:`<span class="sanity-warn">&#9888; ${totalPct.toFixed(2)}% (should be 100%)</span>`}</div>
      <button class="btn btn-outline btn-sm" onclick="saveSplits()">Save</button>
    </div>
    <div class="splits-summary">
      <div class="splits-stat"><div class="splits-stat-lbl">Total Pot</div><div class="splits-stat-val">${p.toLocaleString()}g</div></div>
      <div class="splits-stat"><div class="splits-stat-lbl">Admin (${splits.adminCut}%)</div><div class="splits-stat-val">${adminAmt.toLocaleString()}g</div></div>
      <div class="splits-stat"><div class="splits-stat-lbl">To Raiders</div><div class="splits-stat-val">${distributable.toLocaleString()}g</div></div>
      <div class="splits-stat"><div class="splits-stat-lbl">Sanity</div><div class="splits-stat-val ${sanityOk?'ok':'warn'}">${totalPct.toFixed(2)}%</div></div>
    </div>
    ${roleSections}
  </div>`;
}

function updateSlot(ri,si,field,val){
  splits.roles[ri].slots[si][field]=field==='pct'?parseFloat(val)||0:val;
  // Re-render splits only
  const wrap=document.querySelector('.splits-wrap');
  if(wrap){wrap.outerHTML=renderSplits();}
  // Actually re-render inline
  renderMain();
}

function updateAdminCut(val){splits.adminCut=Math.max(0,Math.min(99,parseFloat(val)||0));renderMain();}
function addSlot(ri){splits.roles[ri].slots.push({label:'New',player:'',pct:1,note:''});renderMain();}
function removeSlot(ri,si){splits.roles[ri].slots.splice(si,1);renderMain();}
function saveSplits(){update(runRef('/splits'),splits);toast('Splits saved');}

// ── Side Panel ────────────────────────────────────────────────────────────
function togglePanel(){
  panelOpen=!panelOpen;
  const panel=document.getElementById('side-panel');
  if(panelOpen){panel.classList.add('open');renderPanel();}
  else panel.classList.remove('open');
}

function renderPanel(){
  const body=document.getElementById('side-panel-body');if(!body)return;
  const lootMap=getAllRaiderLoot();
  const raiders=Object.keys(lootMap).sort();
  if(!raiders.length){body.innerHTML='<div style="color:var(--text-muted);font-size:.85rem;text-align:center;padding:2rem 0;">No items sold yet</div>';return;}
  body.innerHTML=raiders.map(name=>{
    const items=lootMap[name];
    const total=items.reduce((s,i)=>s+i.price,0);
    const itemRows=items.map(i=>`<div class="raider-item">
      ${i.icon?`<img src="${iconUrl(i.icon)}" />`:''}
      <span class="raider-item-name item-name ${i.quality}" style="font-size:.78rem;">${i.name}</span>
      <span class="raider-item-price">${i.price.toLocaleString()}g</span>
    </div>`).join('');
    return`<div class="raider-row">
      <div class="raider-name"><span>${name}</span><span class="raider-total">${total.toLocaleString()}g spent</span></div>
      ${itemRows}
    </div>`;
  }).join('');
}

// ── Reset ─────────────────────────────────────────────────────────────────
function confirmReset(){
  if(!confirm('Archive this run and start a new one?\n\nThe current run will be saved and a fresh run will begin.'))return;
  resetRun();
}

async function resetRun(){
  // Archive current run
  await update(runRef(),{archived:true,archivedAt:Date.now()});
  // Create new run
  const nr=push(ref(db,'runs'));
  runId=nr.key;
  splitsLoaded=false;
  splits=JSON.parse(JSON.stringify(DEFAULT_SPLITS));
  await set(nr,{createdAt:Date.now(),settings:raidSettings,auctions:{}});
  subscribeToRun();
  toast('New run started — previous run archived');
  tab='active';
}

// ── Grids & Cards ─────────────────────────────────────────────────────────
function renderGrid(list,mode){
  if(!list.length){const msgs={open:'No live auctions',queued:'Queue is empty',sold:'No items sold yet'};return`<div class="empty"><div style="font-family:'Cinzel',serif;color:var(--gold-dim);">${msgs[mode]}</div></div>`;}
  return`<div class="grid">${list.map(a=>renderCard(a,mode)).join('')}</div>`;
}

function renderCard(a,mode){
  const bids=Object.values(a.bids||{}).sort((x,y)=>y.amount-x.amount);
  const top=bids[0]||null,isLeading=top&&top.bidder===user;
  const now=Date.now();
  const rem=a.status==='open'&&!a.paused&&a.endsAt?Math.max(0,Math.floor((a.endsAt-now)/1000)):(a.remaining||0);
  const pct=a.status==='open'?Math.round((rem/(a.duration||120))*100):0;
  const urgent=rem<=15&&a.status==='open'&&!a.paused;
  const minNext=(a.currentBid||0)+(a.minIncrement||100);
  const showCustom=!!customOpen[a.id];
  const histItems=bids.slice(0,5).map(b=>`<div class="hist-row"><span class="${b.bidder===user?'you-bid':''}">${b.bidder===user?'You':b.bidder}</span><span>${b.amount.toLocaleString()}g</span></div>`).join('');
  const iconHTML=a.itemIcon?`<img class="item-icon" src="${iconUrl(a.itemIcon)}" onerror="this.style.display='none'" />`:`<div class="item-icon-placeholder"></div>`;
  const nameHTML=a.itemId?`<a class="item-name ${a.quality||'common'}" href="https://www.wowhead.com/tbc/item=${a.itemId}" data-wowhead="item=${a.itemId}&domain=tbc" target="_blank">${a.name}</a>`:`<span class="item-name ${a.quality||'common'}">${a.name}</span>`;
  const itemHeader=`<div class="item-header">${iconHTML}<div>${nameHTML}<div class="item-slot">${a.slot||''}</div></div></div>`;
  let timerSection='';
  if(mode==='open'){const fc=a.paused?'#e8a430':urgent?'#e26060':'#c9a84c',tc=a.paused?'var(--amber)':urgent?'var(--red)':'var(--text-muted)';timerSection=`<div class="timer-row"><div class="timer-bar"><div id="tfill-${a.id}" class="timer-fill" style="width:${pct}%;background:${fc};"></div></div><span id="ttext-${a.id}" class="timer" style="color:${tc};">${a.paused?'Paused':fmtTime(rem)}</span></div>`;}
  let bidSection='';
  if(mode==='open'&&!a.paused){
    const qbtns=[100,250,500].map(b=>`<button class="qb" onclick="quickBid('${a.id}',${(a.currentBid||0)+b})">+${b.toLocaleString()}g</button>`).join('');
    const cbtn=`<button class="qb qb-custom ${showCustom?'active-custom':''}" onclick="toggleCustom('${a.id}')">${showCustom?'&#x2715; Custom':'Custom'}</button>`;
    const crow=showCustom?`<div class="custom-bid-row"><input type="number" id="bid-${a.id}" placeholder="Enter amount..." min="${minNext}" step="${a.minIncrement||100}" onkeydown="if(event.key==='Enter')placeBid('${a.id}')" /><button class="btn btn-outline btn-sm" onclick="placeBid('${a.id}')">Bid</button></div>`:'';
    bidSection=`<div class="bid-section"><div><div class="bid-amt">${(a.currentBid||0).toLocaleString()}g</div><div class="bid-ldr ${isLeading?'you':''}">${top?(top.bidder===user?'You are leading':top.bidder+' leads'):'Starting bid'}</div></div><div class="min-bid-note">Min next: ${minNext.toLocaleString()}g</div><div class="quick-bids">${qbtns}${cbtn}</div>${crow}</div>`;
  }else if(mode==='open'&&a.paused){bidSection=`<div class="bid-section"><div class="bid-amt">${(a.currentBid||0).toLocaleString()}g</div><div style="font-size:.78rem;color:var(--amber);">Bidding paused</div></div>`;}
  else if(mode==='queued'){bidSection=`<div class="bid-section"><div class="bid-amt">${(a.currentBid||0).toLocaleString()}g</div><div class="min-bid-note">Min next: ${minNext.toLocaleString()}g (+${(a.minIncrement||100).toLocaleString()}g)</div></div>`;}
  else if(mode==='sold'){bidSection=`<div class="bid-section"><div class="bid-amt">${(a.currentBid||0).toLocaleString()}g</div><div class="bid-ldr">Won by ${top?top.bidder:'&mdash;'}</div></div>`;}
  else if(mode==='expired'){bidSection=`<div class="bid-section"><div class="bid-amt">${(a.currentBid||0).toLocaleString()}g</div><div style="font-size:.85rem;color:var(--red);">No bids placed</div></div>`;}
  let rlControls='';
  if(isRL){
    if(mode==='open')rlControls=`<div class="rl-controls"><button class="btn ${a.paused?'btn-amber-resume':'btn-amber'} btn-sm" onclick="togglePause('${a.id}')">${a.paused?'&#9654; Resume':'&#9646;&#9646; Pause'}</button><button class="btn btn-outline btn-sm" onclick="extendTimer('${a.id}')">+30s</button><button class="btn btn-danger btn-sm" onclick="closeAuction('${a.id}')">Close</button></div>`;
    else if(mode==='queued')rlControls=`<div class="rl-controls"><button class="btn btn-green btn-sm" onclick="startOne('${a.id}')">&#9654; Start</button><button class="btn btn-outline btn-sm" onclick="openEdit('${a.id}')">Edit</button><button class="btn btn-danger btn-sm" onclick="removeQueued('${a.id}')">Remove</button></div>`;
    else if(mode==='expired')rlControls=`<div class="rl-controls"><button class="btn btn-green btn-sm" onclick="restartAuction('${a.id}')">&#9654; Restart</button><button class="btn btn-danger btn-sm" onclick="removeQueued('${a.id}')">Remove</button></div>`;
  }
  const cc=mode==='queued'?'queued':mode==='expired'?'expiring':isLeading?'leading':a.paused?'paused':urgent?'expiring':'';
  let badge='';
  if(mode==='open'&&a.paused)badge=`<div class="badge badge-paused">Paused</div>`;
  else if(mode==='open')badge=`<div class="badge badge-open">Live</div>`;
  else if(mode==='queued')badge=`<div class="badge badge-queued">Queued</div>`;
  else if(mode==='expired')badge=`<div class="badge badge-expired">Expired</div>`;
  else badge=`<div class="badge badge-sold">Sold</div>`;
  return`<div class="card ${cc}" id="card-${a.id}">${badge}${itemHeader}${timerSection}${bidSection}${bids.length?`<div class="hist">${histItems}</div>`:''}${rlControls}</div>`;
}

// ── Actions ───────────────────────────────────────────────────────────────
function addToQueue(){
  if(!selectedItem){toast('Please search and select an item first');return;}
  const nr=push(runRef('/auctions'));
  const dur=Math.max(10,parseInt(document.getElementById('m-timer')?.value)||raidSettings.defaultTimer);
  set(nr,{id:nr.key,name:selectedItem.name,slot:document.getElementById('m-slot')?.value?.trim()||selectedItem.slot||'Unknown',quality:selectedItem.quality==='legendary'?'legendary':modalQuality,itemId:selectedItem.id,itemIcon:selectedItem.icon||null,currentBid:parseInt(document.getElementById('m-start')?.value)||1000,minIncrement:Math.max(1,parseInt(document.getElementById('m-inc')?.value)||raidSettings.defaultIncrement),duration:dur,bids:{},status:'queued',remaining:dur,paused:false,endsAt:null});
  modal=false;selectedItem=null;searchQuery='';tab='queued';toast(selectedItem?.name||'Item'+' added to queue');
}
function saveEdit(){
  const name=document.getElementById('m-name')?.value?.trim();if(!name){toast('Enter a name');return;}
  update(runRef(`/auctions/${editId}`),{name,slot:document.getElementById('m-slot')?.value?.trim()||'Unknown',quality:modalQuality,currentBid:parseInt(document.getElementById('m-start')?.value)||1000,minIncrement:Math.max(1,parseInt(document.getElementById('m-inc')?.value)||raidSettings.defaultIncrement),duration:Math.max(10,parseInt(document.getElementById('m-timer')?.value)||raidSettings.defaultTimer)});
  modal=false;editId=null;toast(name+' updated');
}
function startOne(id){const a=auctions[id];if(!a||a.status!=='queued')return;update(runRef(`/auctions/${id}`),{status:'open',paused:false,endsAt:Date.now()+a.duration*1000,remaining:a.duration});toast(a.name+' started!');tab='active';}
function startAll(){const now=Date.now();auctionList().filter(a=>a.status==='queued').forEach(a=>{update(runRef(`/auctions/${a.id}`),{status:'open',paused:false,endsAt:now+a.duration*1000,remaining:a.duration});});toast('All auctions started!');tab='active';}
function togglePause(id){const a=auctions[id];if(!a||a.status!=='open')return;if(a.paused){update(runRef(`/auctions/${id}`),{paused:false,endsAt:Date.now()+(a.remaining||0)*1000});toast(a.name+' resumed');}else{update(runRef(`/auctions/${id}`),{paused:true,remaining:Math.max(0,Math.floor((a.endsAt-Date.now())/1000))});toast(a.name+' paused');}}
function extendTimer(id){const a=auctions[id];if(!a||a.status!=='open')return;if(a.paused){update(runRef(`/auctions/${id}`),{remaining:(a.remaining||0)+30});}else{update(runRef(`/auctions/${id}`),{endsAt:(a.endsAt||Date.now())+30000});}toast('+30s added to '+a.name);}
function closeAuction(id){const a=auctions[id];if(!a)return;const bids=Object.values(a.bids||{}).sort((x,y)=>y.amount-x.amount);update(runRef(`/auctions/${id}`),{status:'sold',remaining:0,paused:false});toast(a.name+' closed — '+(bids[0]?bids[0].bidder:'nobody')+' wins for '+(a.currentBid||0).toLocaleString()+'g');}
function restartAuction(id){
  const a=auctions[id];if(!a||a.status!=='expired')return;
  update(runRef(`/auctions/${id}`),{status:'queued',remaining:a.duration,paused:false,endsAt:null,bids:{}});
  toast(a.name+' moved back to queue');tab='queued';
}
function removeQueued(id){remove(runRef(`/auctions/${id}`));toast('Removed from queue');}
function quickBid(id,amount){const a=auctions[id];if(!a||a.status!=='open'||a.paused)return;const mn=(a.currentBid||0)+(a.minIncrement||100);if(amount<mn){toast('Below min of '+mn.toLocaleString()+'g');return;}submitBid(id,amount);}
function placeBid(id){const inp=document.getElementById('bid-'+id);const val=parseInt(inp?.value);const a=auctions[id];if(!a||a.status!=='open'||a.paused)return;const mn=(a.currentBid||0)+(a.minIncrement||100);if(!val||val<mn){toast('Min bid is '+mn.toLocaleString()+'g');return;}customOpen[id]=false;submitBid(id,val);if(inp)inp.value='';}
function submitBid(id,val){const a=auctions[id];if(!a)return;const br=push(runRef(`/auctions/${id}/bids`));set(br,{bidder:user,amount:val,ts:Date.now()});update(runRef(`/auctions/${id}`),{currentBid:val});if(!a.paused&&a.endsAt&&Math.floor((a.endsAt-Date.now())/1000)<30){update(runRef(`/auctions/${id}`),{endsAt:Date.now()+30000,remaining:30});toast('Bid: '+val.toLocaleString()+'g — timer extended to 30s');return;}toast('Bid placed: '+val.toLocaleString()+'g');}
function toggleCustom(id){customOpen[id]=!customOpen[id];const a=auctions[id];if(!a)return;const el=document.getElementById('card-'+id);if(el){const t=document.createElement('div');t.innerHTML=renderCard(a,a.status==='open'?'open':a.status==='queued'?'queued':'sold');el.replaceWith(t.firstElementChild);}}
function onSearchInput(val){searchQuery=val;if(selectedItem&&val!==selectedItem.name){selectedItem=null;const w=document.getElementById('search-preview-wrap');if(w)w.innerHTML='';}clearTimeout(searchTimer);if(val.length<2){const dd=document.getElementById('item-dropdown');if(dd)dd.style.display='none';return;}searchTimer=setTimeout(()=>searchWowhead(val),350);}
function setQ(q){modalQuality=q;['epic','rare','uncommon'].forEach(x=>{const b=document.getElementById('q-'+x);if(!b)return;const s=x===q?Q_STYLES[x].on:Q_STYLES[x].off;b.setAttribute('style',s+"font-family:'Cinzel',serif;font-size:.7rem;letter-spacing:.06em;font-weight:"+(x===q?'600':'400')+';');});}
function openModal(){modal=true;editId=null;modalQuality='epic';selectedItem=null;searchQuery='';render();}
function openEdit(id){const a=auctions[id];if(!a)return;modal=true;editId=id;modalQuality=a.quality==='legendary'?'epic':a.quality||'epic';render();}
function closeModal(){modal=false;editId=null;selectedItem=null;searchQuery='';render();}
function setTab(t){tab=t;render();}

document.addEventListener('click',e=>{
  const dd=document.getElementById('item-dropdown');
  if(dd&&!dd.contains(e.target)&&e.target.id!=='item-search-input')dd.style.display='none';
});

Object.assign(window,{join,logout,setTab,openModal,closeModal,openEdit,addToQueue,saveEdit,startOne,startAll,togglePause,extendTimer,closeAuction,removeQueued,restartAuction,quickBid,placeBid,toggleCustom,setQ,updateSettings,onSearchInput,selectItem,clearItemSelection,togglePanel,confirmReset,updateSlot,updateAdminCut,addSlot,removeSlot,saveSplits});

// Restore session on refresh
const _savedUser=localStorage.getItem('gdkp_user');
const _savedIsRL=localStorage.getItem('gdkp_isRL');
if(_savedUser){user=_savedUser;isRL=_savedIsRL==='1';getOrCreateRun();}
else render();
</script>
</body>
</html>
