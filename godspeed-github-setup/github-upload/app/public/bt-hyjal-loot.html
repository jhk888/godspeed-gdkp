<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#d4a93c;--gold-light:#f0cc6a;--gold-dim:#8a6830;
  --bg-deep:#0e0c09;--bg-panel:#1a1610;--bg-card:#221d14;--bg-input:#161208;
  --line:rgba(212,169,60,.28);--line-strong:rgba(212,169,60,.6);
  --text:#f8f0d8;--muted:#a89060;
  --epic:#b44aff;--rare:#2288ff;--uncommon:#44ff44;--common:#ffffff;--legendary:#ff8000;
}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--bg-deep);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.45;
  background-image:radial-gradient(ellipse at 50% -10%,rgba(212,169,60,.07),transparent 60%)}
a{color:inherit;text-decoration:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 14px 64px}

header{padding:26px 0 14px;text-align:center}
h1{font-family:Cinzel,serif;font-weight:600;font-size:1.72rem;color:var(--gold-light);letter-spacing:.02em}
.sub{color:var(--muted);font-size:.82rem;margin-top:4px}

.controls{position:sticky;top:0;z-index:30;background:linear-gradient(var(--bg-deep) 78%,rgba(14,12,9,.92));
  padding:10px 0 12px;border-bottom:1px solid var(--line)}
.searchbox{position:relative}
.searchbox input{width:100%;padding:13px 42px 13px 15px;background:var(--bg-input);border:1px solid var(--line-strong);
  border-radius:6px;color:var(--text);font-family:inherit;font-size:1.02rem;outline:none}
.searchbox input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,169,60,.15)}
.searchbox input::placeholder{color:#6d5c38}
#clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);
  font-size:1.35rem;line-height:1;cursor:pointer;padding:4px 10px;display:none}
#clear:hover{color:var(--gold-light)}

.filters{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-top:9px}
.seg{display:flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.seg button{background:transparent;border:none;color:var(--muted);font-family:Cinzel,serif;font-size:.78rem;
  padding:6px 13px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:rgba(212,169,60,.16);color:var(--gold-light)}
select{background:var(--bg-input);border:1px solid var(--line);border-radius:5px;color:var(--text);
  font-family:inherit;font-size:.8rem;padding:6px 9px;outline:none;cursor:pointer}
select:focus{border-color:var(--gold)}
.count{margin-left:auto;color:var(--muted);font-size:.78rem;font-family:Cinzel,serif}

.bosshead{display:flex;align-items:baseline;gap:10px;margin:26px 0 9px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.bosshead h2{font-family:Cinzel,serif;font-weight:500;font-size:1.06rem;color:var(--gold)}
.bosshead .raid{color:var(--muted);font-size:.72rem}
.bosshead .num{margin-left:auto;color:var(--gold-dim);font-size:.72rem}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(322px,1fr));gap:8px}
.item{display:flex;gap:11px;padding:9px 11px;background:var(--bg-card);border:1px solid rgba(212,169,60,.14);
  border-radius:5px;align-items:flex-start}
.item:hover{border-color:var(--line-strong);background:#282217}
.item img{width:44px;height:44px;border-radius:4px;border:1px solid var(--line);flex-shrink:0;display:block}
.body{min-width:0;flex:1}
.name{font-weight:600;font-size:.93rem;line-height:1.25}
.q4{color:var(--epic)}.q3{color:var(--rare)}.q2{color:var(--uncommon)}.q1{color:var(--common)}.q5{color:var(--legendary)}
.meta{color:var(--muted);font-size:.74rem;margin-top:2px}
.stats{margin-top:5px;font-size:.75rem;color:#c6b184}
.stats div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats .eq{color:#8fbf7a}
.src{color:var(--gold-dim);font-size:.7rem;margin-top:4px;font-family:Cinzel,serif}
mark{background:rgba(212,169,60,.28);color:var(--gold-light);border-radius:2px;padding:0 1px}

.empty{text-align:center;padding:56px 16px;color:var(--muted)}
.empty strong{display:block;font-family:Cinzel,serif;color:var(--gold);font-size:1.05rem;margin-bottom:6px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--bg-panel);
  border:1px solid var(--line-strong);color:var(--gold-light);font-size:.82rem;padding:9px 16px;border-radius:5px;
  opacity:0;pointer-events:none;transition:opacity .18s}
.toast.on{opacity:1}

@media (max-width:600px){
  h1{font-size:1.34rem}
  .grid{grid-template-columns:1fr}
  .count{width:100%;margin:2px 0 0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

,"b":"Patterns","r":"Black Temple","d":["Requires","Leatherworking","(375)","Use: Teaches you how to craft Swiftstrike Shoulders."]},{"id":32754,"n":"Pattern: Bracers of Nimble Thought","q":4,"ic":"inv_scroll_04","il":70,"s":"Wrist","t":"Cloth","b":"Patterns","r":"Black Temple","d":["Requires","Tailoring","(375)","Use: Teaches you how to sew Bracers of Nimble Thought."]},{"id":32755,"n":"Pattern: Mantle of Nimble Thought","q":4,"ic":"inv_scroll_04","il":70,"s":"Shoulder","t":"Cloth","b":"Patterns","r":"Black Temple","d":["Requires","Tailoring","(375)","Use: Teaches you how to sew a Mantle of Nimble Thought."]},{"id":32753,"n":"Pattern: Swiftheal Mantle","q":4,"ic":"inv_scroll_04","il":70,"s":"Shoulder","t":"Cloth","b":"Patterns","r":"Black Temple","d":["Requires","Tailoring","(375)","Use: Teaches you how to sew a Swiftheal Mantle."]},{"id":32752,"n":"Pattern: Swiftheal Wraps","q":4,"ic":"inv_scroll_04","il":70,"s":"Wrist","t":"Cloth","b":"Patterns","r":"Black Temple","d":["Requires","Tailoring","(375)","Use: Teaches you how to sew a Swiftheal Wraps."]}];
const ORDER = [];
ITEMS.forEach(i=>{const k=i.r+'|'+i.b; if(!ORDER.includes(k))ORDER.push(k);});
ITEMS.forEach((i,n)=>{i._o=n; i._k=norm([i.n,i.s,i.t,i.b,i.r,String(i.id),i.d.join(' ')].join(' '));});

document.getElementById('total').textContent = ITEMS.length;

function norm(s){return s.toLowerCase().replace(/['’]/g,'').replace(/[^a-z0-9]+/g,' ').trim();}

/* ---- fill in the gaps: aliases so plain words find the right stat text ---- */
const ALIAS = {
  ap:'attack power', sp:'spell damage', hit:'hit rating', crit:'critical strike rating',
  haste:'haste rating', mp5:'mana per 5', dodge:'dodge rating', parry:'parry rating',
  def:'defense rating', defense:'defense rating', resil:'resilience rating',
  resilience:'resilience rating', arp:'armor penetration', sta:'stamina', str:'strength',
  agi:'agility', int:'intellect', spi:'spirit', heal:'healing', healing:'healing done',
  spelldmg:'spell damage', spellpower:'damage and healing', tank:'defense rating',
  weapon:'weapon', gun:'gun', bow:'bow', xbow:'crossbow', glaive:'warglaive',
  token:'forgotten', tier:'forgotten', t6:'forgotten', dps:'attack power',
  '1h':'one hand', '2h':'two hand', oh:'off hand', mh:'main hand',
  legs:'legs', chest:'chest', head:'head', helm:'head', boots:'feet', gloves:'hands',
  belt:'waist', bracers:'wrist', cloak:'back', ring:'finger', neck:'neck', trink:'trinket'
};

function expand(word){return ALIAS[word] ? word+' '+ALIAS[word] : word;}

function lev(a,b){
  if(Math.abs(a.length-b.length)>2)return 9;
  const m=a.length,n=b.length,d=[];
  for(let i=0;i<=m;i++)d[i]=[i];
  for(let j=0;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[m][n];
}

function score(item,q,words){
  const n=norm(item.n), hay=item._k;
  if(/^\d+$/.test(q))return String(item.id)===q?1000:0;
  if(n===q)return 1000;
  if(n.startsWith(q))return 900-n.length;
  if(n.includes(q))return 700-n.indexOf(q);
  if(hay.includes(q))return 500;
  let total=0;
  const hayWords=hay.split(' ');
  for(const w0 of words){
    const w=expand(w0);
    let best=0;
    for(const part of w.split(' ')){
      if(!part)continue;
      if(hay.includes(part)){best=Math.max(best,part.length>=3?40:20);continue;}
      if(part.length>=4){
        for(const hw of hayWords){
          if(hw.startsWith(part.slice(0,Math.max(3,part.length-1)))){best=Math.max(best,18);break;}
          if(lev(part,hw)<=1){best=Math.max(best,12);break;}
        }
      }
    }
    if(!best)return 0;
    total+=best;
  }
  return total;
}

const state={q:'',raid:'',boss:'',slot:'',type:'',sort:'boss'};

function fill(sel,vals,label){
  const el=document.getElementById(sel);
  const cur=el.value;
  el.innerHTML='<option value="">'+label+'</option>'+
    vals.map(v=>'<option value="'+v.replace(/"/g,'&quot;')+'">'+v+'</option>').join('');
  if(vals.includes(cur))el.value=cur; else el.value='';
}
function uniq(arr){return [...new Set(arr)].filter(Boolean);}

function rebuildFilters(){
  const pool=ITEMS.filter(i=>!state.raid||i.r===state.raid);
  fill('boss',uniq(pool.map(i=>i.b)),'Any boss');
  fill('slot',uniq(pool.map(i=>i.s)).sort(),'Any slot');
  fill('type',uniq(pool.map(i=>i.t)).sort(),'Any armor / weapon');
}

function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function highlight(text,words){
  let out=esc(text);
  for(const w of words){
    if(w.length<2)continue;
    out=out.replace(new RegExp('('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>');
  }
  return out;
}

function render(){
  const q=norm(state.q);
  const words=q?q.split(' ').filter(w=>w.length>1):[];
  let list=ITEMS.filter(i=>
    (!state.raid||i.r===state.raid)&&(!state.boss||i.b===state.boss)&&
    (!state.slot||i.s===state.slot)&&(!state.type||i.t===state.type));

  if(q){
    list=list.map(i=>({i,s:score(i,q,words)})).filter(x=>x.s>0)
             .sort((a,b)=>b.s-a.s||a.i._o-b.i._o).map(x=>x.i);
  }
  if(state.sort==='name')list=[...list].sort((a,b)=>a.n.localeCompare(b.n));
  else if(state.sort==='ilvl')list=[...list].sort((a,b)=>b.il-a.il||a.n.localeCompare(b.n));
  else if(state.sort==='slot')list=[...list].sort((a,b)=>a.s.localeCompare(b.s)||a.n.localeCompare(b.n));
  else if(!q)list=[...list].sort((a,b)=>a._o-b._o);

  document.getElementById('count').textContent=list.length+' of '+ITEMS.length;
  const res=document.getElementById('results');

  if(!list.length){
    res.innerHTML='<div class="empty"><strong>Nothing matched.</strong>Try fewer words, or search a boss name like Illidan or a slot like legs.</div>';
    return;
  }

  const groupByBoss = !q && state.sort==='boss';
  let html='';
  if(groupByBoss){
    const groups={};
    list.forEach(i=>{const k=i.r+'|'+i.b;(groups[k]=groups[k]||[]).push(i);});
    ORDER.filter(k=>groups[k]).forEach(k=>{
      const [raid,boss]=k.split('|');
      html+='<div class="bosshead"><h2>'+esc(boss)+'</h2><span class="raid">'+esc(raid)+
            '</span><span class="num">'+groups[k].length+'</span></div><div class="grid">'+
            groups[k].map(card).join('')+'</div>';
    });
  }else{
    html='<div class="grid">'+list.map(i=>card(i,words)).join('')+'</div>';
  }
  res.innerHTML=html;
  if(window.$WowheadPower&&window.$WowheadPower.refreshLinks)window.$WowheadPower.refreshLinks();
}

function card(i,words){
  words=words||[];
  const icon='https://wow.zamimg.com/images/wow/icons/large/'+i.ic+'.jpg';
  const meta=[i.il?'ilvl '+i.il:'',i.s,i.t].filter(Boolean).join(' &middot; ');
  const stats=i.d.slice(0,5).map(l=>'<div'+(/^(Equip|Use|Chance)/.test(l)?' class="eq"':'')+'>'+
    highlight(l,words)+'</div>').join('');
  return '<div class="item">'+
    '<a href="https://www.wowhead.com/tbc/item='+i.id+'" data-wowhead="item='+i.id+'&domain=tbc" target="_blank" rel="noopener">'+
    '<img loading="lazy" decoding="async" src="'+icon+'" alt="" onerror="this.style.visibility=\'hidden\'"></a>'+
    '<div class="body">'+
      '<div class="name q'+i.q+'" data-copy="'+esc(i.n)+'" style="cursor:pointer">'+highlight(i.n,words)+'</div>'+
      '<div class="meta">'+meta+'</div>'+
      (stats?'<div class="stats">'+stats+'</div>':'')+
      '<div class="src">'+esc(i.b)+' &middot; '+esc(i.r)+'</div>'+
    '</div></div>';
}

/* events */
const qEl=document.getElementById('q'),clearEl=document.getElementById('clear');
qEl.addEventListener('input',()=>{state.q=qEl.value;clearEl.style.display=qEl.value?'block':'none';render();});
clearEl.addEventListener('click',()=>{qEl.value='';state.q='';clearEl.style.display='none';qEl.focus();render();});
document.getElementById('raidseg').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  [...e.currentTarget.children].forEach(x=>x.setAttribute('aria-pressed',x===b));
  state.raid=b.dataset.raid;state.boss='';rebuildFilters();render();
});
['boss','slot','type','sort'].forEach(id=>{
  document.getElementById(id).addEventListener('change',e=>{state[id]=e.target.value;render();});
});
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&document.activeElement!==qEl){e.preventDefault();qEl.focus();}
  if(e.key==='Escape'&&document.activeElement===qEl){qEl.value='';state.q='';clearEl.style.display='none';render();}
});
const toast=document.getElementById('toast');let tt;
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-copy]');if(!el)return;
  navigator.clipboard.writeText(el.dataset.copy).then(()=>{
    toast.textContent='Copied '+el.dataset.copy;toast.classList.add('on');
    clearTimeout(tt);tt=setTimeout(()=>toast.classList.remove('on'),1400);
  });
});

rebuildFilters();render();
</script>
