  /* WoW-style toast banner */
  @keyframes toastIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.85);}100%{opacity:1;transform:translate(-50%,-50%) scale(1);}}
  @keyframes toastOut{0%{opacity:1;transform:translate(-50%,-50%) scale(1);}100%{opacity:0;transform:translate(-50%,-50%) scale(.85);}}
  .toast{
    position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);

    padding:.7rem 2.2rem .7rem 1.6rem;

  .toast::after{right:10px;}

  /* New loot display layout */
  .loot-display-content{display:flex;flex-direction:column;min-height:0;overflow:hidden;}
  .loot-display-hdr{display:flex;flex-direction:row;align-items:center;padding:1rem 1.5rem .75rem;flex-shrink:0;border-bottom:1px solid rgba(201,168,76,0.08);}
  .loot-display-title{font-family:'Cinzel',serif;font-size:1.4rem;color:var(--gold);letter-spacing:.14em;text-shadow:0 0 24px rgba(200,160,50,0.5);}
  .loot-display-sub{font-size:.72rem;color:var(--text-muted);letter-spacing:.08em;font-family:'Cinzel',serif;margin-top:.2rem;}
  .loot-display-close-btn{font-family:'Cinzel',serif;font-size:.68rem;letter-spacing:.08em;padding:.4rem .9rem;border-radius:3px;border:1px solid var(--border-gold);background:rgba(30,24,12,0.9);color:var(--gold);cursor:var(--gs-action-cursor,pointer);white-space:nowrap;flex-shrink:0;}
  .loot-display-cats{display:flex;gap:.4rem;flex-wrap:wrap;justify-content:center;padding:.65rem 1rem .35rem;flex-shrink:0;border-bottom:1px solid rgba(201,168,76,0.08);}
  .loot-display-cat-btn{font-family:'Cinzel',serif;font-size:.65rem;letter-spacing:.08em;text-transform:uppercase;padding:.3rem .9rem;border-radius:3px;border:1px solid rgba(201,168,76,0.25);background:transparent;color:rgba(201,168,76,0.5);cursor:var(--gs-action-cursor,pointer);transition:all .15s;}
  .loot-display-cat-btn:hover{border-color:rgba(201,168,76,0.55);color:rgba(201,168,76,0.85);}
  .loot-display-cat-btn.active{background:rgba(201,168,76,0.14);border-color:rgba(201,168,76,0.65);color:var(--gold-light);}
  .loot-display-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:1.25rem 1.5rem 2rem;min-height:0;}
  .loot-display-grid-inner{display:flex;flex-wrap:wrap;gap:1rem;justify-content:center;align-content:flex-start;}
  /* Loot gallery card — same grid and card size as live auctions */
  .loot-card{background:rgba(30,26,16,0.95);border:1px solid rgba(201,168,76,0.28);border-radius:5px;display:flex;flex-direction:column;align-items:stretch;cursor:var(--gs-action-cursor,pointer);transition:border-color .18s,background .18s,box-shadow .18s;animation:lootIn .3s ease-out both;padding:1.25rem 1rem 1rem;text-decoration:none;min-height:220px;width:260px;flex-shrink:0;}
  .loot-card:hover{border-color:rgba(201,168,76,0.7);background:rgba(40,32,12,0.98);box-shadow:0 0 22px rgba(201,168,76,0.1);}
  .loot-card-icon-wrap{display:flex;justify-content:center;}
  .loot-card-name{font-family:'Cinzel',serif;font-size:1rem;text-align:center;line-height:1.4;letter-spacing:.03em;word-break:break-word;flex:1;margin-top:.6rem;}
  .loot-card-footer{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:.15rem;padding-top:.6rem;}
  .loot-card-winner{font-size:.82rem;color:var(--text-muted);text-align:center;font-family:'Cinzel',serif;letter-spacing:.05em;}
  .loot-card-price{font-size:1.6rem;color:var(--gold);font-family:'Cinzel',serif;font-weight:600;letter-spacing:.04em;}
  /* Permanent loot tracker - always visible */
  .loot-tracker{position:fixed;left:0;top:50%;transform:translateY(-50%);width:240px;min-width:180px;max-width:420px;background:rgba(10,8,5,0.96);border:1px solid rgba(201,168,76,0.5);border-left:3px solid rgba(201,168,76,0.7);border-radius:0 8px 8px 0;z-index:150;display:none;flex-direction:column;max-height:72vh;user-select:none;}
  @media(min-width:601px){.loot-tracker{display:flex;}}
  .loot-tracker.visible{display:flex;}
  .loot-tracker.collapsed .loot-tracker-body{display:none;}
  .loot-tracker.collapsed .loot-tracker-resize{display:none;}
  .loot-tracker-body{overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin;flex:1;}
  .loot-tracker.collapsed .loot-tracker-hdr{border-bottom:none;}
  /* Tracker category dropdown */
  .tracker-cat-wrap{position:relative;flex-shrink:0;margin-right:4px;}
  .tracker-cat-btn{display:flex;align-items:center;gap:.3rem;background:rgba(20,14,4,0.9);border:1px solid rgba(201,168,76,0.3);color:rgba(201,168,76,0.8);font-family:'Cinzel',serif;font-size:.62rem;padding:.15rem .5rem .15rem .35rem;border-radius:2px;cursor:var(--gs-action-cursor,pointer);white-space:nowrap;transition:border-color .15s;}
  .tracker-cat-btn:hover{border-color:rgba(201,168,76,0.6);}
  .tracker-cat-btn svg{flex-shrink:0;opacity:.7;}
  .tracker-cat-list{position:absolute;top:calc(100% + 3px);right:0;min-width:110px;background:rgba(18,13,4,0.98);border:1px solid rgba(201,168,76,0.45);border-radius:3px;z-index:200;box-shadow:0 4px 14px rgba(0,0,0,0.75);overflow:hidden;}
  .tracker-cat-opt{font-family:'Cinzel',serif;font-size:.62rem;color:rgba(201,168,76,0.75);padding:.38rem .65rem;cursor:var(--gs-action-cursor,pointer);transition:background .1s,color .1s;white-space:nowrap;}
  .tracker-cat-opt:hover{background:rgba(201,168,76,0.12);color:rgba(201,168,76,1);}
  .tracker-cat-opt.selected{background:rgba(201,168,76,0.18);color:var(--gold-light);font-weight:600;}
  .loot-tracker-collapse{background:none;border:none;color:rgba(201,168,76,0.5);cursor:var(--gs-action-cursor,pointer);padding:0 0 0 .3rem;font-size:.7rem;line-height:1;flex-shrink:0;transition:color .15s;}
  .loot-tracker-collapse:hover{color:rgba(201,168,76,0.9);}
  .loot-tracker-hdr{padding:.6rem .9rem;border-bottom:1px solid rgba(201,168,76,0.12);font-family:'Cinzel',serif;font-size:.68rem;letter-spacing:.1em;color:rgba(201,168,76,0.55);text-transform:uppercase;flex-shrink:0;cursor:grab;}
  .loot-tracker-hdr:active{cursor:grabbing;}
  .loot-tracker-resize{position:absolute;right:0;top:0;bottom:0;width:6px;cursor:ew-resize;z-index:2;}
  .loot-tracker-item{display:flex;align-items:center;gap:.35rem;padding:.4rem .9rem;border-bottom:1px solid rgba(255,255,255,0.03);}
  .loot-tracker-item a{display:flex;align-items:center;gap:.35rem;text-decoration:none;width:100%;min-width:0;}
  .loot-tracker-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
  .loot-tracker-name{font-family:'Cinzel',serif;font-size:.74rem;color:rgba(201,168,76,0.75);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .loot-tracker-right{display:flex;flex-direction:column;align-items:flex-end;gap:.15rem;flex-shrink:0;}
  .loot-tracker-badge{font-size:.58rem;letter-spacing:.05em;padding:.12rem .32rem;border-radius:2px;font-family:'Cinzel',serif;text-transform:uppercase;}
  .loot-tracker-timer{font-size:.64rem;color:rgba(201,168,76,0.5);font-family:'Cinzel',serif;}
  .loot-display-close{position:absolute;top:.75rem;right:.75rem;background:rgba(30,24,12,0.9);border:1px solid var(--border-gold);color:var(--gold);font-family:'Cinzel',serif;font-size:.68rem;letter-spacing:.08em;padding:.35rem .8rem;border-radius:3px;cursor:var(--gs-action-cursor,pointer);z-index:201;}
  .unpaid-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:10001;display:flex;align-items:flex-start;justify-content:center;padding-top:10vh;}
  .unpaid-overlay-box{background:#1a1612;border:1px solid var(--border-gold-strong);border-radius:6px;width:min(480px,92vw);max-height:75vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,0.8);}
  .unpaid-overlay-hdr{padding:.75rem 1rem;border-bottom:1px solid var(--border-gold);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
  .unpaid-overlay-body{overflow-y:auto;padding:.5rem 0;}
  .unpaid-row{display:flex;align-items:center;gap:.6rem;padding:.55rem 1rem;border-bottom:1px solid rgba(201,168,76,0.08);}
  .unpaid-row:last-child{border-bottom:none;}
  .unpaid-row-name{font-family:'Cinzel',serif;font-size:.8rem;color:var(--gold-light);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .unpaid-row-item{font-size:.75rem;color:var(--text-muted);flex:2;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .unpaid-row-price{font-family:'Cinzel',serif;font-size:.8rem;color:var(--red);white-space:nowrap;margin-right:.5rem;}
  .unpaid-pay-btn{font-family:'Cinzel',serif;font-size:.65rem;letter-spacing:.06em;padding:.25rem .6rem;border-radius:3px;cursor:var(--gs-action-cursor,pointer);background:rgba(46,180,80,0.12);color:#4dff70;border:1px solid rgba(46,180,80,0.35);white-space:nowrap;flex-shrink:0;}
  .unpaid-pay-btn:hover{background:rgba(46,180,80,0.25);}
  /* ── Rollout Mode ───────────────────────────────────────────────────── */
  .rollout-overlay{position:fixed;inset:0;z-index:9000;background:#0e0c08;display:flex;flex-direction:column;overflow:hidden;}
  .rollout-hdr{display:flex;align-items:center;justify-content:space-between;padding:.65rem 1.2rem;border-bottom:1px solid var(--border-gold);background:#1a1612;flex-shrink:0;}
  .rollout-hdr-left{display:flex;align-items:center;gap:.75rem;}
  .rollout-hdr-title{font-family:'Cinzel',serif;font-size:.95rem;color:var(--gold);letter-spacing:.1em;}
  .rollout-hdr-meta{font-size:.75rem;color:var(--text-muted);}
  .rollout-exit{font-family:'Cinzel',serif;font-size:.7rem;letter-spacing:.07em;padding:.35rem .9rem;border-radius:3px;cursor:var(--gs-action-cursor,pointer);background:rgba(226,96,96,0.12);color:var(--red);border:1px solid rgba(226,96,96,0.4);}
  .rollout-exit:hover{background:rgba(226,96,96,0.22);}
  .rollout-body{flex:1;overflow-y:auto;padding:1rem 1.2rem;display:grid;grid-template-columns:minmax(0,900px);justify-content:center;gap:.75rem;align-items:start;align-content:start;}
  .rollout-card{background:#1a1612;border:1px solid var(--border-gold);border-radius:5px;transition:opacity .3s,border-color .3s;}
  .rollout-card.all-paid{border-color:rgba(46,180,80,0.3);opacity:.55;}
  .rollout-card-hdr{padding:.6rem .9rem;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(201,168,76,0.12);}
  .rollout-card-name{font-family:'Cinzel',serif;font-size:.9rem;color:var(--gold-light);font-weight:600;}
  .rollout-card-right{display:flex;flex-direction:column;align-items:flex-end;gap:.1rem;}
  .rollout-card-total{font-size:.72rem;color:var(--text-muted);}
  .rollout-card-owed{font-size:.75rem;color:var(--red);font-family:'Cinzel',serif;}
  .rollout-card-settled{font-size:.75rem;color:var(--green);font-family:'Cinzel',serif;}
  .rollout-items{padding:.35rem 0;}
  .rollout-item{display:flex;align-items:center;gap:.6rem;padding:.4rem .9rem;border-bottom:1px solid rgba(201,168,76,0.06);}
  .rollout-item:last-child{border-bottom:none;}
  .rollout-item-icon{width:28px;height:28px;border-radius:3px;flex-shrink:0;object-fit:cover;cursor:var(--gs-action-cursor,pointer);}
  .rollout-item-icon-ph{width:28px;height:28px;border-radius:3px;flex-shrink:0;background:rgba(201,168,76,0.08);}
  .rollout-item-name{font-size:.78rem;flex:1;min-width:0;white-space:normal;line-height:1.3;cursor:var(--gs-action-cursor,pointer);}
  .rollout-item-price{font-size:.76rem;font-family:'Cinzel',serif;color:var(--gold);white-space:nowrap;flex-shrink:0;margin-right:.3rem;}
  .rollout-item-price.paid{color:var(--text-muted);text-decoration:line-through;}
  .rollout-pay-btn{font-size:.65rem;font-family:'Cinzel',serif;padding:.22rem .5rem;border-radius:3px;cursor:var(--gs-action-cursor,pointer);border:1px solid rgba(46,180,80,0.4);background:rgba(46,180,80,0.08);color:#4dff70;white-space:nowrap;flex-shrink:0;}
  .rollout-pay-btn:hover{background:rgba(46,180,80,0.2);}
  .rollout-markall{width:100%;padding:.42rem;font-family:'Cinzel',serif;font-size:.65rem;letter-spacing:.07em;cursor:var(--gs-action-cursor,pointer);background:rgba(46,180,80,0.06);color:#4dff70;border:none;border-top:1px solid rgba(46,180,80,0.12);}
  .rollout-markall:hover{background:rgba(46,180,80,0.15);}
  .rollout-trade-btn{font-family:'Cinzel',serif;font-size:.62rem;letter-spacing:.07em;cursor:var(--gs-action-cursor,pointer);background:rgba(46,180,80,0.08);color:#4dff70;border:1px solid rgba(46,180,80,0.3);border-radius:3px;padding:.2rem .55rem;white-space:nowrap;}
  .rollout-trade-btn:hover{background:rgba(46,180,80,0.2);border-color:rgba(46,180,80,0.6);}

  /* Settlement: AH collections, mutators, and payouts */
  .settlement-wrap{display:flex;flex-direction:column;gap:1.25rem;}
  .archived-settlement-header{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;padding:1rem 1.15rem;background:linear-gradient(135deg,rgba(35,39,43,.96),rgba(18,16,11,.98));border:1px solid rgba(201,168,76,.55);border-left:4px solid var(--gold);border-radius:4px;box-shadow:0 8px 24px rgba(0,0,0,.28);}
  .archived-settlement-kicker{font-family:'Cinzel',serif;color:var(--gold);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;}
  .archived-settlement-title{font-family:'Cinzel',serif;color:var(--gold-light);font-size:1.15rem;margin-top:.2rem;}
  .archived-settlement-date{color:var(--text-muted);font-size:.72rem;margin-top:.2rem;}
  .archive-card-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem;align-items:stretch;margin-top:.5rem;}
  .archive-card-actions .btn,.archive-code-row .btn{box-sizing:border-box;width:100%;height:44px;min-height:44px;padding:.35rem .5rem;font-size:.62rem;letter-spacing:.06em;line-height:1;display:flex;align-items:center;justify-content:center;text-align:center;white-space:nowrap;}
  .archive-card-actions .btn:last-child:nth-child(odd){grid-column:1/-1;width:calc(50% - .25rem);justify-self:center;}
  .archive-code-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem;}
  .archived-header-actions{display:grid;grid-template-columns:repeat(3,minmax(190px,1fr));align-items:stretch;justify-content:end;gap:.6rem;width:min(100%,660px);}
  .archived-header-actions .btn{box-sizing:border-box;width:100%;height:46px;min-height:46px;padding:.4rem .55rem;font-size:.68rem;letter-spacing:.06em;display:flex;align-items:center;justify-content:center;text-align:center;white-space:nowrap;line-height:1;}
  .raid-code-field{box-sizing:border-box;width:210px!important;max-width:100%;min-height:46px;padding:.55rem .8rem!important;text-align:center;text-transform:uppercase;background-color:#242427!important;background-image:linear-gradient(145deg,rgba(255,255,255,.035),transparent 45%),repeating-linear-gradient(128deg,transparent 0 17px,rgba(0,0,0,.24) 18px 19px,transparent 20px 38px)!important;border:1px solid #62562f!important;box-shadow:inset 0 0 0 1px rgba(0,0,0,.8),inset 0 0 18px rgba(0,0,0,.7)!important;color:var(--gold-light)!important;font-family:'Cinzel',serif!important;font-weight:700;letter-spacing:.14em!important;text-shadow:0 1px 0 #000;}
  .raid-code-field::placeholder{color:rgba(212,169,60,.48)!important;}
  .settlement-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.65rem;}
  .settlement-summary.compact-three{grid-template-columns:repeat(3,minmax(0,1fr));}
  .settlement-stat{background:rgba(30,26,16,.94);border:1px solid var(--border-gold);border-radius:4px;padding:.8rem 1rem;}
  .settlement-stat-lbl{font-family:'Cinzel',serif;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);}
  .settlement-stat-val{font-family:'Cinzel',serif;font-size:1.25rem;color:var(--gold-light);margin-top:.25rem;}
  .settlement-stat-sub{font-size:.68rem;color:var(--text-muted);margin-top:.15rem;}
  .settlement-section{background:rgba(22,19,12,.95);border:1px solid var(--border-gold);border-radius:4px;padding:1rem 1.15rem;}
  .settlement-section-hdr{display:flex;align-items:center;justify-content:space-between;gap:.75rem;flex-wrap:wrap;margin-bottom:.8rem;}
  .settlement-section-title{font-family:'Cinzel',serif;font-size:.95rem;color:var(--gold);letter-spacing:.07em;}
  .settlement-section-note{font-size:.68rem;color:var(--text-muted);margin-top:.15rem;}
  .settlement-table-wrap{overflow-x:auto;}
  .raider-table-wrap{max-height:68vh;overflow:auto;position:relative;border-top:1px solid rgba(212,169,60,.08);border-bottom:1px solid rgba(212,169,60,.08);}
  .settlement-table{width:100%;border-collapse:collapse;min-width:960px;}
  .settlement-table th{font-family:'Cinzel',serif;font-size:.58rem;letter-spacing:.07em;text-transform:uppercase;color:var(--text-muted);font-weight:500;text-align:left;padding:.45rem .4rem;white-space:nowrap;}
  .settlement-table td{padding:.5rem .4rem;border-top:1px solid rgba(212,169,60,.1);font-size:.72rem;vertical-align:middle;}
  .settlement-table th.settlement-mutator-col,.settlement-table td.settlement-mutator-col{width:68px;min-width:68px;max-width:68px;text-align:center;padding-left:.25rem;padding-right:.25rem;}
  .settlement-table input[type=number],.settlement-table input[type=text],.settlement-table select{font-size:.72rem;padding:.35rem .45rem;min-width:76px;}
  .settlement-table input[type=checkbox]{width:18px;height:18px;}
  .settlement-money{font-family:'Cinzel',serif;color:var(--gold-light);white-space:nowrap;}
  .settlement-positive{color:var(--green);}
  .settlement-negative{color:var(--red);}
  .settlement-muted{color:var(--text-muted);}
  .settlement-toolbar{display:flex;align-items:flex-end;gap:.6rem;flex-wrap:wrap;}
  .settlement-toolbar .fg{min-width:120px;}
  .settlement-toolbar input{font-size:.78rem;padding:.42rem .55rem;}
  .cut-setup-controls{display:grid;grid-template-columns:repeat(2,minmax(180px,260px));gap:.75rem;margin-top:.85rem;align-items:start;}
  .cut-setup-control{display:grid;grid-template-rows:auto 44px auto;gap:.3rem;min-width:0;}
  .cut-setup-control input{box-sizing:border-box;width:100%;height:44px;font-size:.82rem;padding:.45rem .6rem;}
  .cut-setup-hint{min-height:1rem;font-size:.68rem;color:var(--text-muted);line-height:1.35;}
  .mutator-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,480px),1fr));align-items:stretch;gap:.65rem;margin-bottom:.85rem;}
  .mutator-grid>.settlement-empty{grid-column:1/-1;}
  .mutator-card{background:var(--bg-card);border:1px solid rgba(212,169,60,.2);border-radius:3px;padding:.7rem .75rem;display:grid;grid-template-columns:18px minmax(160px,1fr) 70px 80px auto;align-items:center;gap:.55rem;min-width:0;max-width:100%;}
  .mutator-card-info{min-width:0;}
  .mutator-card-info>input{box-sizing:border-box;width:100%;min-width:0;}
  .mutator-card-name{font-family:'Cinzel',serif;color:var(--gold-light);font-size:.72rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mutator-card-rule{font-size:.64rem;color:var(--text-muted);margin-top:.15rem;}
  .mutator-card input{font-size:.68rem;padding:.28rem .4rem;}
  .mutator-new-name{min-width:240px;flex:1 1 280px;}
  .member-history-search{margin-bottom:.75rem;padding:.75rem;background:rgba(30,26,20,.72);border:1px solid var(--border-gold);border-radius:4px;font-family:'Inter',sans-serif;}
  .member-history-search .lbl{font-family:'Inter',sans-serif;font-size:.72rem;font-weight:650;letter-spacing:.08em;}
  .member-history-search input[type=search]{width:100%;height:42px;box-sizing:border-box;margin-top:.35rem;background:var(--bg-input);border:1px solid var(--border-gold);color:var(--text-bright);padding:.55rem .7rem;font-family:'Inter',sans-serif;font-size:.84rem;border-radius:3px;outline:none;}
  .member-history-search input[type=search]:focus{border-color:var(--gold);box-shadow:0 0 0 2px rgba(201,168,76,.12);}
  .member-history-results{display:grid;gap:.4rem;margin-top:.5rem;}
  .member-history-result{padding:.65rem;border:1px solid rgba(201,168,76,.18);border-radius:3px;background:rgba(0,0,0,.2);font-family:'Inter',sans-serif;}
  .member-history-result summary{cursor:var(--gs-action-cursor,pointer);display:flex;justify-content:space-between;align-items:center;gap:.5rem;color:var(--gold-light);font-family:'Inter',sans-serif;font-size:.8rem;font-weight:650;}
  .member-history-result-meta{font-family:'Inter',sans-serif;font-size:.7rem;font-weight:400;color:var(--text-muted);white-space:nowrap;}
  .member-history-result .settlement-muted,.member-history-result .raider-item,.member-history-result .item-name,.member-history-result .raider-item-price{font-family:'Inter',sans-serif!important;font-size:.72rem!important;letter-spacing:0!important;}
  .member-history-discord{margin-top:.25rem;color:#9ccce8;font-family:'Inter',sans-serif;font-size:.72rem;overflow-wrap:anywhere;}
  .member-history-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.4rem;margin-top:.6rem;}

function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;
  el.classList.remove('hide');
  el.classList.add('show');
  clearTimeout(toastT);
  toastT=setTimeout(()=>{
    el.classList.remove('show');
    el.classList.add('hide');
    setTimeout(()=>el.classList.remove('hide'),200);
  },1400);
}
let _undoT=null;
function toastUndo(msg,undoFn){
  const el=document.getElementById('toast');
  el.innerHTML='';
  const span=document.createElement('span');span.textContent=msg;
  const btn=document.createElement('button');
  btn.textContent='Undo';
  btn.style.cssText='margin-left:1rem;background:var(--gold);color:var(--bg-deep);border:none;border-radius:3px;padding:.2rem .7rem;font-family:Cinzel,serif;font-weight:600;cursor:var(--gs-action-cursor,pointer);font-size:.75rem;';
  btn.onclick=()=>{clearTimeout(_undoT);clearTimeout(toastT);el.classList.remove('show');el.classList.add('hide');el.style.pointerEvents='';setTimeout(()=>{el.classList.remove('hide');el.textContent='';},200);undoFn();};
  el.appendChild(span);el.appendChild(btn);
  el.style.pointerEvents='auto';
  el.classList.remove('hide');el.classList.add('show');
  clearTimeout(toastT);clearTimeout(_undoT);
  // Longer window for undo
  _undoT=setTimeout(()=>{
    el.classList.remove('show');el.classList.add('hide');
    el.style.pointerEvents='';
    setTimeout(()=>{el.classList.remove('hide');el.textContent='';},200);
  },6000);
}

function wowConfirm({title='Are you sure?',msg='',confirmLabel='Confirm',danger=false,input=null,suppressKey=null,onConfirm}){
  if(suppressKey&&_suppressedDialogs[suppressKey]){onConfirm();return;}
  const existing=document.getElementById('wow-dialog-overlay');
  if(existing)existing.remove();
  const overlay=document.createElement('div');
  overlay.id='wow-dialog-overlay';
  overlay.className='wow-dialog-overlay';
  overlay.innerHTML=`
    <div class="wow-dialog">
      <div class="wow-dialog-corners"></div>
      <div class="wow-dialog-title">${title}</div>
      ${msg?`<div class="wow-dialog-msg">${msg}</div>`:''}
      ${input?`<input class="wow-dialog-input" id="wow-dialog-input" type="${input.type||'number'}" placeholder="${input.placeholder||''}" ${input.type==='text'?`value="${settlementEsc(input.value||'')}" maxlength="${input.maxlength||30}"`:`value="${Number.isFinite(Number(input.value))?Number(input.value):''}" min="${input.min??0}" step="${input.step||1}"`} />`:''}
      ${suppressKey?`<label style="display:flex;align-items:center;gap:.5rem;justify-content:center;margin-bottom:.75rem;cursor:var(--gs-action-cursor,pointer);"><input type="checkbox" id="wow-suppress" style="width:14px;height:14px;accent-color:var(--gold);cursor:var(--gs-action-cursor,pointer);" /><span style="font-family:'Cinzel',serif;font-size:.65rem;color:var(--text-muted);">Don't show this again</span></label>`:''}
      <div class="wow-dialog-btns">
        <button class="wow-dialog-btn wow-dialog-btn-cancel" id="wow-cancel">Cancel</button>
        <button class="wow-dialog-btn ${danger?'wow-dialog-btn-danger':'wow-dialog-btn-confirm'}" id="wow-confirm">${confirmLabel}</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const inp=document.getElementById('wow-dialog-input');
  const confirmBtn=document.getElementById('wow-confirm');
  // Focus reliably after the browser paints the dialog
  requestAnimationFrame(()=>{requestAnimationFrame(()=>{
    if(inp)inp.focus();
    else confirmBtn.focus();
  });});
  let _keyHandler=null;
  const close=()=>{if(_keyHandler)document.removeEventListener('keydown',_keyHandler);overlay.remove();};
  document.getElementById('wow-cancel').onclick=close;
  confirmBtn.onclick=()=>{
    if(suppressKey&&document.getElementById('wow-suppress')?.checked){_suppressedDialogs[suppressKey]=true;_saveSuppress();}
    if(input&&inp){
      if(input.type==='text'){
        const val=inp.value.trim();
        if(!val){toast(input.errorMsg||'Enter a value');return;}
        close();onConfirm(val);
        return;
      }
      const val=parseFloat(inp.value);
      if(!Number.isFinite(val)||val<(input.min??0)){toast(input.errorMsg||'Invalid value');return;}
      close();onConfirm(val);
    }else{close();onConfirm();}
  };
  if(inp)inp.onkeydown=e=>{if(e.key==='Enter')confirmBtn.click();};
  overlay.addEventListener('click',e=>{if(e.target===overlay)close();});
  const cancelBtn=document.getElementById('wow-cancel');
  // Focusable elements in the dialog, in tab order
  const focusables=[cancelBtn,confirmBtn,inp].filter(Boolean);
  _keyHandler=e=>{
    if(e.key==='Escape'){close();}
    // Enter confirms — unless focus is in the number input (handled above)
    else if(e.key==='Enter'&&document.activeElement!==inp){e.preventDefault();confirmBtn.click();}
    // Trap Tab inside the dialog so focus never escapes to the page
    else if(e.key==='Tab'){
      e.preventDefault();
      const cur=focusables.indexOf(document.activeElement);
      let next;
      if(e.shiftKey)next=cur<=0?focusables.length-1:cur-1;
      else next=cur>=focusables.length-1?0:cur+1;
      focusables[next].focus();
    }
  };
  document.addEventListener('keydown',_keyHandler);
  cancelBtn.onclick=close;
}

function iconUrl(icon){return icon?`https://wow.zamimg.com/images/wow/icons/medium/${icon}.jpg`:''}
// Icon cache — fetched from Wowhead media API
const _iconCache={};
async function fetchIcon(itemId){
  if(!itemId||_iconCache[itemId]!==undefined) return _iconCache[itemId]||null;
  _iconCache[itemId]=null;
  // First try the local item database — baked-in icons, no network needed
  const local=SSC_TK_ITEMS.find(i=>i.id===itemId||i.id===Number(itemId));
  if(local&&local.ic){_iconCache[itemId]=local.ic;return local.ic;}
  // Then try Wowhead's in-page data (populated by power.js when tooltips load)
  try{
    if(window.WH&&window.WH.Wow&&window.WH.Wow.Item){
      const it=window.WH.Wow.Item.getItem?window.WH.Wow.Item.getItem(itemId):null;
      if(it&&it.icon){_iconCache[itemId]=it.icon;return it.icon;}
    }
    if(window.g_items&&window.g_items[itemId]&&window.g_items[itemId].icon){
      _iconCache[itemId]=window.g_items[itemId].icon;return window.g_items[itemId].icon;
    }
  }catch(e){}
  // Fallback to tooltip JSON endpoint
  try{
    const res=await fetch(`https://nether.wowhead.com/tbc/tooltip/item/${itemId}`);
    if(res.ok){
      const text=await res.text();
      const m=text.match(/"icon":"([^"]+)"/);
      if(m){
        _iconCache[itemId]=m[1];
        // Persist icon to Firebase for any auction with this itemId
        if(runId){auctionList().forEach(a=>{if(a.itemId===itemId&&!a.itemIcon){update(runRef(`/auctions/${a.id}`),{itemIcon:m[1]}).catch(()=>{});}});}
        return m[1];
      }
    }
  }catch(e){}
  // Fallback: try classic endpoint
  try{
    const res=await fetch(`https://nether.wowhead.com/tooltip/item/${itemId}`);
    if(res.ok){
      const text=await res.text();
      const m=text.match(/"icon":"([^"]+)"/);
      if(m){
        _iconCache[itemId]=m[1];
        if(runId){auctionList().forEach(a=>{if(a.itemId===itemId&&!a.itemIcon){update(runRef(`/auctions/${a.id}`),{itemIcon:m[1]}).catch(()=>{});}});}
        return m[1];
      }
    }
  }catch(e){}
  return null;
}

function _normName(s){return (s||'').toLowerCase().replace(/[''`'\u2019]/g,'').replace(/-/g,' ').replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();}
function backfillItemIds(){
  if(!isRL||!runId)return;
  const byName={};
  SSC_TK_ITEMS.forEach(i=>{byName[_normName(i.n)]=i.id;});
  const updates={};
  let matched=0,unmatched=[];
  auctionList().forEach(a=>{
    if(!a.itemId&&a.name){
      const id=byName[_normName(a.name)];
      if(id){updates[`auctions/${a.id}/itemId`]=id;matched++;}
      else unmatched.push(a.name);
    }
  });
  if(Object.keys(updates).length){
    update(runRef(),updates);
  }
  if(unmatched.length&&isRL)console.debug('[backfill] unmatched items:',unmatched.length);
}

function retryMissingIcons(){
  // After Wowhead power.js loads item data, fill in any placeholder icons
  document.querySelectorAll('[class*="icon-ic"]').forEach(el=>{
    const cls=[...el.classList].find(c=>c.startsWith('icon-ic'));
    if(!cls)return;
    const itemId=cls.replace('icon-ic','');
    let icon=null;
    try{
      if(window.WH&&window.WH.Wow&&window.WH.Wow.Item&&window.WH.Wow.Item.getItem){
        const it=window.WH.Wow.Item.getItem(parseInt(itemId));
        if(it&&it.icon)icon=it.icon;
      }
      if(!icon&&window.g_items&&window.g_items[itemId]&&window.g_items[itemId].icon)icon=window.g_items[itemId].icon;
    }catch(e){}
    if(icon){
      _iconCache[itemId]=icon;
      const s=el.style.width||'24px';
      el.outerHTML=`<img loading="lazy" decoding="async" src="${iconUrl(icon)}" style="width:${s};height:${s};border-radius:2px;flex-shrink:0;" />`;
    }
  });
}

function getIconImg(itemId,icon,size=24){
  if(icon) return `<img loading="lazy" decoding="async" src="${iconUrl(icon)}" style="width:${size}px;height:${size}px;border-radius:2px;flex-shrink:0;" onerror="this.style.display='none'" />`;
  if(!itemId) return `<div style="width:${size}px;height:${size}px;border-radius:2px;background:var(--bg-input);flex-shrink:0;"></div>`;
  // Render placeholder, then load async
  const uid='ic'+itemId;
  if(_iconCache[itemId]) return `<img loading="lazy" decoding="async" src="${iconUrl(_iconCache[itemId])}" style="width:${size}px;height:${size}px;border-radius:2px;flex-shrink:0;" />`;
  fetchIcon(itemId).then(ic=>{
    if(!ic)return;
    document.querySelectorAll(`.icon-${uid}`).forEach(el=>{
      const s=el.style.width||size+'px';
      el.outerHTML=`<img loading="lazy" decoding="async" src="${iconUrl(ic)}" style="width:${s};height:${s};border-radius:2px;flex-shrink:0;" />`;
    });
  });
  return `<div class="icon-${uid}" style="width:${size}px;height:${size}px;border-radius:2px;background:var(--bg-input);flex-shrink:0;"></div>`;
}

// Raider loot summary
function getRaiderLoot(name){
  const won=[];
  auctionList().filter(a=>a.status==='sold').forEach(a=>{
    const bids=Object.values(a.bids||{}).filter(b=>!b.retracted).sort((x,y)=>y.amount-x.amount);
    if(bids[0]&&bids[0].bidder===name){
      won.push({name:a.name,price:a.currentBid,icon:a.itemIcon||null,quality:a.quality||'common',itemId:a.itemId||null,paid:a.paid||false});
    }
  });
  return won;
}

function getAllRaiderLoot(){
  const map={};
  auctionList().filter(a=>a.status==='sold').forEach(a=>{
    const bids=Object.values(a.bids||{}).filter(b=>!b.retracted).sort((x,y)=>y.amount-x.amount);
    if(!bids[0])return;
    const winner=bids[0].bidder;
    if(!map[winner])map[winner]=[];
    map[winner].push({auctionId:a.id,name:a.name,price:a.currentBid,icon:a.itemIcon||null,quality:a.quality||'common',itemId:a.itemId||null,paid:a.paid||false});
  });
  return map;
}

function _lev(a,b){const m=a.length,n=b.length;if(Math.abs(m-n)>2)return 99;const d=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);for(let j=0;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));}return d[m][n];}
function searchLocal(q){
  const ql=_normName(q);
  if(!ql)return [];
  const words=ql.split(/\s+/);
  const scored=[];
  SSC_TK_ITEMS.forEach(i=>{
    const nl=_normName(i.n);
    let score=0;
    if(nl===ql)score=1000;
    else if(nl.includes(ql))score=500-nl.indexOf(ql);
    else if(nl.startsWith(ql))score=400;
    else {
      // All query words must match somewhere in the name (substring or fuzzy)
      const nameWords=nl.split(/\s+/);
      let allMatch=true,wordScore=0;
      for(const w of words){
        if(w.length<2)continue;
        if(nl.includes(w)){wordScore+=20;continue;}
        // fuzzy: does any name word closely match this query word?
        const close=nameWords.some(nw=>nw.includes(w)||(w.length>=4&&_lev(w,nw.slice(0,w.length+1))<=1));
        if(close){wordScore+=8;}else{allMatch=false;break;}
      }
      if(allMatch&&wordScore>0)score=wordScore;
    }
    if(score>0)scored.push({i,score});
  });
  scored.sort((a,b)=>b.score-a.score||a.i.n.localeCompare(b.i.n));
  return scored.map(s=>({id:s.i.id,name:s.i.n,quality:s.i.q,icon:s.i.ic||null,slot:s.i.s}));
}

async function searchWowhead(query){
  if(!query||query.length<2){searchResults=[];isSearching=false;refreshDropdown();return;}
  // Instant local results first
  const local=searchLocal(query);
  if(searchQuery!==query)return;
  searchResults=local;
  isSearching=false;
  if(local.length)refreshDropdown();
  // Then fetch network results in background and merge extras
  try{
    let whResults=[];
    let workerResults=[];
    try{const res=await fetch(`${SEARCH_WORKER_URL}?q=${encodeURIComponent(query)}`);if(res.ok)workerResults=await res.json();}catch(e){}
    const localIds=new Set(local.map(r=>r.id));
    const localNames=new Set(local.map(r=>_normName(r.name)));
    const seenNet=new Set();
    const extras=[...whResults,...workerResults].filter(r=>{if(localIds.has(r.id)||seenNet.has(r.id))return false;if(localNames.has(_normName(r.name)))return false;seenNet.add(r.id);return true;});
    if(searchQuery!==query)return;
    if(extras.length){const ql=_normName(query);extras.sort((a,b)=>{const an=_normName(a.name),bn=_normName(b.name);if(an.startsWith(ql)&&!bn.startsWith(ql))return -1;if(bn.startsWith(ql)&&!an.startsWith(ql))return 1;return 0;});searchResults=[...local,...extras];refreshDropdown();}
  }catch(e){}
  if(searchQuery===query&&!searchResults.length){isSearching=false;refreshDropdown();}
}

function refreshDropdown(){
  const dd=document.getElementById('item-dropdown');if(!dd)return;
  if(isSearching){dd.innerHTML='<div class="dropdown-status">Searching...</div>';dd.style.display='block';return;}
  if(!searchResults.length&&searchQuery.length>=2){dd.innerHTML='<div class="dropdown-status">No items found</div>';dd.style.display='block';return;}
  if(!searchResults.length){dd.style.display='none';return;}
  dd.innerHTML=searchResults.map(item=>{
    // Count how many times this item appears in each status
    const all=auctionList().filter(a=>a.itemId===item.id||a.name===item.name);
    const counts={live:0,queue:0,sold:0,expired:0};
    all.forEach(a=>{
      if(a.status==='open')counts.live++;
      else if(a.status==='queued')counts.queue++;
      else if(a.status==='sold')counts.sold++;
      else if(a.status==='expired')counts.expired++;
    });
    const badges=[
      counts.live?`<span style="color:#60cc80;font-size:.6rem;font-family:'Cinzel',serif;">${counts.live} live</span>`:'',
      counts.queue?`<span style="color:var(--gold);font-size:.6rem;font-family:'Cinzel',serif;">${counts.queue} queue</span>`:'',
      counts.sold?`<span style="color:var(--text-muted);font-size:.6rem;font-family:'Cinzel',serif;">${counts.sold} sold</span>`:'',
      counts.expired?`<span style="color:var(--red);font-size:.6rem;font-family:'Cinzel',serif;">${counts.expired} exp</span>`:'',
    ].filter(Boolean).join('<span style="color:var(--text-muted);font-size:.6rem;"> · </span>');
    return`<div class="dropdown-item" tabindex="0" onclick="selectItem(${item.id})" onkeydown="handleDropdownItemKey(event,${item.id})">
      <a href="https://www.wowhead.com/tbc/item=${item.id}" data-wowhead="item=${item.id}&domain=tbc" onclick="return false;" tabindex="-1" style="display:inline-block;line-height:0;">${getIconImg(item.id, item.icon)}</a>
      <div style="flex:1;min-width:0;">
        <a class="dropdown-item-name ${item.quality||'common'}" href="https://www.wowhead.com/tbc/item=${item.id}" data-wowhead="item=${item.id}&domain=tbc" onclick="return false;" tabindex="-1">${item.name}</a>
        <div style="display:flex;gap:.3rem;align-items:center;margin-top:.1rem;">${badges?badges:`<span style="color:var(--text-muted);font-size:.6rem;">${item.slot||''}</span>`}</div>
      </div>
    </div>`;
  }).join('');
  dd.style.display='block';
  refreshWowheadLinks();
}

function selectItem(id){
  const item=searchResults.find(r=>r.id===id);if(!item)return;
  // If Wowhead returned a bad slot, fall back to our local DB
  const BAD_SLOTS=new Set(['non-equippable','nonequippable','','undefined','null']);
  if(!item.slot||BAD_SLOTS.has(item.slot.toLowerCase())){
    const local=SSC_TK_ITEMS.find(i=>i.id===id);
    if(local)item.slot=local.s;
  }
  selectedItem=item;modalQuality=(['epic','rare','uncommon'].includes(item.quality))?item.quality:'epic';
  searchQuery=item.name;searchResults=[];
  const inp=document.getElementById('item-search-input');if(inp)inp.value=item.name;
  const dd=document.getElementById('item-dropdown');if(dd)dd.style.display='none';
  renderSearchPreview();
  ['epic','rare','uncommon'].forEach(x=>{
    const b=document.getElementById('q-'+x);if(!b)return;
    const s=x===modalQuality?Q_STYLES[x].on:Q_STYLES[x].off;
    b.setAttribute('style',s+"font-family:'Cinzel',serif;font-size:.7rem;letter-spacing:.06em;font-weight:"+(x===modalQuality?'600':'400')+';');
  });
}

function renderSearchPreview(){
  const wrap=document.getElementById('search-preview-wrap');if(!wrap)return;
  if(!selectedItem){wrap.innerHTML='';return;}
  wrap.innerHTML=`<div class="search-preview">
    <a href="https://www.wowhead.com/tbc/item=${selectedItem.id}" data-wowhead="item=${selectedItem.id}&domain=tbc" target="_blank" tabindex="-1" style="display:inline-block;line-height:0;">${getIconImg(selectedItem.id, selectedItem.icon, 28)}</a>
    <a class="search-preview-name ${selectedItem.quality||'common'}" href="https://www.wowhead.com/tbc/item=${selectedItem.id}" data-wowhead="item=${selectedItem.id}&domain=tbc" target="_blank" tabindex="-1">${selectedItem.name}</a>
    <span class="dropdown-item-sub">${selectedItem.slot||''}</span>
    <button class="search-preview-clear" tabindex="-1" onclick="clearItemSelection()">&#x2715; Clear</button>
  </div>`;
  refreshWowheadLinks();
}

function clearItemSelection(){selectedItem=null;searchQuery='';const inp=document.getElementById('item-search-input');if(inp){inp.value='';inp.focus();}const wrap=document.getElementById('search-preview-wrap');if(wrap)wrap.innerHTML='';}

function startTick(){
  if(tickInterval)clearInterval(tickInterval);
  tickInterval=setInterval(()=>{
    const now=Date.now();
    auctionList().forEach(a=>{
      if(a.status!=='open'||a.paused||!a.endsAt)return;
      // Orphaned price preview (RL paused or disconnected mid-edit) — expire it
      if(a.previewBid!=null&&(now-(a.previewAt||0))>=8000){
        if(isRL&&editId!==a.id){
          update(runRef(`/auctions/${a.id}`),{previewBid:null,previewAt:null});
        } else {
          const oldCard=document.getElementById('card-'+a.id);
          if(oldCard&&oldCard.querySelector('.bid-preview')){
            const wrap=document.getElementById('wrap-'+a.id);
            if(wrap){
              const t=document.createElement('div');
              t.innerHTML=renderCard(a,'open');
              if(t.firstElementChild)wrap.replaceChild(t.firstElementChild,oldCard);
            }
          }
        }
      }
      const r=Math.max(0,Math.floor((a.endsAt-now)/1000));
      const pct=Math.round((r/(a.duration||120))*100),urgent=r<=15;
      const fe=document.getElementById('tfill-'+a.id),te=document.getElementById('ttext-'+a.id);
      if(fe){fe.style.width=pct+'%';fe.style.background=urgent?'#e26060':'#c9a84c';}
      if(te){te.textContent=fmtTime(r);te.style.color=urgent?'var(--red)':'var(--text-muted)';}
      // 10s warning — only for users involved in this auction
      const _activeBids=Object.values(a.bids||{}).filter(b=>!b.retracted);
      const _userInvolved=_activeBids.some(b=>b.bidder===currentRaiderName());
      if(r===10&&_userInvolved)window.gsPrefsNotify?.('ending',a);
      if(r===0&&isRL){
        const bids=Object.values(a.bids||{}).filter(b=>!b.retracted).sort((x,y)=>y.amount-x.amount);
        if(bids.length>0){
          const winPrice=bids[0].amount;
          update(runRef(`/auctions/${a.id}`),{status:'sold',remaining:0,currentBid:winPrice});auditLog('sold',{auctionId:a.id,item:a.name,winner:bids[0]?bids[0].bidder:null,price:winPrice,closedBy:'timer'});
          toast(a.name+' sold to '+displayName(bids[0].bidder)+' for '+displayMoney(winPrice));
        } else {
          update(runRef(`/auctions/${a.id}`),{status:'expired',remaining:0});
          toast(a.name+' expired — no bids placed');
        }
      }
    });
    // Update tracker timers in-place only — don't rebuild HTML
    const now2=Date.now();
    auctionList().forEach(a=>{
      const el=document.getElementById('tracker-timer-'+a.id);if(!el)return;
      if(a.status==='open'&&!a.paused&&a.endsAt){
        const rem=Math.max(0,Math.ceil((a.endsAt-now2)/1000));
        el.textContent=fmtTime(rem);el.style.color=rem<=10?'#e26060':'rgba(201,168,76,0.5)';
      }else if(a.status==='open'&&a.paused){el.textContent='Paused';el.style.color='#c87818';}
      else el.textContent='';
    });
    const claimEl=document.getElementById('payout-claim-countdown');
    if(claimEl){
      const r=payoutCurrentRaider(),deadline=payoutEffectiveDeadline(r),remaining=deadline-Date.now();
      claimEl.textContent=r?.submission?.submittedAt?'Claim secured':remaining>0?formatClaimRemaining(remaining):'Claim window expired';
      claimEl.className='settlement-status '+(r?.submission?.submittedAt?'ok':remaining>0?'warn':'due');
    }
  },1000);
}

let presenceData = {};

function subscribeToRun(){
  if(unsubRun)unsubRun();
  unsubRun=onValue(runRef(),snap=>{
    const data=snap.val()||{};
    if(archivedSettlementContext){
      activeRunState=data;
      presenceData=data.presence||{};
      nickMap=data.nicks||{};
      if(data.settings){raidSettings={...raidSettings,...data.settings};if(data.settings.categories)raidCategories=data.settings.categories;}
      updateOnlineCounter();
      renderHdr();
      return;
    }
    const prevAuctions={...auctions};
    const prevCardDragPreview=cardDragPreview;
    const prevSettlementState=JSON.stringify(settlement);
    const prevExchangeRate=runUsdRate();
    const prevExchangeLock=exchangeRateIsLocked();
    const prevAttendanceState=JSON.stringify([attendance,attendanceSettings]);
    const prevAttendanceSettingsState=JSON.stringify(attendanceSettings);
    const currentAttendanceKey=attendanceKeyForCurrentUser();
    const prevCurrentAttendanceState=JSON.stringify(currentAttendanceKey?attendance[currentAttendanceKey]||null:null);
    auctions=data.auctions||{};
    bjObserve(auctions);
    requestAnimationFrame(()=>{if(user&&!archivedSettlementContext)refreshPotAndLoot();});
    cardDragPreview=data.cardDragPreview||null;
    if(JSON.stringify(prevCardDragPreview)!==JSON.stringify(cardDragPreview)&&!isRL){
      requestAnimationFrame(applyCardDragPreviewToDOM);
    }
    presenceData=data.presence||{};
    const _prevNicks=JSON.stringify(nickMap);
    nickMap=data.nicks||{};
    const nicksChanged=_prevNicks!==JSON.stringify(nickMap);
    updateOnlineCounter();
    if(isRL&&!window._backfillDone){window._backfillDone=true;setTimeout(backfillItemIds,1200);}
    if(data.settings){
      raidSettings={...raidSettings,...data.settings};
      if(data.settings.categories) raidCategories=data.settings.categories;
    }
    if(data.splits&&!splitsLoaded){splits=data.splits;splitsLoaded=true;}
    settlement={
      ...DEFAULT_SETTLEMENT,
      ...(data.settlement||{}),
      payments:data.settlement?.payments||{},
      purchasePayments:data.settlement?.purchasePayments||{},
      mutators:data.settlement?.mutators||{},
      performanceImports:data.settlement?.performanceImports||{},
      raiders:data.settlement?.raiders||{}
    };
    attendance=data.attendance||{};
    attendanceSettings={enabled:false,open:false,...(data.attendanceSettings||{})};
    ensureRaidLeaderAttendance();
    ensureLockedCutSnapshot();
    const settlementChanged=prevSettlementState!==JSON.stringify(settlement);
    const exchangeRateChanged=Math.abs(prevExchangeRate-runUsdRate())>.0001;
    const exchangeLockChanged=prevExchangeLock!==exchangeRateIsLocked();
    const historyOverlay=document.getElementById('payout-history-overlay');
    if(historyOverlay&&settlementChanged){if(historyOverlay.dataset.runId===runId)openPayoutHistory(historyOverlay.dataset.raiderKey);else closePayoutHistory();}
    const attendanceChanged=prevAttendanceState!==JSON.stringify([attendance,attendanceSettings]);
    const attendanceSettingsChanged=prevAttendanceSettingsState!==JSON.stringify(attendanceSettings);
    const currentAttendanceChanged=prevCurrentAttendanceState!==JSON.stringify(currentAttendanceKey?attendance[currentAttendanceKey]||null:null);
    if((exchangeRateChanged||exchangeLockChanged)&&user){
      const rateScroll=_saveScroll();requestAnimationFrame(()=>{render();_restoreScroll(rateScroll);});
    } else if(settlementChanged&&((tab==='settlement'&&isRL)||tab==='payout')){
      requestAnimationFrame(()=>{if((tab==='settlement'&&isRL)||tab==='payout')renderMain();});
    }
    if(attendanceChanged){
      requestAnimationFrame(()=>{if(user){renderHdr();refreshPotAndLoot();if(!isRL&&(attendanceSettingsChanged||currentAttendanceChanged))renderMain();}if(document.getElementById('attendance-overlay'))renderAttendanceManager();});
    }
    // Sync loot display mode for all clients
    const newLootDisplay=!!data.lootDisplay;
    // Restore archive display for all clients
    const _archKey=data.archiveDisplay||null;
    if(_archKey&&!document.getElementById('loot-display-overlay')&&!newLootDisplay){
      setTimeout(()=>{if(!document.getElementById('loot-display-overlay'))startLootDisplayFromArchive(_archKey);},400);
    } else if(!_archKey&&!newLootDisplay){
      localStorage.removeItem('gdkp_archive_display');
      const _ov=document.getElementById('loot-display-overlay');
      if(_ov&&!lootDisplayMode)_ov.remove();
    }
    if(newLootDisplay!==lootDisplayMode){
      lootDisplayMode=newLootDisplay;
      if(lootDisplayMode){
        setTimeout(()=>{
          const soldCount=auctionList().filter(a=>a.status==='sold').length;
          if(lootDisplayMode&&!document.getElementById('loot-display-overlay'))renderLootDisplay();
        },300);
      } else {
        document.getElementById('loot-display-overlay')?.remove();
      }
      const lootBtn=document.querySelector('[onclick="toggleLootDisplay()"]');
      if(lootBtn)lootBtn.innerHTML=lootDisplayMode?'&#x2715; End Display':'&#10022; Show Loot';
    } else if(lootDisplayMode){
      if(!document.getElementById('loot-display-overlay'))setTimeout(()=>renderLootDisplay(),300);
    }

    // Rollout broadcast — show raider summary when RL enters rollout
    const newRolloutActive=!!(data.rolloutActive);
    if(newRolloutActive&&isRL){
      // RL: render rollout window if not already open
      if(rolloutMode&&!document.querySelector('.rollout-overlay'))renderRollout();
    } else if(!newRolloutActive){
      document.getElementById('raider-summary-overlay')?.remove();
    }

    // Detect new bids on open auctions — collect pending glows first
    const pendingGlows=[];
    const pendingExplosions=[];
    const pendingLive=[];
    let bidOnlyUpdate=true;
    if(user){
      Object.entries(auctions).forEach(([id,a])=>{
        if(a.status==='open'){
          const prev=prevAuctions[id];
          const prevBidCount=Object.keys(prev?.bids||{}).length;
          const newBidCount=Object.keys(a.bids||{}).length;
          if(newBidCount>prevBidCount){
            pendingGlows.push({id});
            const bids=Object.values(a.bids||{}).filter(b=>!b.retracted).sort((x,y)=>y.amount-x.amount);
            const topBid=bids[0];
            const isMine=topBid?.bidder===currentRaiderName();
            if(!isMine&&bids.some(b=>b.bidder===currentRaiderName())) window.gsPrefsNotify?.('outbid',a);
            // Auto-bid: if outbid and user has a limit set
            if(!isMine&&autoBids[id]){
              const maxBid=autoBids[id];
              const minNext=(topBid?.amount||0)+(a.minIncrement||(gsContext()?1:250));
              if(minNext<=maxBid){
                setTimeout(()=>submitBid(id,minNext,null),600+(Math.random()*400));
              } else {
                toast(`Auto-bid limit reached for ${a.name}`);
                delete autoBids[id];
              }
            }
          }
          // If non-bid fields changed (timer, pause, retraction) need full render
          if(prev&&(a.paused!==prev.paused||a.status!==prev.status)) bidOnlyUpdate=false;
          // Price preview broadcast from RL edit modal
          if(prev&&a.previewBid!==prev.previewBid) bidOnlyUpdate=false;
          // Detect retraction — any bid now has retracted=true that didn't before
          if(prev?.bids&&a.bids){
            const prevRetractedCount=Object.values(prev.bids).filter(b=>b.retracted).length;
            const newRetractedCount=Object.values(a.bids).filter(b=>b.retracted).length;
            if(newRetractedCount>prevRetractedCount) bidOnlyUpdate=false;
          }
          // currentBid changed without new bids = retraction updated price
          if(prev&&a.currentBid!==prev.currentBid&&newBidCount===prevBidCount) bidOnlyUpdate=false;
        }
        // Item goes live — collect here; the cue is played once after the loop so a
        // bulk Start All plays a single sound instead of stacking N tones at once.
        if(a.status==='open'&&prevAuctions[id]?.status!=='open') pendingLive.push(id);
        if(a.status==='open'&&prevAuctions[id]?.status!=='open'&&favs.has(id)){
          toast('\u2605 '+a.name+' is live!');
        }
        if(a.status==='sold'&&prevAuctions[id]?.status==='open'){
          if(settlementWinner(a)===currentRaiderName())window.gsPrefsNotify?.('won',a);
          const card=document.getElementById('card-'+id);
          const rect=card?card.getBoundingClientRect():null;
          pendingExplosions.push({id,amount:a.currentBid||0,rect});
          bidOnlyUpdate=false;
        }
        const prevStructure=prevAuctions[id];
        if(prevStructure&&(a.order!==prevStructure.order||a.category!==prevStructure.category||a.name!==prevStructure.name||a.quality!==prevStructure.quality||a.itemId!==prevStructure.itemId||a.itemIcon!==prevStructure.itemIcon))bidOnlyUpdate=false;
        if(prevAuctions[id]&&a.status!==prevAuctions[id].status) bidOnlyUpdate=false;
      });
      if(pendingLive.length){playGoLiveSound(pendingLive.length);if(!isRL&&tab!=='active'){tab='active';localStorage.setItem('gdkp_tab','active');}}
      if(Object.keys(auctions).length!==Object.keys(prevAuctions).length) bidOnlyUpdate=false;
    } else {
      bidOnlyUpdate=false;
    }

    // Did anything change that affects the pot bar or my-loot panel?
    const potLootChanged=(()=>{
      const ids=new Set([...Object.keys(prevAuctions),...Object.keys(auctions)]);
      for(const id of ids){
        const p=prevAuctions[id],a=auctions[id];
        if(!p||!a){if((p||a)?.status==='sold')return true;continue;}
        if(p.status!==a.status||p.paid!==a.paid)return true;
        if(a.status==='sold'&&p.currentBid!==a.currentBid)return true;
        if(a.status==='sold'){
          const pr=Object.values(p.bids||{}).filter(b=>b.retracted).length;
          const nr=Object.values(a.bids||{}).filter(b=>b.retracted).length;
          if(pr!==nr)return true;
        }
      }
      return false;
    })();

    // Always fire explosions regardless of modal state
    const explodeNow=(rects)=>pendingExplosions.forEach(({id,amount,rect})=>{
      const r=rect||rects[id];
      setTimeout(()=>coinExplosionAt(amount,r),50);
    });

    if(modal){
      if(!user) return;
      // Update live cards in-place behind the modal — timers/bids/glows still work
      const bgRects={};
      pendingExplosions.forEach(({id})=>{const c=document.getElementById('card-'+id);if(c)bgRects[id]=c.getBoundingClientRect();});
      // Update bid cards in-place
      pendingGlows.concat(pendingExplosions.map(e=>({id:e.id}))).forEach(({id})=>{
        const a=auctions[id];if(!a)return;
        const wrap=document.getElementById('wrap-'+id);
        const oldCard=document.getElementById('card-'+id);
        if(wrap&&oldCard){
          const t=document.createElement('div');
          t.innerHTML=renderCard(a,a.status==='open'?'open':a.status==='sold'?'sold':'expired');
          if(t.firstElementChild)wrap.replaceChild(t.firstElementChild,oldCard);
        }
      });
      // Keep the grid behind the dialog live for additions, moves, category changes,
      // and status changes without replacing the dialog the RL is using.
      const modalGridChanged=Object.keys(auctions).length!==Object.keys(prevAuctions).length||Object.keys(auctions).some(id=>{
        const a=auctions[id],p=prevAuctions[id];
        return !a||!p||a.status!==p.status||a.order!==p.order||a.category!==p.category||a.name!==p.name;
      });
      if(modalGridChanged){
        const all=auctionList();
        const queued=all.filter(a=>a.status==='queued').sort((a,b)=>(a.order??99999)-(b.order??99999));
        const active=all.filter(a=>a.status==='open');
        const grid=document.getElementById('auction-grid-bg');
        if(grid){
          if(tab==='queued') grid.innerHTML=renderCategoryFilterBar(queued)+renderGrid(queued,'queued');
          else if(tab==='active') grid.innerHTML=renderGrid(active,'open');
        }
      }
      // Apply glows
      pendingGlows.forEach(({id})=>{
        const card=document.getElementById('card-'+id);
        if(card){card.classList.remove('bid-glow');void card.offsetWidth;card.classList.add('bid-glow');setTimeout(()=>card.classList.remove('bid-glow'),950);}
      });
      explodeNow(bgRects);
      renderHdr();
      if(potLootChanged){
        refreshPotAndLoot();
        if(rolloutMode&&document.querySelector('.rollout-overlay'))renderRollout();
      }
      return;
    }

    // Capture card rects BEFORE render wipes the DOM
    const cardRects={};
    pendingGlows.forEach(({id})=>{
      const c=document.getElementById('card-'+id);
      if(c) cardRects[id]=c.getBoundingClientRect();
    });
    pendingExplosions.forEach(({id})=>{
      if(!cardRects[id]){const c=document.getElementById('card-'+id);if(c)cardRects[id]=c.getBoundingClientRect();}
    });

    if(bidOnlyUpdate && tab==='active' && user){
      if(pendingGlows.length>0){
        pendingGlows.forEach(({id})=>{
          const a=auctions[id];if(!a)return;
          const wrap=document.getElementById('wrap-'+id);
          const oldCard=document.getElementById('card-'+id);
          if(wrap&&oldCard){
            const t=document.createElement('div');
            t.innerHTML=renderCard(a,'open');
            if(t.firstElementChild)wrap.replaceChild(t.firstElementChild,oldCard);
          }
        });
        renderHdr();renderTabCounts();
      }
    } else if(user) {
      const structKey=obj=>JSON.stringify(Object.fromEntries(
        Object.entries(obj).map(([id,a])=>[id,{status:a.status,name:a.name,order:a.order,paid:a.paid,category:a.category,currentBid:a.currentBid,previewBid:a.previewBid,paused:a.paused,endsAt:a.endsAt,remaining:a.remaining,note:a.note}])
      ));
      const presenceOnly=structKey(auctions)===structKey(prevAuctions);
      if(presenceOnly){
        renderHdr();
        if(panelOpen&&panelTab==='raiders')renderPanel();
      } else if(tab==='queued'){
        const queuedPrev=Object.values(prevAuctions).filter(a=>a.status==='queued');
        const queuedNow=Object.values(auctions).filter(a=>a.status==='queued');
        const statusChanged=Object.keys(auctions).some(id=>auctions[id]?.status!==prevAuctions[id]?.status);
        const countChanged=queuedPrev.length!==queuedNow.length;
        const fieldChanged=Object.keys(auctions).some(id=>{const p=prevAuctions[id],a=auctions[id];return p&&a&&a.status==='queued'&&(a.name!==p.name||a.currentBid!==p.currentBid||a.category!==p.category||a.note!==p.note||(a.order??null)!==(p.order??null));});
        if(!statusChanged&&!countChanged&&!fieldChanged){
          renderHdr();
        } else {
          renderHdr();renderTabCounts();
          const grid=document.getElementById('auction-grid-bg');
          if(grid){
            const _ss=_saveScroll();
            const all=auctionList();
            const queued=all.filter(a=>a.status==='queued').sort((a,b)=>(a.order??99999)-(b.order??99999));
            const filtered=activeCategory==='all'?queued:queued.filter(a=>(a.category||'Other')===activeCategory);
            grid.innerHTML=renderCategoryFilterBar(queued)+renderGrid(filtered,'queued');
            refreshWowheadLinks();
            _restoreScroll(_ss);
          }
          if(panelOpen&&panelTab==='raiders')renderPanel();
          if(panelOpen&&panelTab==='audit')renderAuditPanel();
          if(panelOpen&&panelTab==='runs')renderPastRunsPanel();
        }
      } else if(tab==='active'){
        // For retractions, update cards in-place to avoid scroll/focus disruption
        renderHdr();renderTabCounts();
        const changedIds=Object.keys(auctions).filter(id=>{
          const prev=prevAuctions[id];
          const a=auctions[id];
          if(!prev||!a||a.status!=='open')return false;
          const prevRetracted=Object.values(prev.bids||{}).filter(b=>b.retracted).length;
          const newRetracted=Object.values(a.bids||{}).filter(b=>b.retracted).length;
          return newRetracted>prevRetracted||a.currentBid!==prev.currentBid||a.paused!==prev.paused||a.previewBid!==prev.previewBid||a.endsAt!==prev.endsAt||a.remaining!==prev.remaining||a.name!==prev.name||a.note!==prev.note;
        });
        // Items that just transitioned to open (queued→open or brand new)
        const newlyOpen=Object.keys(auctions).filter(id=>auctions[id]?.status==='open'&&prevAuctions[id]?.status!=='open');
        // Items that just left open (closed/sold/expired)
        const closedOpen=Object.keys(prevAuctions).filter(id=>prevAuctions[id]?.status==='open'&&auctions[id]?.status!=='open');
        const activeLayoutChanged=Object.keys(auctions).some(id=>{const a=auctions[id],p=prevAuctions[id];return a&&p&&a.status==='open'&&(a.order!==p.order||a.category!==p.category);});
        const needsGridRebuild=newlyOpen.length>0||closedOpen.length>0||activeLayoutChanged;
        if(!needsGridRebuild&&changedIds.length>0&&changedIds.length<5){
          // Small targeted update — replace only changed cards
          changedIds.forEach(id=>{
            const a=auctions[id];if(!a)return;
            const wrap=document.getElementById('wrap-'+id);
            const oldCard=document.getElementById('card-'+id);
            if(wrap&&oldCard){
              const t=document.createElement('div');
              t.innerHTML=renderCard(a,'open');
              if(t.firstElementChild)wrap.replaceChild(t.firstElementChild,oldCard);
            }
          });
          // Just update the filter bar counts
          const grid=document.getElementById('auction-grid-bg');
          if(grid){
            const filterBar=grid.querySelector('.cat-filter-bar');
            if(filterBar){
              const active=auctionList().filter(a=>a.status==='open');
              const t=document.createElement('div');
              t.innerHTML=renderLiveFilterBar(active);
              if(t.firstElementChild)filterBar.replaceWith(t.firstElementChild);
            }
          }
          refreshWowheadLinks();
        } else {
          // Full in-place grid rebuild for larger changes
          const grid=document.getElementById('auction-grid-bg');
          if(grid){
            const _ss=_saveScroll();
            const all=auctionList();
            const active=all.filter(a=>a.status==='open');
            let liveList=active;
            if(watchOnly) liveList=active.filter(a=>favs.has(a.id));
            else if(myBidsOnly) liveList=active.filter(a=>Object.values(a.bids||{}).some(b=>!b.retracted&&b.bidder===currentRaiderName()));
            else if(liveCatFilter!=='all') liveList=active.filter(a=>(a.category||'Other')===liveCatFilter);
            grid.innerHTML=renderLiveFilterBar(active)+renderGrid(liveList,'open');
            refreshWowheadLinks();
            _restoreScroll(_ss);
          }
        }
        if(panelOpen&&panelTab==='raiders')renderPanel();
        if(panelOpen&&panelTab==='audit')renderAuditPanel();
        if(panelOpen&&panelTab==='runs')renderPastRunsPanel();
      } else {
        // sold / expired tabs — update changed cards in-place
        renderHdr();renderTabCounts();
        const currentStatus=tab==='sold'?'sold':tab==='expired'?'expired':null;
        const changedIds=Object.keys(auctions).filter(id=>{
          const prev=prevAuctions[id];
          const a=auctions[id];
          if(!prev||!a)return false;
          return a.currentBid!==prev.currentBid||a.paid!==prev.paid||a.name!==prev.name||a.status!==prev.status||a.note!==prev.note;
        });
        const statusChanged=Object.keys(auctions).some(id=>auctions[id]?.status!==prevAuctions[id]?.status)||Object.keys(auctions).length!==Object.keys(prevAuctions).length;
        if(!statusChanged&&changedIds.length>0&&changedIds.length<8){
          // Surgical: replace only changed cards
          changedIds.forEach(id=>{
            const a=auctions[id];if(!a)return;
            const wrap=document.getElementById('wrap-'+id);
            const oldCard=document.getElementById('card-'+id);
            if(wrap&&oldCard){
              const mode=a.status==='sold'?'sold':a.status==='expired'?'expired':'open';
              const t=document.createElement('div');
              t.innerHTML=renderCard(a,mode);
              if(t.firstElementChild)wrap.replaceChild(t.firstElementChild,oldCard);
            }
          });
          refreshWowheadLinks();
        } else {
          // Full grid rebuild needed (status change, item added/removed)
          const grid=document.getElementById('auction-grid-bg');
          const _ss=_saveScroll();
          if(grid&&currentStatus){
            const all=auctionList();
            const items=all.filter(a=>a.status===currentStatus);
            grid.innerHTML=currentStatus==='sold'
              ?renderCategoryFilterBar(items)+renderGrid(items,'sold')
              :renderGrid(items,'expired');
            refreshWowheadLinks();
          } else {
            render();
          }
          _restoreScroll(_ss);
        }
        if(panelOpen&&panelTab==='raiders')renderPanel();
        if(panelOpen&&panelTab==='audit')renderAuditPanel();
        if(panelOpen&&panelTab==='runs')renderPastRunsPanel();
      }
    }

    // Keep pot bar and my-loot panel in sync after in-place updates
    if(user&&potLootChanged){
      refreshPotAndLoot();
      if(rolloutMode&&document.querySelector('.rollout-overlay'))renderRollout();
    }
    // Nickname changed somewhere — refresh displayed names without losing scroll
    if(user&&nicksChanged){const _sc=_saveScroll();render();_restoreScroll(_sc);}

    // Apply glows AFTER card update
    pendingGlows.forEach(({id})=>{
      const card=document.getElementById('card-'+id);
      if(card){
        card.classList.remove('bid-glow');
        void card.offsetWidth;
        card.classList.add('bid-glow');
        setTimeout(()=>card.classList.remove('bid-glow'),950);
      } else if(cardRects[id]){
        const r=cardRects[id];
        const el=document.createElement('div');
        el.style.cssText=`position:fixed;left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;`
          +`pointer-events:none;z-index:9998;border-radius:5px;border:1px solid var(--border-gold);`
          +`animation:bidGlow .9s ease-out forwards;`;
        document.body.appendChild(el);
        setTimeout(()=>el.remove(),950);
      }
    });

    // Fire coin explosions for newly sold items (non-modal case)
    pendingExplosions.forEach(({id,amount,rect})=>{
      const r=rect||cardRects[id];
      setTimeout(()=>coinExplosionAt(amount,r),50);
    });
  });
}

function renderConnecting(){
  const main=document.getElementById('main');
  if(!main)return;
  main.innerHTML=`<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:40vh;gap:1rem;">
    <div style="font-family:'Cinzel',serif;font-size:.85rem;letter-spacing:.15em;color:var(--text-muted);text-transform:uppercase;">Connecting&hellip;</div>
    <div style="width:32px;height:32px;border:2px solid rgba(201,168,76,0.2);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;"></div>
  </div>`;
}

async function getOrCreateRun(){
  renderHdr();renderConnecting();
  let snap,createdFreshRun=false;
  try{
    const timeout=new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),10000));
    snap=await Promise.race([get(ref(db,'runs')),timeout]);
  }catch(e){
    const main=document.getElementById('main');
    if(main)main.innerHTML=`<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:40vh;gap:.75rem;padding:2rem;text-align:center;">
      <div style="font-family:'Cinzel',serif;font-size:.85rem;letter-spacing:.1em;color:var(--red);text-transform:uppercase;">Connection failed</div>
      <div style="font-size:.78rem;color:var(--text-muted);max-width:280px;">Could not reach the database. Check your connection and <button onclick="location.reload()" style="background:none;border:none;color:var(--gold);cursor:var(--gs-action-cursor,pointer);font-family:'Cinzel',serif;font-size:.78rem;text-decoration:underline;padding:0;">reload</button>.</div>
    </div>`;
    return;
  }

// Scroll preservation across grid rebuilds.
// The grid uses content-visibility:auto with a contain-intrinsic-size estimate,
// so right after a rebuild the off-screen cards are sized to the estimate and the
// document is briefly shorter than the saved offset — a raw scrollTop restore then
// gets clamped toward the top. To avoid that we anchor to an actual card that is at
// the top of the viewport and re-align it to the same offset after the rebuild,
// which doesn't depend on the estimated document height. A few candidate anchors are
// stored in case the topmost one is the card that just got removed (e.g. on close).
function _saveScroll(){
  const m=document.getElementById('main');
  const y=window.scrollY||document.documentElement.scrollTop||document.body.scrollTop||0;
  const anchors=[];
  const wraps=document.querySelectorAll('#auction-grid-bg .card-wrap');
  for(const w of wraps){
    if(!w.id)continue;
    const r=w.getBoundingClientRect();
    if(r.bottom>0){ anchors.push({id:w.id,offset:r.top}); if(anchors.length>=4)break; }
  }
  const nested=[],seen=new Set();
  const remember=(el,locator)=>{
    if(!el||seen.has(el)||(!el.scrollTop&&!el.scrollLeft))return;
    seen.add(el);nested.push({...locator,top:el.scrollTop,left:el.scrollLeft});
  };
  document.querySelectorAll('[data-scroll-key]').forEach(el=>remember(el,{key:el.dataset.scrollKey}));
  document.querySelectorAll('[id]').forEach(el=>remember(el,{id:el.id}));
  ['.tabs','.cat-filter-bar','.bulk-bar','.modal-overlay','.modal','.dropdown','.member-tooltip','.loot-display-sidebar','.loot-display-body','.unpaid-overlay-body','.attendance-manager-scroll'].forEach(selector=>{
    document.querySelectorAll(selector).forEach((el,index)=>remember(el,{selector,index}));
  });
  return {y,main:m?m.scrollTop:0,anchors,nested};
}
function _restoreScroll(s){
  if(!s)return;
  const apply=()=>{
    if(s.anchors&&s.anchors.length){
      for(const a of s.anchors){
        const el=document.getElementById(a.id);
        if(el){ window.scrollBy(0,el.getBoundingClientRect().top-a.offset); return; }
      }
    }
    window.scrollTo(0,s.y); // fallback: the anchored card(s) were removed
  };
  const restoreNested=()=>{
    (s.nested||[]).forEach(saved=>{
      let el=null;
      if(saved.key)el=[...document.querySelectorAll('[data-scroll-key]')].find(node=>node.dataset.scrollKey===saved.key)||null;
      else if(saved.id)el=document.getElementById(saved.id);
      else if(saved.selector)el=document.querySelectorAll(saved.selector)[saved.index]||null;
      if(el){el.scrollTop=saved.top;el.scrollLeft=saved.left;}
    });
  };
  const applyAll=()=>{apply();restoreNested();};
  applyAll();                                                  // before paint
  requestAnimationFrame(applyAll);                             // after layout
  requestAnimationFrame(()=>requestAnimationFrame(applyAll));  // after content-visibility settles
  const m=document.getElementById('main');
  if(m&&s.main)requestAnimationFrame(()=>{const mm=document.getElementById('main');if(mm)mm.scrollTop=s.main;});
}

let settlementsDashboardUnsubscribe=null,settlementsDashboardEntries=[];
function collectSettlementTasks(runs,currentKey){
  const entries=[];
  Object.entries(runs||{}).forEach(([key,run])=>{
    if(!run||run.deleted||run.deletedAt||(!run.archived&&key!==currentKey))return;
    const state=run.settlement||{};
    Object.entries(state.raiders||{}).forEach(([raiderKey,r])=>{
      if(!r)return;
      const s=r.submission||{},request=r.cutRequest||{};
      const adjustments=Object.values(r.cutAdjustments||{}).filter(a=>a&&!a.reversedAt).reduce((sum,a)=>sum+(Number(a.amount)||0),0);
      const locked=state.payoutStarted&&r.lockedCut!=null&&Number.isFinite(Number(r.lockedCut));
      const cut=locked?Math.max(0,Math.floor(Number(r.lockedCut)+adjustments)):null;
      const paid=r.paidAmount!=null&&Number.isFinite(Number(r.paidAmount))?Number(r.paidAmount):r.paid?(cut||0):0;
      const complete=!!r.paid&&(cut===null||paid>=cut);
      const dispute=['pending','open','reopened'].includes(request.status)||(!request.status&&!!request.submittedAt);
      const category=dispute?'dispute':complete?null:s.status==='correction'?'correction':s.submittedAt?(s.method==='usdc'?'usdc':'gold'):state.payoutStarted?'unclaimed':null;
      if(!category)return;
      const due=cut===null?null:Math.max(0,cut-paid),rate=Number(r.paidRateUsdPer1000||s.rateUsdcPer1000||state.usdPer1000||state.usdcPer1000)||10;
      const amount=due===null?'Amount available in settlement':s.method==='usdc'?`${(due*rate/1000).toFixed(2)} USDC`:`${due.toLocaleString()}g${s.method?'':' · method not chosen'}`;
      entries.push({key,raiderKey,name:r.name||'Unnamed raider',title:run.settings?.raidTitle||'Untitled Run',date:run.createdAt||run.archivedAt||0,archived:!!run.archived,category,amount,note:dispute?request.note||'':s.status==='correction'?s.correctionNote||'':'',hasProof:!!s.imageData||!!request.hasAttachment});
    });
  });
  const priority={dispute:0,gold:1,usdc:1,correction:2,unclaimed:3};
  return entries.sort((a,b)=>priority[a.category]-priority[b.category]||a.date-b.date||a.name.localeCompare(b.name));
}

function syncHeaderLayout(){
  const header=document.querySelector('.hdr'),logo=header?.querySelector('.logo-center'),controls=document.getElementById('hdr-user'),left=header?.querySelector('.header-left');
  if(!header||!logo||!controls)return;
  if(window.innerWidth<=600){header.classList.remove('header-stacked');return;}
  header.classList.remove('header-stacked');
  const headerBox=header.getBoundingClientRect(),logoBox=logo.getBoundingClientRect(),controlsBox=controls.getBoundingClientRect(),leftBox=left?.getBoundingClientRect(),clearance=24;
  const childBoxes=[...controls.children].map(el=>el.getBoundingClientRect()).filter(box=>box.width>0);
  const controlsLeft=Math.min(controlsBox.left,...childBoxes.map(box=>box.left)),controlsRight=Math.max(controlsBox.right,...childBoxes.map(box=>box.right));
  const collision=controlsLeft<logoBox.right+clearance||controlsRight>headerBox.right+1||(leftBox&&leftBox.width>0&&leftBox.right>logoBox.left-clearance);
  header.classList.toggle('header-stacked',collision);
}

function showOnlineTooltip(e){

  const byName={};

    if(!byName[k]||m.lastSeen>byName[k].lastSeen) byName[k]=m;
  });
  const members=Object.values(byName).filter(m=>m.name).sort((a,b)=>(a.name||'').localeCompare(b.name||''));

  const tip=document.createElement('div');

  const GAP=6;

function accountReservedWithdrawals(data=accountData){return Math.round(Object.values(data?.withdrawals||{}).filter(w=>w?.status==='submitted'||w?.status==='correction').reduce((sum,w)=>sum+Math.max(0,settlementNum(w.amount)),0)*100)/100;}

function closeUserSettings(){
  const ov=document.getElementById('user-settings-overlay');
  if(ov)ov.remove();
}

function saveUserSettings(){
  const soundOn=document.getElementById('us-sound')?.checked;
  const newMuted=!soundOn;
  if(newMuted!==soundMuted){
    soundMuted=newMuted;
    localStorage.setItem('gdkp_muted',soundMuted?'1':'0');
    if(soundMuted){clearTimeout(notificationSoundTimer);notificationSoundTimer=null;if(activeNotificationAudio){activeNotificationAudio.pause();activeNotificationAudio=null;}}
    else playCoinSound(true);
    renderHdr();
  }
  const nickInput=document.getElementById('us-nick');
  if(nickInput&&user&&runId){
    const nick=sanitizeNick(nickInput.value);
    const current=sanitizeNick(nickMap[user]||'');
    if(nick!==current){
      try{update(runRef('/nicks'),{[user]:nick||null});}catch(e){toast('Could not save nickname');}
      // Local echo updates nickMap via onValue; that path triggers a scroll-preserving render
    }
  }
  closeUserSettings();
  toast('Account preferences saved');
}

let _previewTimer=null;
function previewStartBid(v){
  // Live preview while typing in the edit modal. Local card updates instantly;
  // a debounced display-only previewBid field broadcasts to raiders so they see
  // the price ticking, without committing anything until Save.
  if(!editId)return;
  const a=auctions[editId];
  if(!a||a.status!=='open')return;
  const val=queueToStored(Number(v),queueCurrency());
  if(!Number.isFinite(val)||val<=0)return;
  const id=editId;
  const wrap=document.getElementById('wrap-'+id);
  const oldCard=document.getElementById('card-'+id);
  if(wrap&&oldCard){
    const t=document.createElement('div');
    t.innerHTML=renderCard({...a,previewBid:val,previewAt:Date.now()},'open');
    if(t.firstElementChild)wrap.replaceChild(t.firstElementChild,oldCard);
  }
  clearTimeout(_previewTimer);
  _previewTimer=setTimeout(()=>{
    if(editId!==id)return; // modal closed or moved on — don't write a ghost preview
    update(runRef(`/auctions/${id}`),{previewBid:val,previewAt:Date.now()});
  },350);
}

  const myOwed=myTotal-myPaid;
  const myLootHTML=myWon.length?`<div class="my-loot">
    <div class="my-loot-title">Your Loot This Run</div>
    <div class="my-loot-items">${myWon.map(i=>`

        ${i.icon&&i.itemId?`<a href="https://www.wowhead.com/tbc/item=${i.itemId}" data-wowhead="item=${i.itemId}&domain=tbc" style="display:flex;align-items:center;text-decoration:none;"><img loading="lazy" decoding="async" src="${iconUrl(i.icon)}" style="border:1px solid var(--border-gold);border-radius:2px;" /></a>`
          :i.icon?`<img loading="lazy" decoding="async" src="${iconUrl(i.icon)}" />`:''}
        ${i.itemId?`<a class="item-name ${i.quality}" href="https://www.wowhead.com/tbc/item=${i.itemId}" data-wowhead="item=${i.itemId}&domain=tbc" style="font-size:.8rem;text-decoration:none;">${i.name}</a>`
          :`<span class="item-name ${i.quality}" style="font-size:.8rem;">${i.name}</span>`}
        <span style="margin-left:auto;display:flex;align-items:center;gap:.4rem;">
          <span style="font-family:'Cinzel',serif;font-size:.75rem;color:var(--gold-light);">${displayMoney(i.price)}</span>
          ${i.paid?`<span style="font-size:.68rem;color:var(--green);background:rgba(96,204,128,0.15);border:1px solid rgba(96,204,128,0.3);padding:.1rem .35rem;border-radius:2px;font-family:'Cinzel',serif;">Paid</span>`:''}
        </span>
      </div>`).join('')}
    </div>
    <div class="my-loot-total" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.35rem;">

function refreshPotAndLoot(){
  const main=document.getElementById('main');
  if(!main||!user)return;
  if(!main.querySelector(':scope > .tabs'))return; // renderMain hasn't run yet
  const swap=(cls,html,anchorCls)=>{
    const el=main.querySelector(':scope > .'+cls);
    if(el){
      if(html){const t=document.createElement('div');t.innerHTML=html;if(t.firstElementChild)el.replaceWith(t.firstElementChild);}
      else el.remove();
    } else if(html){
      const t=document.createElement('div');t.innerHTML=html;
      const node=t.firstElementChild;
      if(!node)return;
      const anchor=anchorCls?main.querySelector(':scope > .'+anchorCls):null;
      if(anchor)anchor.after(node);
      else main.insertBefore(node,main.querySelector(':scope > .tabs'));
    }
  };
  swap('pot-bar',buildPotBarHTML(),null);
  swap('my-loot',buildMyLootHTML(),'pot-bar');
  refreshWowheadLinks();
}
