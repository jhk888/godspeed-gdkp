function renderSplits(){
  const p=pot();
  const adminAmt=Math.floor(p*(splits.adminCut/100));
  const distributable=p-adminAmt;
  const totalPct=splits.roles.reduce((s,r)=>s+r.slots.reduce((ss,sl)=>ss+(parseFloat(sl.pct)||0),0),0);
  const sanityOk=Math.abs(totalPct-100)<0.01;

  const roleSections=splits.roles.map((role,ri)=>{
    const rolePct=role.slots.reduce((s,sl)=>s+(parseFloat(sl.pct)||0),0);
    const rolePayout=Math.floor(distributable*(rolePct/100));
    const rows=role.slots.map((sl,si)=>{
      const payout=Math.floor(distributable*((parseFloat(sl.pct)||0)/100));
      return`<tr>
        <td><input type="text" value="${sl.label}" oninput="updateSlot(${ri},${si},'label',this.value)" style="width:80px;" /></td>
        <td><input type="text" value="${sl.player}" oninput="updateSlot(${ri},${si},'player',this.value)" placeholder="Name..." /></td>
        <td><input type="number" value="${sl.pct}" step="0.25" min="0" oninput="updateSlot(${ri},${si},'pct',this.value)" style="width:65px;" /></td>
        <td><div class="payout-cell">${displayMoney(payout)}</div></td>
        <td><input type="text" value="${sl.note}" oninput="updateSlot(${ri},${si},'note',this.value)" placeholder="Note..." /></td>
        <td><button class="remove-slot-btn" onclick="removeSlot(${ri},${si})">&#x2715;</button></td>
      </tr>`;
    }).join('');
    return`<div class="role-section">
      <div class="role-hdr">
        <div class="role-title">${role.name}</div>
        <div class="role-summary">${rolePct.toFixed(2)}% &nbsp;|&nbsp; ${displayMoney(rolePayout)}</div>
      </div>
      <table class="splits-table">
        <thead><tr><th>Slot</th><th>Name</th><th>%</th><th>Payout</th><th>Note</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <button class="add-slot-btn" onclick="addSlot(${ri})">+ Add Slot</button>
    </div>`;
  }).join('');

  return`<div class="splits-wrap">
    <div class="admin-cut-bar">
      <div style="font-family:'Cinzel',serif;font-size:.65rem;color:var(--text-muted);letter-spacing:.1em;">Admin Cut</div>
      <div class="fg" style="flex-direction:row;align-items:center;gap:.5rem;">
        <input type="number" id="admin-cut-inp" value="${splits.adminCut}" min="0" max="99" step="1" style="width:70px;" oninput="updateAdminCut(this.value)" />
        <span style="font-size:.85rem;color:var(--text-muted);">%</span>
      </div>
      <div style="font-family:'Cinzel',serif;font-size:.85rem;color:var(--gold);">${displayMoney(adminAmt)} admin</div>
      <div style="font-family:'Cinzel',serif;font-size:.85rem;color:var(--gold-light);">${displayMoney(distributable)} to raiders</div>
      <div style="margin-left:auto;">${sanityOk?`<span class="sanity-ok">&#10003; 100%</span>`:`<span class="sanity-warn">&#9888; ${totalPct.toFixed(2)}% (should be 100%)</span>`}</div>
      <button class="btn btn-outline btn-sm" onclick="saveSplits()">Save</button>
    </div>
    <div class="admin-cut-bar" style="gap:.75rem;">
      <div style="font-family:'Cinzel',serif;font-size:.65rem;color:var(--text-muted);letter-spacing:.1em;white-space:nowrap;">Loot categories</div>
      <input type="text" id="cat-settings-inp" value="${raidCategories.join(', ')}" placeholder="Tier, Physical, Caster/Healer" style="flex:1;" />
      <button class="btn btn-outline btn-sm" onclick="saveCategories()">Save</button>
    </div>
    <div class="splits-summary">
      <div class="splits-stat"><div class="splits-stat-lbl">Total Pot</div><div class="splits-stat-val">${displayMoney(p)}</div></div>
      <div class="splits-stat"><div class="splits-stat-lbl">Admin (${splits.adminCut}%)</div><div class="splits-stat-val">${displayMoney(adminAmt)}</div></div>
      <div class="splits-stat"><div class="splits-stat-lbl">To Raiders</div><div class="splits-stat-val">${displayMoney(distributable)}</div></div>
      <div class="splits-stat"><div class="splits-stat-lbl">Sanity</div><div class="splits-stat-val ${sanityOk?'ok':'warn'}">${totalPct.toFixed(2)}%</div></div>
    </div>

  </div>`;
}

  if(groups.length)groups.forEach(group=>{const record=purchasePaymentRecord(group),payment=calculatePurchasePayment(group,record),method=payment.mode==='gold'?'Gold':payment.mode==='split'?`${payment.usdMethod==='usdc'?'USDC':'USD'} + Gold`:payment.usdMethod==='usdc'?'USDC':'USD',due=payment.mode==='gold'?ledgerGold(payment.goldPortion):`${payment.usdMethod==='usdc'?payment.amountDue.toFixed(2)+' USDC':'$'+payment.amountDue.toFixed(2)}${payment.goldPortion?` + ${ledgerGold(payment.goldPortion)}`:''}`,discount=payment.usdcDiscount?` · discount $${payment.usdcDiscount.toFixed(2)}`:'';lines.push(`• ${displayName(group.name)||group.name}: ${due} via ${method}${discount} · ${ledgerGold(payment.goldCredited)} pot credit · ${payment.received?'Received':'Pending'}`);});
  else lines.push('No purchaser records.');
  lines.push('','RAIDER CUTS');
  if(raiders.length)raiders.forEach(r=>{const cut=effectiveRaiderCut(r,calc),due=payoutStillDue(r,cut),bonuses=ledgerBonusText(r,calc),status=payoutIsComplete(r,cut)?'Paid':payoutPaidAmount(r,cut)>0?`${ledgerPayoutText(r,due)} remaining`:r.submission?.submittedAt?'Claim ready':'Unclaimed';lines.push(`• ${displayName(r.name)||r.name}: ${ledgerPayoutText(r,cut)} · ${payoutSelectedMethod(r).toUpperCase()} · ${status}`);if(bonuses)lines.push(`  Bonuses: ${bonuses}`);});
  else lines.push('No raider cuts.');
  lines.push('',`Generated ${new Date().toLocaleString('en-US')}`);
  const copied=await copyTextReliable(lines.join('\n'));
  if(copied)toast('Full ledger copied for posting');
  else wowConfirm({title:'Copy Full Ledger',msg:`Clipboard access was blocked. Select and copy the ledger below.<br><textarea readonly style="width:100%;min-height:320px;margin-top:.75rem;">${settlementEsc(lines.join('\n'))}</textarea>`,confirmLabel:'Done',onConfirm:()=>{}});
}

function memberHistoryAction(encodedName,action){

      </div>
      ${!collapsed&&user?(()=>{const sp=getMemberSpend(user);return sp>0?`<div style="padding:.25rem .9rem .1rem;font-size:.68rem;color:var(--gold);font-family:'Cinzel',serif;border-bottom:1px solid rgba(201,168,76,0.1);">Spent: ${displayMoney(sp)}</div>`:''})():''}

}

function renderLootDisplay(activeCat){
  document.getElementById('loot-display-overlay')?.remove();
  const sold=auctionList().filter(a=>a.status==='sold').sort((a,b)=>b.currentBid-a.currentBid);
  if(!sold.length){toast('No items sold yet');lootDisplayMode=false;if(isRL)update(runRef(),{lootDisplay:false}).catch(()=>{});return;}
  const title=raidSettings.raidTitle||'Gold DKP Run';
  const qualityColors={legendary:'#ff8000',epic:'#a335ee',rare:'#0070dd',uncommon:'#1eff00',common:'#fff'};

  // Category tabs from actual sold items
  const cats=['All',...[...new Set(sold.map(a=>a.category||'Other'))].sort()];
  if(!activeCat||!cats.includes(activeCat))activeCat='All';
  const filtered=activeCat==='All'?sold:sold.filter(a=>(a.category||'Other')===activeCat);
  const pot=sold.reduce((s,a)=>s+(a.currentBid||0),0);

  const cards=filtered.map((a,i)=>{
    const bids=Object.values(a.bids||{}).filter(b=>!b.retracted).sort((x,y)=>y.amount-x.amount);
    const winner=displayName(bids[0]?.bidder)||'Unknown';
    const qColor=qualityColors[a.quality]||'#c590ff';
    const icon=getIconImg(a.itemId,a.itemIcon,80);
    const wowAttrs=a.itemId?`href="https://www.wowhead.com/tbc/item=${a.itemId}" data-wowhead="item=${a.itemId}&domain=tbc" target="_blank"`:'href="#" onclick="return false;"';
    return`<a class="loot-card" ${wowAttrs} style="animation-delay:${i*18}ms;">
      <div class="loot-card-icon-wrap">${icon}</div>
      <div class="loot-card-name" style="color:${qColor};">${a.name}</div>
      <div class="loot-card-footer">
        <div class="loot-card-winner">${winner}</div>
        <div class="loot-card-price">${displayMoney(a.currentBid||0)}</div>
      </div>
    </a>`;
  }).join('');

  // Sidebar
  const allItems=auctionList().sort((a,b)=>{const o={open:0,queued:1,sold:2,expired:3};return(o[a.status]??4)-(o[b.status]??4);});
  const statusColors={open:'#60cc80',queued:'#c9a84c',sold:'rgba(201,168,76,0.4)',expired:'#cc6060'};
  const statusLabels={open:'Live',queued:'Queue',sold:'Sold',expired:'Exp'};
  const statusBadgeCss={open:'background:rgba(96,204,128,0.15);color:#60cc80;border:1px solid rgba(96,204,128,0.3);',queued:'background:rgba(201,168,76,0.12);color:#c9a84c;border:1px solid rgba(201,168,76,0.25);',sold:'background:rgba(201,168,76,0.08);color:rgba(201,168,76,0.5);border:1px solid rgba(201,168,76,0.15);',expired:'background:rgba(200,60,60,0.12);color:#cc6060;border:1px solid rgba(200,60,60,0.25);'};
  const sidebarItems=allItems.map(a=>{
    const wowAttrs=a.itemId?`href="https://www.wowhead.com/tbc/item=${a.itemId}" data-wowhead="item=${a.itemId}&domain=tbc" target="_blank"`:'href="#" onclick="return false;"';
    return`<div class="loot-sidebar-item"><a ${wowAttrs} onclick="event.stopPropagation();" style="display:flex;align-items:center;gap:.4rem;text-decoration:none;width:100%;"><div class="loot-sidebar-dot" style="background:${statusColors[a.status]||'#555'};"></div><span class="loot-sidebar-name">${a.name}</span><span class="loot-sidebar-badge" style="${statusBadgeCss[a.status]||''}">${statusLabels[a.status]||'?'}</span></a></div>`;
  }).join('');

  const catBtns=cats.map(c=>{
    const count=c==='All'?sold.length:sold.filter(a=>(a.category||'Other')===c).length;
    return`<button class="loot-display-cat-btn${c===activeCat?' active':''}" onclick="event.stopPropagation();renderLootDisplay('${c}')">${c} <span style="opacity:.6;">(${count})</span></button>`;
  }).join('');

  const overlay=document.createElement('div');
  overlay.id='loot-display-overlay';
  overlay.className='loot-display-overlay';
  overlay.innerHTML=`
    <div class="loot-display-sidebar">
      <div class="loot-display-sidebar-hdr">Run Loot (${allItems.length})</div>
      ${sidebarItems}
    </div>
    <div class="loot-display-content">
      <div class="loot-display-hdr">
        <div style="flex:1;">
          <div class="loot-display-title">${title}</div>
          <div class="loot-display-sub">${sold.length} item${sold.length!==1?'s':''} sold${isRL?` &middot; ${displayMoney(pot)} pot`:''}</div>
        </div>
        ${isRL?`<button class="loot-display-close-btn" onclick="toggleLootDisplay()">&#x2715; End Display</button>`:''}
      </div>
      ${cats.length>1?`<div class="loot-display-cats">${catBtns}</div>`:''}
      <div class="loot-display-body">
        <div class="loot-display-grid-inner">
          ${filtered.length?cards:`<div style="grid-column:1/-1;text-align:center;font-family:'Cinzel',serif;font-size:.82rem;color:rgba(201,168,76,0.3);padding:4rem 0;">No items in this category</div>`}
        </div>
      </div>
    </div>`;

  document.body.appendChild(overlay);
  if(window.$WowheadPower)window.$WowheadPower.refreshLinks();
}

async function resetRun(newRate=runUsdRate()){
  lootDisplayMode=false;
  document.getElementById('loot-display-overlay')?.remove();
  localStorage.removeItem('gdkp_archive_display');
  await update(runRef(),{archived:true,archivedAt:Date.now(),lootDisplay:false,archiveDisplay:null});
  // Create new run
  const nr=push(ref(db,'runs'));
  runId=nr.key;
  splitsLoaded=false;
  splits=JSON.parse(JSON.stringify(DEFAULT_SPLITS));
  const nextCut=Number.isFinite(parseFloat(settlement.managementCut))?parseFloat(settlement.managementCut):DEFAULT_SETTLEMENT.managementCut;
  const savedMutators=JSON.parse(JSON.stringify(settlement.mutators||{}));
  newRate=Math.max(.01,settlementNum(newRate)||10);
  settlement={...JSON.parse(JSON.stringify(DEFAULT_SETTLEMENT)),managementCut:nextCut,ahFeePct:settlementNum(settlement.ahFeePct)||5,usdPer1000:newRate,usdcPer1000:newRate,mutators:savedMutators};
  payoutDraftImage=null;payoutDraftFields={seller:'',item:'',wallet:'',dirty:false};payoutDraftMethod='';rlAttendanceEnsuredFor='';
  attendance={};
  attendanceSettings={enabled:false,open:false};
  // Clear local state immediately so UI doesn't show stale pot/title

  render();

  subscribeToRun();subscribeSiteContent();
  toast(`New run started at ${usdText(newRate)} per 1,000 gold`);
}

// ── Grids & Cards ─────────────────────────────────────────────────────────
function renderCategoryRows(list,mode){
  if(!list.length)return`<div class="empty"><div style="font-family:'Cinzel',serif;color:var(--gold-dim);">No live auctions</div></div>`;
  const catOrder=['Tier','Physical','Caster/Healer','Other'];
  const catLabelClass={'Tier':'cat-row-tier','Physical':'cat-row-physical','Caster/Healer':'cat-row-caster','Other':'cat-row-other'};
  const cardWrap=(a)=>{
    const checked=selectedItems.has(a.id);
    const checkbox=isRL?`<div class="card-check ${checked?'checked':''}" onclick="toggleSelect(event,'${a.id}','${mode}')" title="Select">${checked?'✓':''}</div>`:'';
    return`<div id="wrap-${a.id}" class="card-wrap ${checked?'card-selected':''}" style="position:relative;${isRL?'cursor:var(--gs-action-cursor,pointer);':''}" onclick="cardClick(event,'${a.id}','${mode}')">${checkbox}${renderCard(a,mode)}</div>`;
  };
  // Group by category
  const groups={};
  list.forEach(a=>{
    const cat=a.category||'Other';
    if(!groups[cat])groups[cat]=[];
    groups[cat].push(a);
  });
  // Render in order, skip empty categories
  const rows=catOrder.filter(c=>groups[c]?.length).map(cat=>{
    const items=groups[cat];
    const cls=catLabelClass[cat]||'cat-row-other';
    const cards=items.map(cardWrap).join('');
    return`<div class="cat-row">
      <div class="cat-row-label ${cls}">${cat}</div>
      <div class="cat-row-scroll">${cards}</div>
    </div>`;
  });
  // Any uncategorized categories not in catOrder
  Object.keys(groups).filter(c=>!catOrder.includes(c)).forEach(cat=>{
    const cards=groups[cat].map(cardWrap).join('');
    rows.push(`<div class="cat-row">
      <div class="cat-row-label cat-row-other">${cat}</div>
      <div class="cat-row-scroll">${cards}</div>
    </div>`);
  });
  const bulkBar=isRL?renderBulkBar(list,mode):'';
  return bulkBar+rows.join('');
}

function cardClick(evt,id,mode){
  if(!isRL)return;
  // Ignore clicks on interactive elements — let them do their job
  if(evt.target.closest('button,input,a,.card-check,select,textarea'))return;
  toggleSelect(evt,id,mode);
}
function toggleSelect(evt,id,mode){
  evt.stopPropagation();
  const list=currentModeList(mode);
  const ids=list.map(a=>a.id);
  if(evt.shiftKey&&lastSelectedId&&lastSelectedMode===mode){
    const a=ids.indexOf(lastSelectedId),b=ids.indexOf(id);
    if(a>=0&&b>=0){const[lo,hi]=[Math.min(a,b),Math.max(a,b)];for(let i=lo;i<=hi;i++)selectedItems.add(ids[i]);}
  } else {
    if(selectedItems.has(id))selectedItems.delete(id);else selectedItems.add(id);
  }
  lastSelectedId=id;lastSelectedMode=mode;
  renderMain();
}

function toggleSelectAll(mode){
  const list=currentModeList(mode);
  const ids=list.map(a=>a.id);
  const allSelected=ids.length>0&&ids.every(id=>selectedItems.has(id));
  if(allSelected)ids.forEach(id=>selectedItems.delete(id));
  else ids.forEach(id=>selectedItems.add(id));
  renderMain();
}

function clearSelection(){selectedItems.clear();lastSelectedId=null;renderMain();}

function currentModeList(mode){
  const all=auctionList();
  if(mode==='open')return all.filter(a=>a.status==='open');
  if(mode==='queued')return all.filter(a=>a.status==='queued');
  if(mode==='sold')return all.filter(a=>a.status==='sold');
  if(mode==='expired')return all.filter(a=>a.status==='expired');
  return [];
}

function selectedList(){return auctionList().filter(a=>selectedItems.has(a.id));}

function bulkExtend(){
  const ids=[...selectedItems].filter(id=>auctions[id]&&auctions[id].status==='open');
  if(!ids.length)return;
  ids.forEach(id=>{
    const a=auctions[id];
    if(a.paused){update(runRef(`/auctions/${id}`),{remaining:(a.remaining||0)+30});}
    else{update(runRef(`/auctions/${id}`),{endsAt:(a.endsAt||Date.now())+30000});}
  });
  toast(`+30s added to ${ids.length} auction${ids.length!==1?'s':''}`);
  // Selection kept on purpose — extending repeatedly is the common case
}
function bulkRestart(){
  const items=selectedList().filter(a=>a.status==='expired');
  items.forEach(a=>restartAuction(a.id,true));
  clearSelection();
  toast(`Restarted ${items.length} item${items.length!==1?'s':''}`);
}

function bulkStart(){
  const items=selectedList().filter(a=>a.status==='queued');
  items.forEach(a=>startOne(a.id,true));
  clearSelection();
  toast(`Started ${items.length} item${items.length!==1?'s':''}`);
}

function bulkPause(){
  const items=selectedList().filter(a=>a.status==='open');
  items.forEach(a=>{if(!a.paused)togglePause(a.id);});
  clearSelection();
}

function bulkClose(){
  const items=selectedList().filter(a=>a.status==='open');
  wowConfirm({
    title:'Close Auctions?',
    msg:`Close ${items.length} live auction${items.length!==1?'s':''}? Items with bids will be sold to the current winner.`,
    confirmLabel:'Close',
    danger:true,
    onConfirm:()=>{
      items.forEach(a=>closeAuction(a.id,true));
      clearSelection();
    }
  });
}

let _lastRemoved=null;
function bulkRemove(mode){
  const items=selectedList();
  const cnt=items.length;
  wowConfirm({
    title:'Remove Items?',
    msg:`Remove ${cnt} item${cnt!==1?'s':''}?`,
    confirmLabel:'Remove',
    danger:true,
    onConfirm:()=>{
      // Snapshot for undo
      _lastRemoved=items.map(a=>({...a}));
      const updates={};
      items.forEach(a=>{updates[`auctions/${a.id}`]=null;});
      update(runRef(),updates);
      auditLog('bulk_remove',{count:cnt,items:items.map(a=>a.name)});
      clearSelection();
      toastUndo(`Removed ${cnt} item${cnt!==1?'s':''}`,undoBulkRemove);
    }
  });
}
function undoBulkRemove(){
  if(!_lastRemoved||!_lastRemoved.length)return;
  const updates={};
  _lastRemoved.forEach(a=>{updates[`auctions/${a.id}`]=a;});
  update(runRef(),updates);
  toast(`Restored ${_lastRemoved.length} item${_lastRemoved.length!==1?'s':''}`);
  _lastRemoved=null;
}

function renderGrid(list,mode){
  list=[...list].sort((a,b)=>(a.order??99999)-(b.order??99999)||(a.createdAt??0)-(b.createdAt??0));
  if(!list.length){const msgs={open:'No live auctions',queued:'Queue is empty',sold:'No items sold yet',expired:'No expired items'};return`<div class="empty"><div style="font-family:'Cinzel',serif;color:var(--gold-dim);">${msgs[mode]||'Nothing here'}</div></div>`;}
  const draggable=['open','queued','sold','expired'].includes(mode)&&isRL&&!archivedSettlementContext;
  const bulkBar=isRL?renderBulkBar(list,mode):'';
  return bulkBar+`<div class="grid">${list.map(a=>{
    const checked=selectedItems.has(a.id);
    const checkbox=isRL?`<div class="card-check ${checked?'checked':''}" onclick="toggleSelect(event,'${a.id}','${mode}')" title="Select">${checked?'✓':''}</div>`:'';
    return`<div ${draggable?`draggable="true" data-drag-mode="${mode}" ondragstart="dragStart(event,'${a.id}','${mode}')" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="dragDrop(event,'${a.id}')" ondragend="dragEnd(event)"`:''} id="wrap-${a.id}" class="card-wrap ${checked?'card-selected':''}" style="${draggable?'cursor:grab;':(isRL?'cursor:var(--gs-action-cursor,pointer);':'')}position:relative;" onclick="cardClick(event,'${a.id}','${mode}')">${checkbox}${renderCard(a,mode)}</div>`;
  }).join('')}</div>`;
}

function renderBulkBar(list,mode){
  const ids=list.map(a=>a.id);
  const selectedInMode=ids.filter(id=>selectedItems.has(id));
  const allSelected=ids.length>0&&selectedInMode.length===ids.length;
  const n=selectedInMode.length;
  let actions='';
  if(n>0){
    if(mode==='expired')actions=`<button class="btn btn-green btn-sm" onclick="event.stopPropagation();bulkRestart()">&#9654; Restart ${n}</button><button class="btn btn-danger btn-sm" onclick="event.stopPropagation();bulkRemove('${mode}')">Remove ${n}</button>`;
    else if(mode==='queued')actions=`<button class="btn btn-green btn-sm" onclick="event.stopPropagation();bulkStart()">&#9654; Start ${n}</button><button class="btn btn-danger btn-sm" onclick="event.stopPropagation();bulkRemove('${mode}')">Remove ${n}</button>`;
    else if(mode==='sold')actions=`<button class="btn btn-danger btn-sm" onclick="event.stopPropagation();bulkRemove('${mode}')">Remove ${n}</button>`;
    else if(mode==='open')actions=`<button class="btn btn-outline btn-sm" onclick="event.stopPropagation();bulkPause()">&#10073;&#10073; Pause ${n}</button><button class="btn btn-amber btn-sm" onclick="event.stopPropagation();bulkExtend()">+30s &times;${n}</button><button class="btn btn-danger btn-sm" onclick="event.stopPropagation();bulkClose()">Close ${n}</button>`;
  }
  return`<div class="bulk-bar bar-clickable" onclick="toggleSelectAll('${mode}')">
    <div class="card-check bulk-all ${allSelected?'checked':''}" onclick="event.stopPropagation();toggleSelectAll('${mode}')" title="Select all">${allSelected?'✓':''}</div>
    <span style="font-size:.7rem;color:var(--text-muted);font-family:'Cinzel',serif;letter-spacing:.06em;">${n>0?`${n} selected`:'Select all'}</span>
    <div style="flex:1;"></div>
    ${actions}
    ${n>0&&mode!=='open'?`<button class="btn btn-neutral btn-sm" onclick="event.stopPropagation();clearSelection()">Clear</button>`:''}
  </div>`;
}

function renderCard(a,mode){
  const allBids=Object.entries(a.bids||{}).sort((x,y)=>y[1].amount-x[1].amount);
  const bids=allBids.map(([,b])=>b).filter(b=>!b.retracted);
  const top=bids[0]||null,isLeading=top&&top.bidder===currentRaiderName();
  const hasMyBid=bids.some(b=>b.bidder===currentRaiderName());
  const isBehind=hasMyBid&&!isLeading;
  const now=Date.now();
  const rem=a.status==='open'&&!a.paused&&a.endsAt?Math.max(0,Math.floor((a.endsAt-now)/1000)):(a.remaining||0);
  const pct=a.status==='open'?Math.round((rem/(a.duration||120))*100):0;
  const urgent=rem<=15&&a.status==='open'&&!a.paused;
  const minNext=(a.currentBid||0)+(a.minIncrement||250);
  const previewActive=mode==='open'&&a.previewBid!=null&&(Date.now()-(a.previewAt||0))<8000;
  const showCustom=!!customOpen[a.id];
  const activeBids=allBids.filter(([,b])=>!b.retracted).slice(0,5);
  const retractedBids=allBids.filter(([,b])=>b.retracted);
  const histEntries=[...activeBids,...retractedBids];
  const histItems=histEntries.map(([key,b])=>{
    const isRetracted=!!b.retracted;
    const name=b.bidder===currentRaiderName()?'You':displayName(b.bidder);
    const rlX=isRL&&!isRetracted?`<button onclick="rlRetractBid('${a.id}','${key}')" style="background:none;border:none;color:var(--red);cursor:var(--gs-action-cursor,pointer);font-size:.65rem;padding:0 .2rem;opacity:.5;flex-shrink:0;" title="Retract this bid">✕</button>`:'';
    return`<div class="hist-row" style="${isRetracted?'opacity:.4;':''}">
      <span class="${b.bidder===currentRaiderName()&&!isRetracted?'you-bid':''}" style="${isRetracted?'text-decoration:line-through;color:var(--red);':''};">${name}${isRetracted?' ↩':''}</span>
        <span style="margin-left:auto;${isRetracted?'text-decoration:line-through;color:var(--red);':''}">${displayMoney(b.amount)}</span>
      ${rlX}
    </div>`;

  let timerSection='';
  if(mode==='open'){const fc=a.paused?'#e8a430':urgent?'#e26060':'#c9a84c',tc=a.paused?'var(--amber)':urgent?'var(--red)':'var(--text-muted)';const tBtns=isRL?`<button class="btn btn-outline btn-sm" style="padding:.2rem .5rem;font-size:.65rem;flex-shrink:0;" onclick="extendTimer('${a.id}')">+30s</button><button class="btn btn-outline btn-sm" style="padding:.2rem .5rem;font-size:.65rem;flex-shrink:0;" onclick="openEdit('${a.id}')">Edit</button>`:'';timerSection=`<div class="timer-row"><div class="timer-bar"><div id="tfill-${a.id}" class="timer-fill" style="width:${pct}%;background:${fc};"></div></div><span id="ttext-${a.id}" class="timer" style="color:${tc};">${a.paused?'Paused':fmtTime(rem)}</span>${tBtns}</div>`;}
  let bidSection='';

    const btns=a.bidButtons||raidSettings.defaultBidButtons||[250,500,1000];
    const cur=bids[0]?.amount||(bids.length===0?(a.startBid||1000):0);
    const noteHTML=a.note?`<div style="font-size:.78rem;color:var(--amber);margin-bottom:.2rem;">&#128203; ${a.note}</div>`:'';
    const hasBids=bids.length>0;
    const isGuest=!discordUser&&!isRL;
    const attendanceBlocked=!isRL&&!isGuest&&!attendanceCanBid();
    const bidBlocked=isGuest||attendanceBlocked;
    const qbtns=isGuest
      ?`<div style="text-align:center;padding:.5rem;font-size:.75rem;color:var(--text-muted);font-family:'Cinzel',serif;letter-spacing:.05em;">&#128274; <a onclick="joinDiscord()" style="color:var(--gold);cursor:var(--gs-action-cursor,pointer);text-decoration:underline;">Login with Discord</a> to bid</div>`
      :attendanceBlocked
      ?`<div style="text-align:center;padding:.5rem;font-size:.75rem;color:var(--amber);font-family:'Cinzel',serif;letter-spacing:.05em;">Check in to this raid before bidding</div>`
      :(hasBids
        ? btns.map(inc=>{const amt=cur+inc;return`<button class="qb" style="text-align:center;flex:1;" onclick="quickBid('${a.id}',${amt},event)">+${displayMoney(inc)}</button>`;}).join('')
        : `<button class="qb" style="flex:1;text-align:center;" onclick="quickBid('${a.id}',${cur},event)">Bid ${displayMoney(cur)}</button>`);
    const bidRightBtns=isRL?`<div class="card-side-actions">
      <button class="btn btn-clone btn-sm" onclick="duplicateItem('${a.id}')">Clone</button>
      <button class="btn btn-outline btn-sm" onclick="resetAuction('${a.id}')">Reset</button>
      <button class="btn btn-danger btn-sm" onclick="cancelAuction('${a.id}')">Cancel</button>
    </div>`:'' ;
    const cbtn=bidBlocked?'':`<button class="qb qb-custom ${showCustom?'active-custom':''}" style="width:100%;text-align:center;padding:.6rem .7rem;font-size:.85rem;font-weight:600;border-width:2px;margin-top:.35rem;" onclick="toggleCustom('${a.id}')">${showCustom?'&#x2715; Hide Custom':'Custom Bid'}</button>`;
    const crow=(!bidBlocked&&showCustom)?`<div class="custom-bid-row"><input type="number" id="bid-${a.id}" placeholder="Enter gold amount" aria-label="Custom bid in gold" min="${minNext}" step="${a.minIncrement||250}" onkeydown="if(event.key==='Enter')placeBid('${a.id}',event)" /><button class="btn btn-outline btn-sm" onclick="placeBid('${a.id}',event)">Bid</button></div>`:'';
    const autoBidSet=autoBids[a.id];
    const autoBidBtn=!isRL&&!bidBlocked?`<div style="margin-top:.3rem;display:flex;align-items:center;gap:.4rem;">
      ${autoBidSet
        ?`<span style="font-size:.7rem;color:var(--amber);font-family:'Cinzel',serif;">Auto: up to ${displayMoney(autoBidSet)}</span>
           <button onclick="clearAutoBid('${a.id}')" style="background:none;border:none;color:var(--red);cursor:var(--gs-action-cursor,pointer);font-size:.7rem;padding:0;">✕</button>`
        :`<button onclick="setAutoBid('${a.id}')" style="background:rgba(201,168,76,0.12);border:1px solid rgba(201,168,76,0.4);color:var(--gold);cursor:var(--gs-action-cursor,pointer);font-size:.7rem;font-family:'Cinzel',serif;letter-spacing:.06em;padding:.3rem .7rem;border-radius:3px;">&#9654; Auto Bid</button>`
      }
    </div>`:'' ;
    bidSection=`<div class="bid-section">${noteHTML}<div style="display:flex;align-items:flex-start;gap:.5rem;"><div><div class="bid-amt">${displayMoney(cur)}</div><div class="bid-ldr ${isLeading?'you':''}">${top?(top.bidder===currentRaiderName()?'You are leading':displayName(top.bidder)+' leads'):'Starting bid'}</div></div>${bidRightBtns}</div><div class="min-bid-note">Min next: ${displayMoney(minNext)}</div><div class="quick-bids">${qbtns}</div>${cbtn}${crow}${autoBidBtn}</div>`;
    if(previewActive){
      bidSection=`<div class="bid-section">${noteHTML}
        <div style="display:flex;align-items:flex-start;gap:.5rem;"><div><div class="bid-amt bid-preview">${displayMoney(a.previewBid||0)}</div><div class="bid-preview-note">&#9998; Price being adjusted&hellip;</div></div>${bidRightBtns}</div>
        <div class="quick-bids" style="opacity:.3;pointer-events:none;">${qbtns}</div></div>`;
    }
  }else if(mode==='open'&&a.paused){

      :(a.paid

        :(isWinner?`<div style="margin-top:.4rem;font-size:.75rem;color:var(--red);font-family:'Cinzel',serif;">&#9679; Unpaid &mdash; trade the raid leader</div>`:''));

    bidSection=`<div class="bid-section"><div class="bid-amt">${displayMoney(a.currentBid||0)}</div><div class="bid-ldr">Won by ${top?displayName(top.bidder):'&mdash;'}</div>${noteHTML}${paidBtn}</div>`;
  }
  else if(mode==='expired'){bidSection=`<div class="bid-section"><div class="bid-amt">${displayMoney(a.currentBid||0)}</div><div style="font-size:.85rem;color:var(--red);">No bids placed</div></div>`;}
  let rlControls='';
  let badge='';
  if(isRL){
    if(mode==='open'){
      const bottomBtns=`<div class="rl-controls">
        <button class="btn ${a.paused?'btn-amber-resume':'btn-amber'} btn-sm" style="display:flex;align-items:center;justify-content:center;gap:.3rem;" onclick="togglePause('${a.id}')">${a.paused?'&#9654; Resume':'<svg width="9" height="11" viewBox="0 0 9 11"><rect x="0" y="0" width="3" height="11" rx="1" fill="currentColor"/><rect x="6" y="0" width="3" height="11" rx="1" fill="currentColor"/></svg> Pause'}</button>
        <button class="btn btn-gold btn-sm" onclick="closeAuction('${a.id}')">Close</button>

      rlControls=bottomBtns;
    }

    else if(mode==='expired')rlControls=`<div class="rl-controls"><button class="btn btn-green btn-sm" onclick="restartAuction('${a.id}')">&#9654; Restart</button><button class="btn btn-outline btn-sm" onclick="openEdit('${a.id}')">Edit</button><button class="btn btn-danger btn-sm" onclick="removeQueued('${a.id}')">Remove</button></div>`;
    else if(mode==='sold')rlControls=`<div class="rl-controls"><button class="btn btn-green btn-sm" onclick="restartFromSold('${a.id}')">&#9654; Restart</button><button class="btn btn-outline btn-sm" onclick="openEditSold('${a.id}')">Edit</button><button class="btn btn-danger btn-sm" onclick="removeSold('${a.id}')">Remove</button></div>`;
  }
  const qualityClass=(a.quality==='legendary')?'quality-legendary':(a.quality==='epic')?'quality-epic':'';
  const cc=[mode==='queued'?'queued':mode==='expired'?'expiring':isLeading?'leading':isBehind?'behind':a.paused?'paused':urgent?'expiring':'', qualityClass].filter(Boolean).join(' ');
  // Status pill now lives in the slot row (right-aligned), never overlapping the name
  let statusBadge='';
  if(mode==='open'&&a.paused)statusBadge=`<div class="badge badge-paused" style="position:static;">Paused</div>`;
  else if(mode==='open')statusBadge=`<div class="badge badge-open" style="position:static;">Live</div>`;
  else if(mode==='queued')statusBadge=`<div class="badge badge-queued" style="position:static;">Queued</div>`;
  else if(mode==='expired')statusBadge=`<div class="badge badge-expired" style="position:static;">Expired</div>`;
  else statusBadge=`<div class="badge badge-sold" style="position:static;">Sold</div>`;
  const slotBadgeRow=`<div class="auction-meta-row">${catBadge||'<span></span>'}${a.slot?`<span class="item-slot">${a.slot}</span>`:'<span></span>'}${statusBadge}</div>`;
  bidSection=bidSection.replace('<div class="bid-section">','<div class="bid-section">'+slotBadgeRow);
  // Involvement badge removed — card border/glow handles leading/behind/won states
  const wonClass=mode==='sold'&&top&&top.bidder===currentRaiderName()?'won-card':'';
  const favBtn=(mode==='open'||mode==='queued')?`<button class="fav-btn ${favs.has(a.id)?'faved':''}" onclick="event.stopPropagation();toggleFav('${a.id}')" title="${favs.has(a.id)?'Remove from watchlist':'Add to watchlist'}">${favs.has(a.id)?'\u2605':'\u2606'}</button>`:'';
  return`<div class="card ${[cc,wonClass,previewActive?'card-previewing':''].filter(Boolean).join(' ')}" id="card-${a.id}" style="position:relative;">${favBtn}${badge}${itemHeader}${timerSection}${bidSection}${bids.length||retractedBids.length?`<div class="hist" data-scroll-key="auction-history-${a.id}">${histItems}</div>`:''}${rlControls}</div>`;
}

function addToQueue(){
  if(itemCreatePending){toast('Item is already being added');return;}
  if(!selectedItem){toast('Please search and select an item first');return;}
  itemCreatePending=true;const createWrites=[];
  const qty=Math.max(1,Math.min(20,parseInt(document.getElementById('m-qty')?.value)||1));
  const dur=Math.max(10,parseInt(document.getElementById('m-timer')?.value)||raidSettings.defaultTimer);
  const btn1=queueRead('m-btn1',250);
  const btn2=queueRead('m-btn2',500);
  const btn3=queueRead('m-btn3',1000);
  const name=selectedItem.name;
  const startBid=queueRead('m-start',1000);
  const queuedCount=auctionList().filter(a=>a.status==='queued').length;
  for(let i=0;i<qty;i++){
    const nr=push(runRef('/auctions'));
    createWrites.push(set(nr,{id:nr.key,name,slot:selectedItem.slot||'',quality:modalQuality,itemId:selectedItem.id,itemIcon:selectedItem.icon||null,currentBid:startBid,startBid,minIncrement:btn1,duration:dur,bidButtons:[btn1,btn2,btn3],category:modalCategory||'Other',note:document.getElementById('m-note')?.value?.trim()||'',bids:{},status:'queued',order:queuedCount+i,remaining:dur,paused:false,endsAt:null}));
  }
  Promise.all(createWrites).catch(()=>toast('Could not add the item')).finally(()=>{itemCreatePending=false;});
  selectedItem=null;searchQuery='';
  const inp=document.getElementById('item-search-input');
  if(inp){inp.value='';inp.focus();}
  const wrap=document.getElementById('search-preview-wrap');if(wrap)wrap.innerHTML='';
  const dd=document.getElementById('item-dropdown');if(dd)dd.style.display='none';
  const qtyInp=document.getElementById('m-qty');if(qtyInp)qtyInp.value='1';
  const noteInp=document.getElementById('m-note');if(noteInp)noteInp.value='';
  modalQuality='epic';
  ['legendary','epic','rare','uncommon'].forEach(x=>{
    const b=document.getElementById('q-'+x);if(!b)return;
    const s=x==='epic'?Q_STYLES[x].on:Q_STYLES[x].off;
    b.setAttribute('style',s+"font-family:'Cinzel',serif;font-size:.65rem;letter-spacing:.06em;font-weight:"+(x==='epic'?'600':'400')+';');
  });
  toast(qty>1?`${qty}x ${name} added — search for next item or close`:`${name} added — search for next item or close`);
}

function setAutoBid(id){
  const a=auctions[id];if(!a||a.status!=='open')return;
  const cur=Object.values(a.bids||{}).filter(b=>!b.retracted).sort((x,y)=>y.amount-x.amount)[0]?.amount||a.currentBid||0;
  const min=cur+(a.minIncrement||250);
  wowConfirm({
    title:'Auto Bid',
    msg:`<strong style="color:#f5d060;">${a.name}</strong><br>Current: ${displayMoney(cur)} &nbsp;·&nbsp; Minimum: ${displayMoney(min)}<br><span style="color:var(--text-muted);font-size:.75rem;">Enter the limit in gold.</span>`,
    confirmLabel:'Set auto bid',
    danger:false,
    input:{placeholder:`e.g. ${(min*4).toLocaleString()} gold`,min,step:a.minIncrement||250,errorMsg:`Must be at least ${displayMoney(min)}`},
    onConfirm:(max)=>{
      autoBids[id]=max;
      toast(`Auto-bid set: up to ${displayMoney(max)}`);
      render();
    }
  });
}
function clearAutoBid(id){
  delete autoBids[id];
  toast('Auto-bid cleared');
  render();
}
const _startOneCooldown={};
function startAll(){
  const now=Date.now();
  auctionList().filter(a=>a.status==='queued').forEach(a=>{
    update(runRef(`/auctions/${a.id}`),{status:'open',paused:false,endsAt:now+a.duration*1000,remaining:a.duration});
  });
}
function startOne(id){
  if(_startOneCooldown[id])return;
  const a=auctions[id];if(!a||a.status!=='queued')return;
  _startOneCooldown[id]=true;
  setTimeout(()=>delete _startOneCooldown[id],2000);
  update(runRef(`/auctions/${id}`),{status:'open',paused:false,endsAt:Date.now()+a.duration*1000,remaining:a.duration});
  toast(a.name+' started!');
}
function cancelAll(){
  const live=auctionList().filter(a=>a.status==='open');
  if(!live.length)return;
  wowConfirm({
    title:'Cancel All Auctions?',
    msg:`Return all ${live.length} live auction${live.length!==1?'s':''} to the queue and clear their bids? This cannot be undone.`,
    confirmLabel:'Cancel All',
    danger:true,
    onConfirm:()=>{
      const updates={};
      live.forEach(a=>{
        updates[`auctions/${a.id}/status`]='queued';
        updates[`auctions/${a.id}/paused`]=false;
        updates[`auctions/${a.id}/endsAt`]=null;
        updates[`auctions/${a.id}/remaining`]=a.duration||120;
        updates[`auctions/${a.id}/bids`]={};
      });
      update(runRef(),updates);
      auditLog('cancel_all',{count:live.length,items:live.map(a=>a.name)});
      tab='queued';
      toast(`Cancelled ${live.length} auction${live.length!==1?'s':''} — returned to queue`);
    }
  });
}
function togglePauseAll(){
  const live=auctionList().filter(a=>a.status==='open');
  if(!live.length)return;
  const anyRunning=live.some(a=>!a.paused);
  const now=Date.now();
  const updates={};
  live.forEach(a=>{
    if(anyRunning){
      // Pause all running ones
      if(!a.paused){updates[`auctions/${a.id}/paused`]=true;updates[`auctions/${a.id}/remaining`]=Math.max(0,Math.floor((a.endsAt-now)/1000));}
    } else {
      // Resume all paused ones
      if(a.paused){updates[`auctions/${a.id}/paused`]=false;updates[`auctions/${a.id}/endsAt`]=now+(a.remaining||0)*1000;}
    }
  });
  if(Object.keys(updates).length){update(runRef(),updates);toast(anyRunning?'All auctions paused':'All auctions resumed');}
}
function togglePause(id){const a=auctions[id];if(!a||a.status!=='open')return;if(a.paused){update(runRef(`/auctions/${id}`),{paused:false,endsAt:Date.now()+(a.remaining||0)*1000});toast(a.name+' resumed');}else{update(runRef(`/auctions/${id}`),{paused:true,remaining:Math.max(0,Math.floor((a.endsAt-Date.now())/1000))});toast(a.name+' paused');}}
function extendTimer(id){const a=auctions[id];if(!a||a.status!=='open')return;if(a.paused){update(runRef(`/auctions/${id}`),{remaining:(a.remaining||0)+30});}else{update(runRef(`/auctions/${id}`),{endsAt:(a.endsAt||Date.now())+30000});}toast('+30s added to '+a.name);}

function coinExplosionAt(goldAmount, rect){
  const cx=rect ? rect.left+rect.width/2  : window.innerWidth/2;
  const cy=rect ? rect.top +rect.height/2 : window.innerHeight/2;

  let tiers=[];
  if(goldAmount>=100000)     tiers=[{n:6,s:320,d:1.4,fs:2.2},{n:14,s:420,d:1.8,fs:1.8},{n:22,s:560,d:2.2,fs:1.4},{n:32,s:700,d:2.6,fs:1.1}];
  else if(goldAmount>=50000) tiers=[{n:5,s:260,d:1.3,fs:2.0},{n:12,s:360,d:1.7,fs:1.6},{n:18,s:480,d:2.0,fs:1.2}];
  else if(goldAmount>=25000) tiers=[{n:4,s:200,d:1.2,fs:1.8},{n:10,s:300,d:1.6,fs:1.4},{n:14,s:400,d:1.9,fs:1.1}];
  else if(goldAmount>=10000) tiers=[{n:4,s:160,d:1.1,fs:1.6},{n:8,s:240,d:1.5,fs:1.2}];
  else                       tiers=[{n:5,s:120,d:1.0,fs:1.4}];

  const emojis=['🪙','🪙','🪙','💰','✨'];
  tiers.forEach((tier,ti)=>{
    setTimeout(()=>{
      for(let i=0;i<tier.n;i++){
        setTimeout(()=>{
          const el=document.createElement('span');
          el.className='coin-burst';
          const angle=Math.random()*Math.PI*2;
          const dist=tier.s*(0.6+Math.random()*0.7);
          const ex=Math.cos(angle)*dist;
          const ey=Math.sin(angle)*dist-dist*0.3;
          const rot=(Math.random()-0.5)*720;
          const scale=0.3+Math.random()*0.5;
          el.style.cssText=`left:${cx}px;top:${cy}px;font-size:${tier.fs}rem;`
            +`--cx:${ex}px;--cy:${ey}px;--cr:${rot}deg;--cs:${scale};--cd:${tier.d*(0.7+Math.random()*0.6)}s;`;
          el.textContent=emojis[Math.floor(Math.random()*emojis.length)];
          document.body.appendChild(el);
          setTimeout(()=>el.remove(),(tier.d*1.2)*1000);
        },i*40);
      }
    },ti*180);
  });
  playCoinSound();
}

function coinExplosion(auctionId, goldAmount, preRect){
  const card=document.getElementById('card-'+auctionId);
  const rect=card?card.getBoundingClientRect():preRect||null;
  coinExplosionAt(goldAmount, rect);
}

function openEditSold(id){

  const overlay=document.createElement('div');
  overlay.className='modal-overlay';
  overlay.id='sold-edit-overlay';
  overlay.innerHTML=`<div class="modal" onclick="event.stopPropagation()">
    <div class="modal-title">Edit Sold Item</div>
    <div class="fg"><div class="lbl">Winner</div><input type="text" id="se-winner" value="${Object.values(a.bids||{}).sort((x,y)=>y.amount-x.amount)[0]?.bidder||''}" placeholder="Character name" /></div>
    <div class="fg"><div class="lbl">Sale price (g)</div><input type="number" id="se-price" value="${a.currentBid||0}" min="0" step="100" /></div>
    <div class="fg"><div class="lbl">Note</div><input type="text" id="se-note" value="${a.note||''}" placeholder="Optional note..." /></div>
    <div class="modal-actions">
      <button class="btn btn-outline btn-sm" onclick="document.getElementById('sold-edit-overlay').remove()">Cancel</button>
      <button class="btn btn-gold btn-sm" onclick="saveSoldEdit('${id}')">Save</button>
    </div>
  </div>`;
  overlay.addEventListener('mousedown', e=>{ if(e.target===overlay) overlay.remove(); });
  document.body.appendChild(overlay);
}

function saveSoldEdit(id){
  const winner=document.getElementById('se-winner')?.value?.trim();
  const price=parseInt(document.getElementById('se-price')?.value)||0;
  const note=document.getElementById('se-note')?.value?.trim()||'';
  if(!winner){toast('Enter a winner name');return;}
  // Update currentBid and inject a corrected top bid
  const bidRef=push(runRef(`/auctions/${id}/bids`));
  set(bidRef,{bidder:winner,amount:price,ts:Date.now(),corrected:true});
  update(runRef(`/auctions/${id}`),{currentBid:price,note});
  document.getElementById('sold-edit-overlay')?.remove();
  toast('Sale updated');
}

function playCoinSound(immediate=false){

// Plays one cue when item(s) go live. count<=3 → the normal single bell.
// count>3 → a distinct ascending chime (a bulk Start All), played as one
// sequenced sound so it doesn't stack into a jarring blast.
function playGoLiveSound(count,immediate=false){
  if(soundMuted||!count)return;
  if(!immediate){clearTimeout(notificationSoundTimer);notificationSoundTimer=setTimeout(()=>playGoLiveSound(count,true),2000);return;}
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    if(count<=3){
      const t=ctx.currentTime;
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.type='sine';o.frequency.setValueAtTime(660,t);
      o.frequency.exponentialRampToValueAtTime(880,t+0.08);
      g.gain.setValueAtTime(0.06,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.6);
      o.start(t);o.stop(t+0.6);
    } else {
      const t0=ctx.currentTime;
      const notes=[523.25,659.25,783.99,1046.50];
      notes.forEach((f,i)=>{
        const last=i===notes.length-1;
        const o=ctx.createOscillator(),g=ctx.createGain();
        o.connect(g);g.connect(ctx.destination);
        o.type='triangle';
        const t=t0+i*0.09;
        o.frequency.setValueAtTime(f,t);
        g.gain.setValueAtTime(0.0001,t);
        g.gain.exponentialRampToValueAtTime(last?0.06:0.045,t+0.02);
        g.gain.exponentialRampToValueAtTime(0.0001,t+(last?0.5:0.18));
        o.start(t);o.stop(t+(last?0.55:0.22));
      });
    }
  }catch(e){}
}
function spawnCoin(e){
  // Spawn from the button/element that triggered the bid if available, else center of screen
  const x=e?.clientX??window.innerWidth/2;
  const y=e?.clientY??window.innerHeight*0.7;
  const coins=['🪙','🪙','💰'];
  for(let i=0;i<3;i++){
    setTimeout(()=>{
      const el=document.createElement('span');
      el.className='coin-particle';
      el.textContent=coins[i%coins.length];
      el.style.left=(x + (Math.random()-0.5)*40)+'px';
      el.style.top=y+'px';
      el.style.animationDelay=(i*60)+'ms';
      document.body.appendChild(el);
      setTimeout(()=>el.remove(),1100);
    },i*60);
  }
}

function handleSearchKeydown(e){

function handleDropdownItemKey(e,id){
  const dd=document.getElementById('item-dropdown');
  const items=dd?Array.from(dd.querySelectorAll('.dropdown-item')):[];
  const inp=document.getElementById('item-search-input');
  const idx=items.indexOf(e.currentTarget);
  if(e.key==='Enter'||e.key===' '){e.preventDefault();selectItem(id);_searchFocusIdx=-1;return;}
  if(e.key==='Escape'){if(dd)dd.style.display='none';_searchFocusIdx=-1;if(inp)inp.focus();return;}
  if(e.key==='Tab'&&!e.shiftKey){
    // last item — let Tab fall through naturally to next field after closing dropdown
    if(idx>=items.length-1){e.preventDefault();selectItem(id);_searchFocusIdx=-1;document.getElementById('m-start')?.focus();return;}
    e.preventDefault();_searchFocusIdx=idx+1;items[_searchFocusIdx].focus();return;

    e.preventDefault();

  }
  if(e.key==='ArrowDown'){e.preventDefault();_searchFocusIdx=(idx+1)%items.length;items[_searchFocusIdx].focus();return;}
  if(e.key==='ArrowUp'){e.preventDefault();_searchFocusIdx=(idx-1+items.length)%items.length;items[_searchFocusIdx].focus();return;}

  if(e.key.length===1){if(inp){inp.focus();inp.value+=e.key;onSearchInput(inp.value);}}
}

let chatCollapsed=true;

function chatRef(){ return ref(db, `runs/${runId}/chat`); }

function renderChatMessages(msgs){

  const wasAtBottom=box.scrollHeight-box.scrollTop-box.clientHeight<40;
  box.innerHTML=msgs.map(m=>{
    const mine=m.sender===user;
    const t=new Date(m.ts);
    const time=t.getHours().toString().padStart(2,'0')+':'+t.getMinutes().toString().padStart(2,'0');
    const avatarEl=m.avatar?`<img loading="lazy" decoding="async" class="chat-msg-avatar" src="${m.avatar}" />`:`<span style="width:16px;height:16px;border-radius:50%;background:var(--bg-input);display:inline-block;flex-shrink:0;"></span>`;
    const rlClass=m.senderIsRL?' rl':'';
    const delBtn=isRL?`<button class="chat-delete" onclick="deleteChat('${m.key}')">✕</button>`:'';
    return`<div class="chat-msg${mine?' mine':''}">
      ${delBtn}
      <div class="chat-msg-header">${avatarEl}<span class="chat-msg-name${rlClass}">${m.sender}${m.senderIsRL?' ★':''}</span><span class="chat-msg-time">${time}</span></div>
      <div class="chat-msg-text">${formatChatText(m.text)}</div>
    </div>`;
  }).join('');
  if(wasAtBottom) box.scrollTop=box.scrollHeight;
  // Unread badge
  if(chatCollapsed && msgs.length){
    chatUnread++;
    const badge=document.getElementById('chat-unread');
    if(badge){badge.textContent=chatUnread>9?'9+':chatUnread;badge.style.display='flex';}
  }

// ── DM System ─────────────────────────────────────────────────────────────
let activeChatTab='raid';
let openDMs=[];
let dmSubs={};
let dmUnread={};

function dmKey(a,b){ return [a,b].sort().join('__'); }
function dmRef(partner){ return ref(db,`dms/${dmKey(user,partner)}`); }

function openDM(partner){
  if(partner===user) return;
  if(!openDMs.includes(partner)) openDMs.push(partner);
  activeChatTab=partner;
  if(chatCollapsed) toggleChat();
  dmUnread[partner]=0;
  renderChatTabs();
  updateChatHeader();
  subscribeToDM(partner);
  get(dmRef(partner)).then(snap=>{
    const msgs=Object.entries(snap.val()||{}).map(([k,v])=>({key:k,...v})).sort((a,b)=>a.ts-b.ts).slice(-100);
    renderChatMessages(msgs);
  });
}

function subscribeToDM(partner){
  if(dmSubs[partner]) return;
  dmSubs[partner]=onValue(dmRef(partner), snap=>{
    const msgs=Object.entries(snap.val()||{}).map(([k,v])=>({key:k,...v})).sort((a,b)=>a.ts-b.ts).slice(-100);
    if(activeChatTab===partner){ renderChatMessages(msgs); }
    else{ dmUnread[partner]=(dmUnread[partner]||0)+1; renderChatTabs(); updateChatUnread(); }
  });
}

function closeDM(partner,e){
  if(e) e.stopPropagation();
  openDMs=openDMs.filter(d=>d!==partner);
  if(dmSubs[partner]){ dmSubs[partner](); delete dmSubs[partner]; }
  delete dmUnread[partner];
  if(activeChatTab===partner){ activeChatTab='raid'; updateChatHeader(); }
  renderChatTabs();
}

function switchChatTab(tab){
  activeChatTab=tab;
  if(tab==='raid'){
    chatUnread=0;
    subscribeToChat();
  } else {
    dmUnread[tab]=0;
    subscribeToDM(tab);
    get(dmRef(tab)).then(snap=>{
      const msgs=Object.entries(snap.val()||{}).map(([k,v])=>({key:k,...v})).sort((a,b)=>a.ts-b.ts).slice(-100);
      renderChatMessages(msgs);
    });

function restoreArchivedRun(archiveKey){
  wowConfirm({
    title:'Start From This Run?',
    msg:'Copy the sold items, bids, and winners into the current run. Existing current-run data stays in place and exact item matches are skipped.',
    confirmLabel:'Start From Copy',
    onConfirm:async()=>{
      try{
        const snap=await get(ref(db,`runs/${archiveKey}`));
        const archiveRun=snap.val();
        if(!archiveRun){toast('Archived run not found');return;}
        const archiveAuctions=archiveRun.auctions||{};
        const soldItems=Object.entries(archiveAuctions).filter(([,a])=>a&&a.status==='sold'&&a.name);
        if(!soldItems.length){toast('No sold items to restore');return;}
        const existingCounts={};
        auctionList().filter(a=>a.status==='sold').forEach(a=>{const sig=settlementAuctionSignature(a);existingCounts[sig]=(existingCounts[sig]||0)+1;});
        const toRestore=[];
        soldItems.forEach(([archiveAuctionId,a])=>{const sig=settlementAuctionSignature(a);if(existingCounts[sig]>0){existingCounts[sig]--;return;}toRestore.push([archiveAuctionId,a]);});
        if(!toRestore.length){toast('This run is already restored');closePanel();setTab('settlement');return;}
        // Write each sold item into the current run preserving all data
        const writes=toRestore.map(([archiveAuctionId,a])=>{
          const nr=push(runRef('/auctions'));
          const item={
            id:nr.key,
            name:a.name,
            slot:a.slot||'',
            quality:a.quality||'epic',
            itemId:a.itemId||null,
            itemIcon:a.itemIcon||null,
            currentBid:a.currentBid||0,
            startBid:a.startBid||0,
            minIncrement:a.minIncrement||250,
            duration:a.duration||120,
            bidButtons:a.bidButtons||[250,500,1000],
            category:a.category||'Other',
            note:a.note||'',
            status:'sold',
            paid:a.paid||false,
            paused:false,
            endsAt:null,
            remaining:0,
            order:a.order??0,
            sourceArchiveKey:archiveKey,
            sourceAuctionId:archiveAuctionId,
          };
          // Restore bids if present
          if(a.bids&&Object.keys(a.bids).length) item.bids=a.bids;
          return set(nr,item);
        });
        // Also restore settings/title if current run has none
        const titleSnap=await get(runRef('/settings/raidTitle'));
        if(!titleSnap.val()&&archiveRun.settings?.raidTitle){
          await update(runRef('/settings'),{raidTitle:archiveRun.settings.raidTitle});
        }
        await Promise.all(writes);
        const skipped=soldItems.length-toRestore.length;
        toast(`${toRestore.length} item${toRestore.length===1?'':'s'} restored${skipped?`; ${skipped} duplicate${skipped===1?'':'s'} skipped`:''}`);
        closePanel();
        setTab('settlement');
      }catch(e){
        console.error('restoreArchivedRun error:',e);
        toast('Failed to restore: '+e.message);
      }
    }
  });
}

async function deleteRun(runKey){
  if(!isRL) return;
  // Store for undo
  const snap=await get(ref(db,`runs/${runKey}`));
  _pendingDeleteRun={key:runKey, data:snap.val()};
  // Remove immediately
  await remove(ref(db,`runs/${runKey}`));
  crossRunCache=null;
  renderPastRunsPanel();
  // Show undo toast
  clearTimeout(_deleteUndoTimer);
  const el=document.getElementById('toast');
  if(el){
    el.innerHTML=`Run deleted. <button onclick="undoDeleteRun()" style="background:none;border:1px solid var(--gold);color:var(--gold);cursor:var(--gs-action-cursor,pointer);font-family:'Cinzel',serif;font-size:.7rem;padding:.1rem .4rem;border-radius:3px;margin-left:.5rem;">Undo</button>`;

    el.classList.add('show');

    if(el){el.classList.remove('show');el.style.pointerEvents='';el.textContent='';}

}

function rtAuditTime(value){
 const date=new Date(value);if(!Number.isFinite(date.getTime()))return 'Time unavailable';

 return `${parts.month}/${parts.day}/${parts.year} ${parts.hour}:${parts.minute}`;
}
function rtAuditMessage(entry){

 return settlementEsc(msg||'Audit event');
}

// ── Cross-run stats ────────────────────────────────────────────────────────
async function fetchCrossRunStats(forceRefresh){
  if(crossRunCache&&!forceRefresh) return crossRunCache;
  if(crossRunFetching) return crossRunCache;
  crossRunFetching=true;
  try{
    const snap=await get(ref(db,'runs'));
    const runs=snap.val()||{};
    const stats={};
    Object.entries(runs).forEach(([runKey,run])=>{
      const seenThisRun=new Set();
      const includeMember=(name,identity={})=>{
        name=String(name||'').trim();if(!name)return null;
        if(!stats[name])stats[name]={totalSpent:0,itemsWon:0,items:[],runs:new Set(),lastSeen:0};
        const member=stats[name];
        if(identity.discordId)member.discordId=String(identity.discordId);
        if(identity.discordName)member.discordName=String(identity.discordName);
        if(identity.displayName)member.displayName=String(identity.displayName);
        if(!seenThisRun.has(name)){stats[name].runs.add(runKey);seenThisRun.add(name);}
        stats[name].lastSeen=Math.max(stats[name].lastSeen||0,run.createdAt||run.archivedAt||0);
        return stats[name];
      };
      Object.values(run.attendance||{}).filter(a=>a?.approved&&a.character).forEach(a=>includeMember(a.character,{discordId:a.discordId,discordName:a.discordName,displayName:a.personName}));
      Object.values(run.settlement?.raiders||{}).forEach(r=>includeMember(r?.name,{discordId:r?.submission?.discordId,discordName:r?.submission?.discordName}));
      Object.values(run.auctions||{}).filter(a=>a.status==='sold').forEach(a=>{
        const bids=Object.values(a.bids||{}).filter(b=>!b.retracted).sort((x,y)=>y.amount-x.amount);
        if(!bids[0])return;
        const winner=bids[0].bidder;
        const member=includeMember(winner,{discordId:bids[0].discordId});if(!member)return;
        member.totalSpent+=(a.currentBid||0);
        member.itemsWon++;
        member.items.push({name:a.name,price:a.currentBid,quality:a.quality||'common',itemId:a.itemId||null,runTitle:run.settings?.raidTitle||'',runAt:run.createdAt||0});
      });
    });
    // Convert Set to count
    Object.values(stats).forEach(s=>{ s.runCount=s.runs.size; delete s.runs; });
    crossRunCache=stats;
    return stats;
  }catch(e){return crossRunCache||null;}
  finally{crossRunFetching=false;}
}

function _scheduleHideTip(){
  _tipActive=false;

    if(_tipActive) return;

function dragStart(e,id,mode){

function dragOver(e){
  e.preventDefault();
  e.dataTransfer.dropEffect='move';
  const target=e.currentTarget;
  if(!target||target===_dragEl)return;
  // Decide whether to insert before or after based on cursor position
  const rect=target.getBoundingClientRect();
  const horizontal=rect.width>rect.height; // grid rows are horizontal
  const before=horizontal
    ? (e.clientX < rect.left+rect.width/2)
    : (e.clientY < rect.top+rect.height/2);
  // Clear other indicators
  document.querySelectorAll('.drop-before,.drop-after').forEach(el=>{
    if(el!==target)el.classList.remove('drop-before','drop-after');
  });
  target.classList.toggle('drop-before',before);
  target.classList.toggle('drop-after',!before);
  const parent=target.parentElement;
  if(parent&&_dragEl&&parent===_dragEl.parentElement){
    if(before)parent.insertBefore(_dragEl,target);

    broadcastCardDragPreview(fullDragIds());
  }

(function(){
  let tx=0, ty=0;
  document.addEventListener('touchstart', e=>{
    tx=e.touches[0].clientX;
    ty=e.touches[0].clientY;
  }, {passive:true});

  document.addEventListener('touchend', e=>{
    const dx=e.changedTouches[0].clientX - tx;
    const dy=e.changedTouches[0].clientY - ty;
    const adx=Math.abs(dx), ady=Math.abs(dy);

    // Horizontal swipes
    if(adx > ady && adx >= 40){
      if(dx < 0 && !sidebarCollapsed) toggleMembersSidebar();
      if(dx > 0 && tx < 30 && sidebarCollapsed) toggleMembersSidebar();
      if(dx < 0 && tx > window.innerWidth - 30 && !panelOpen) togglePanel();
      if(dx > 0 && panelOpen) togglePanel();
    }

    // Vertical swipes — chat box
    if(ady > adx && ady >= 40){
      const chatBox=document.getElementById('chat-box');
      const nearBottom=ty > window.innerHeight - 120;
      if(dy > 0 && !chatCollapsed && chatBox && chatBox.contains(e.target)) toggleChat();
      if(dy < 0 && chatCollapsed && nearBottom) toggleChat();
    }
  }, {passive:true});
})();

    _tdrag={x:e.clientX-r.left,y:e.clientY-r.top};
    e.preventDefault();
  });
  document.addEventListener('mousemove',e=>{
    if(_tresize){
      const t=document.getElementById('loot-tracker');if(!t)return;
      const newW=Math.max(140,Math.min(320,_tresize.startW+(e.clientX-_tresize.startX)));
      t.style.width=newW+'px';return;
    }
    if(!_tdrag)return;
    const t=document.getElementById('loot-tracker');if(!t)return;
    t.style.left=Math.max(0,Math.min(window.innerWidth-t.offsetWidth,e.clientX-_tdrag.x))+'px';
    t.style.top=Math.max(40,Math.min(window.innerHeight-80,e.clientY-_tdrag.y))+'px';
  });
  document.addEventListener('mouseup',()=>{_tdrag=null;_tresize=null;});
}
// Wheel gestures scroll the form; number edits require typing or arrow keys.
document.addEventListener('wheel',e=>{
 const input=e.target.closest?.('input[type="number"]');if(!input||e.ctrlKey)return;
 e.preventDefault();
 const scale=e.deltaMode===1?16:e.deltaMode===2?window.innerHeight:1;
 const dy=e.deltaY*scale,dx=e.deltaX*scale;
 for(let node=input.parentElement;node;node=node.parentElement){
  const style=getComputedStyle(node);
  const canY=/(auto|scroll)/.test(style.overflowY)&&node.scrollHeight>node.clientHeight;
  const canX=/(auto|scroll)/.test(style.overflowX)&&node.scrollWidth>node.clientWidth;
  if((canY&&((dy<0&&node.scrollTop>0)||(dy>0&&node.scrollTop<node.scrollHeight-node.clientHeight)))||
     (canX&&((dx<0&&node.scrollLeft>0)||(dx>0&&node.scrollLeft<node.scrollWidth-node.clientWidth)))){
   node.scrollBy({top:canY?dy:0,left:canX?dx:0,behavior:'instant'});return;
  }
  if(node.classList.contains('queue-panel')||(canY&&/(contain|none)/.test(style.overscrollBehaviorY)))return;
 }
 window.scrollBy({top:dy,left:dx,behavior:'instant'});
},{passive:false});
</script>
</body>
