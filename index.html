let _onlineTooltipHideT=null;
const qualityColor={poor:'#9d9d9d',common:'#ffffff',uncommon:'#1eff00',rare:'#0070dd',epic:'#a335ee',legendary:'#ff8000'};
function _itemLink(a){
  const c=qualityColor[a.quality||'common']||'#ffffff';
  const href=a.itemId?`https://www.wowhead.com/tbc/item=${a.itemId}`:'#';
  const price=(a.currentBid||a.price||0).toLocaleString();
  return`<span style="display:flex;align-items:baseline;gap:.35rem;"><a href="${href}" target="_blank" rel="noopener" data-wowhead="item=${a.itemId}&domain=tbc" style="color:${c};font-size:.7rem;font-family:'Cinzel',serif;text-decoration:none;white-space:nowrap;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;" onmouseover="this.style.textDecoration='underline'" onmouseout="this.style.textDecoration='none'">${a.name}</a><span style="color:var(--gold);font-size:.68rem;white-space:nowrap;flex-shrink:0;">${price}g</span></span>`;
}
function showOnlineTooltip(e){
  clearTimeout(_onlineTooltipHideT);
  if(document.querySelector('.online-tooltip')){clearTimeout(_onlineTooltipHideT);return;}
  // Dedup case-insensitively
  const byName={};
  Object.values(presenceData||{}).forEach(m=>{
    const k=(m.name||'').toLowerCase();
    if(!byName[k]||m.lastSeen>byName[k].lastSeen) byName[k]=m;
  });
  const members=Object.values(byName).filter(m=>m.name).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  if(!members.length)return;
  const tip=document.createElement('div');
  tip.className='online-tooltip member-tooltip';
  // Anchor to counter element position
  const anchor=document.getElementById('hdr-online');
  const rect=anchor?anchor.getBoundingClientRect():{left:10,bottom:30};
  const GAP=6;
  const maxTop=window.innerHeight*0.05;
  const tipTop=Math.min(rect.bottom+GAP, maxTop);
  tip.style.cssText=`position:fixed;left:${rect.left}px;top:${tipTop}px;`;
  tip.addEventListener('mouseenter',()=>clearTimeout(_onlineTooltipHideT),true);
  tip.addEventListener('mouseleave',(ev)=>{
    if(!tip.contains(ev.relatedTarget)&&!ev.relatedTarget?.closest('#hdr-online')){
      _onlineTooltipHideT=setTimeout(()=>tip.remove(),200);
    }
  },true);
  // Bridge div
  const bridge=document.createElement('div');
  bridge.style.cssText=`position:fixed;left:${rect.left}px;top:${rect.bottom}px;width:${tip.offsetWidth||290}px;height:${GAP+4}px;z-index:999;`;
  bridge.onmouseenter=()=>clearTimeout(_onlineTooltipHideT);
  bridge.onmouseleave=(ev)=>{if(!tip.contains(ev.relatedTarget)&&!anchor.contains(ev.relatedTarget)){_onlineTooltipHideT=setTimeout(()=>{tip.remove();bridge.remove();},200);}};
  document.body.appendChild(bridge);
  const origRemove=tip.remove.bind(tip);
  tip.remove=()=>{bridge.remove();origRemove();};

  function renderTip(hist){
    const sold=auctionList().filter(a=>a.status==='sold');
    tip.innerHTML=`<div style="font-family:'Cinzel',serif;font-size:.68rem;color:var(--text-muted);letter-spacing:.1em;margin-bottom:.6rem;">ONLINE NOW</div>`
      +members.map(m=>{
        const curItems=sold.filter(a=>Object.values(a.bids||{}).sort((x,y)=>y.amount-x.amount)[0]?.bidder===m.name)
                          .sort((a,b)=>(b.currentBid||0)-(a.currentBid||0));
        const curSpend=curItems.reduce((s,a)=>s+(a.currentBid||0),0);
        const h=hist?.[m.name];
        const histSpend=h?.totalSpent||0;
        const histItems=h?.itemsWon||0;
        const allTimeItems=(h?.items||[]).sort((a,b)=>(b.price||0)-(a.price||0)).slice(0,5);
        const hasThisRun=curSpend>0;
        const hasHistory=histItems>0;
        return`<div style="padding:.4rem .35rem;border-radius:3px;border-bottom:1px solid rgba(201,168,76,0.07);margin-bottom:.1rem;" onmouseenter="this.style.background='rgba(212,169,60,0.06)'" onmouseleave="this.style.background=''">
          <div style="display:flex;align-items:center;gap:.5rem;">
            <span style="width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 4px var(--green);flex-shrink:0;"></span>
            <span style="font-family:'Cinzel',serif;font-size:.82rem;color:var(--text-bright);flex:1;">${m.name}${m.isRL?' <span style="color:var(--gold);font-size:.62rem;">★</span>':''}</span>
            ${hasThisRun?`<span style="font-family:'Cinzel',serif;font-size:.72rem;color:var(--gold);font-weight:600;">${curSpend.toLocaleString()}g</span>`:''}
          </div>
          ${hasThisRun?`<div style="display:flex;flex-direction:column;gap:.12rem;padding-left:1.2rem;margin-top:.25rem;border-left:2px solid rgba(201,168,76,0.2);margin-left:.35rem;">
            ${curItems.map(a=>`<div>${_itemLink(a)}</div>`).join('')}
          </div>`:''}
          ${hasHistory?`<div style="padding-left:1.2rem;margin-top:${hasThisRun?'.3rem':'.2rem'};font-size:.68rem;color:var(--text-muted);">
            <span style="color:var(--gold);font-weight:600;">${histSpend.toLocaleString()}g</span> · ${histItems} item${histItems!==1?'s':''}
            ${allTimeItems.length>0&&!hasThisRun?`<div style="display:flex;flex-direction:column;gap:.1rem;margin-top:.2rem;border-left:2px solid rgba(201,168,76,0.12);padding-left:.5rem;">
              ${allTimeItems.map(a=>`<div>${_itemLink(a)}</div>`).join('')}
            </div>`:''}
          </div>`:''}
        </div>`;
      }).join('');
    if(window.$WowheadPower) window.$WowheadPower.refreshLinks();
  }

  renderTip(crossRunCache);
  document.body.appendChild(tip);
  requestAnimationFrame(()=>{
    const w=tip.offsetWidth+'px';
    bridge.style.width=w;
    const hdrOnline=document.getElementById('hdr-online');
    if(hdrOnline) hdrOnline.style.width=w;
  });
  if(!crossRunCache){
    fetchCrossRunStats().then(hist=>{if(document.body.contains(tip))renderTip(hist);});
  }
}

  const tip=document.querySelector('.online-tooltip');
  if(tip&&ev&&tip.contains(ev.relatedTarget)) return;
  _onlineTooltipHideT=setTimeout(()=>document.querySelectorAll('.online-tooltip').forEach(t=>t.remove()),200);
}

    <div class="tab ${tab==='active'?'active':''}" tabindex="0" onclick="setTab('active')" onkeydown="if(event.key==='Enter'||event.key===' ')setTab('active')">Live (${active.length})</div>
    <div class="tab ${tab==='queued'?'active':''}" tabindex="0" onclick="setTab('queued')" onkeydown="if(event.key==='Enter'||event.key===' ')setTab('queued')">Queue (${queued.length})</div>
    <div class="tab ${tab==='sold'?'active':''}" tabindex="0" onclick="setTab('sold')" onkeydown="if(event.key==='Enter'||event.key===' ')setTab('sold')">Sold (${sold.length})${isRL&&sold.filter(a=>!a.paid).length?`<span onclick="event.stopPropagation();showUnpaidOverlay()" style="margin-left:.4rem;background:rgba(226,96,96,0.85);color:#fff;font-size:.6rem;font-family:'Cinzel',serif;padding:.1rem .35rem;border-radius:3px;cursor:pointer;vertical-align:middle;">${sold.filter(a=>!a.paid).length} owed</span>`:''}</div>
    ${expired.length||isRL?`<div class="tab ${tab==='expired'?'active':''}" tabindex="0" onclick="setTab('expired')" onkeydown="if(event.key==='Enter'||event.key===' ')setTab('expired')" style="${expired.length?'color:var(--red);':''}">Expired (${expired.length})</div>`:''}
    ${isRL?`<div class="tab ${tab==='splits'?'active':''}" tabindex="0" onclick="setTab('splits')" onkeydown="if(event.key==='Enter'||event.key===' ')setTab('splits')">Splits</div>`:''}
  </div>`;

  let secActions='';
  if(isRL&&tab!=='splits'){
    if(tab==='active'){const _live=active.filter(a=>a.status==='open');const _anyRunning=_live.some(a=>!a.paused);const _bs='font-weight:600;font-size:.8rem;width:100%;text-align:center;white-space:nowrap;';const _pauseAllBtn=_live.length?`<button class="btn ${_anyRunning?'btn-amber':'btn-amber-resume'} btn-sm" style="${_bs}" onclick="togglePauseAll()">${_anyRunning?'&#10073;&#10073; Pause All':'&#9654; Resume All'}</button>`:'';const _cancelAllBtn=_live.length?`<button class="btn btn-danger btn-sm" style="${_bs}" onclick="cancelAll()">Cancel All</button>`:'';const _closeAllBtn=_live.length?`<button class="btn btn-sm" style="${_bs}background:#0d2e14;color:#6aff8a;border:2px solid #2ecc52;" onclick="closeAll()">Close All</button>`:'';secActions=_live.length?`<div style="display:grid;grid-template-columns:1fr 1fr;gap:.4rem;width:100%;max-width:300px;">${_pauseAllBtn}${_cancelAllBtn}${_closeAllBtn}<button class="btn btn-gold btn-sm" style="${_bs}" onclick="openModal()">+ Add Item</button></div>`:`<div class="rl-controls"><button class="btn btn-gold btn-sm" style="font-weight:600;padding:.5rem 1.2rem;font-size:.8rem;" onclick="openModal()">+ Add Item</button></div>`;}
    else if(tab==='queued') secActions=`<div class="rl-controls">${queued.length?`<button class="btn btn-green btn-sm" style="font-weight:600;padding:.5rem 1.2rem;font-size:.8rem;" onclick="startAll()">&#9654; Start All</button>`:''}<button class="btn btn-gold btn-sm" style="font-weight:600;padding:.5rem 1.2rem;font-size:.8rem;" onclick="openModal()">+ Add Item</button></div>`;
    else if(tab==='sold') secActions=`<div class="rl-controls"><button class="btn btn-gold btn-sm" style="font-weight:600;padding:.5rem 1.2rem;font-size:.8rem;" onclick="openModal()">+ Add Item</button></div>`;
    else if(tab==='expired') secActions=`<div class="rl-controls"><button class="btn btn-gold btn-sm" style="font-weight:600;padding:.5rem 1.2rem;font-size:.8rem;" onclick="openModal()">+ Add Item</button></div>`;
  }

  let content='';
  if(tab==='splits'&&isRL){content=renderSplits();}
  else if(tab==='active'){
    // My Bids filter
    let liveList=active;
    if(myBidsOnly) liveList=active.filter(a=>Object.values(a.bids||{}).some(b=>!b.retracted&&b.bidder===user));
    else if(liveCatFilter!=='all') liveList=active.filter(a=>(a.category||'Other')===liveCatFilter);
    const liveBar=renderLiveFilterBar(active);
    content=liveBar+renderGrid(liveList,'open');
  }
  else if(tab==='queued'){
    const filtered=activeCategory==='all'?queued:queued.filter(a=>(a.category||'Other')===activeCategory);
    content=renderCategoryFilterBar(queued)+renderGrid(filtered,'queued');
  }
  else if(tab==='expired') content=renderGrid(expired,'expired');
  else{
    // My Items filter for sold tab
    let soldList=sold;
    if(myItemsOnly) soldList=sold.filter(a=>Object.values(a.bids||{}).filter(b=>!b.retracted).sort((x,y)=>y.amount-x.amount)[0]?.bidder===user);
    const soldBar=renderSoldFilterBar(sold);
    content=soldBar+renderGrid(soldList,'sold');
  }

  const mHTML=modal?(editId?buildModal('Edit Item',auctions[editId],'saveEdit'):buildModal('Add Item to Queue',null,'addToQueue')):'';

  document.getElementById('main').innerHTML=`
    ${membersBar}${potBar}${myLootHTML}${settingsBar}${tabs}
    ${tab!=='splits'?`<div class="sec-hdr"><div style="flex:1;"></div><div class="sec-title">${tab==='active'?'Live Auctions':tab==='queued'?'Auction Queue':tab==='expired'?'Expired (No Bids)':'Sold Items'}</div><div style="flex:1;display:flex;justify-content:flex-end;">${secActions?secActions.replace('<div class="rl-controls">','<div class="rl-controls" style="justify-content:flex-end;">'):''}</div></div>`:''}
    <div id="auction-grid-bg">${content}</div>${mHTML}`;

  refreshWowheadLinks();
  setTimeout(retryMissingIcons,800);setTimeout(retryMissingIcons,2000);
  renderLootTracker();
  // Restore archive display if it was open when tab was closed/reloaded
  if(!window._archiveRestored){
    window._archiveRestored=true;
    const _archiveKey=localStorage.getItem('gdkp_archive_display');
    if(_archiveKey&&!lootDisplayMode){
      setTimeout(()=>{if(!document.getElementById('loot-display-overlay'))startLootDisplayFromArchive(_archiveKey);},600);
    }
  }
}

function updateSettings(){
  raidSettings.defaultTimer=Math.max(10,parseInt(document.getElementById('s-timer')?.value)||120);
  raidSettings.defaultIncrement=Math.max(1,parseInt(document.getElementById('s-inc')?.value)||100);
  update(runRef('/settings'),raidSettings);
}

function saveCategories(){
  const raw=document.getElementById('cat-settings-inp')?.value||'';
  const cats=raw.split(',').map(s=>s.trim()).filter(Boolean);
  if(!cats.length)return;
  raidCategories=[...cats];
  update(runRef('/settings'),{categories:cats});
  toast('Categories saved');
  render();
}

// ── Splits ────────────────────────────────────────────────────────────────
function renderSplits(){
  const p=pot();
  const adminAmt=Math.floor(p*(splits.adminCut/100));
  const distributable=p-adminAmt;
  const totalPct=splits.roles.reduce((s,r)=>s+r.slots.reduce((ss,sl)=>ss+(parseFloat(sl.pct)||0),0),0);
  const sanityOk=Math.abs(totalPct-100)<0.01;

  const roleSections=splits.roles.map((role,ri)=>{
    const rolePct=role.slots.reduce((s,sl)=>s+(parseFloat(sl.pct)||0),0);
    const rolePayout=Math.floor(distributable*(rolePct/100));
    const rows=role.slots.map((sl,si)=>{
      const payout=Math.floor(distributable*((parseFloat(sl.pct)||0)/100));
      return`<tr>
        <td><input type="text" value="${sl.label}" oninput="updateSlot(${ri},${si},'label',this.value)" style="width:80px;" /></td>
        <td><input type="text" value="${sl.player}" oninput="updateSlot(${ri},${si},'player',this.value)" placeholder="Name..." /></td>
        <td><input type="number" value="${sl.pct}" step="0.25" min="0" oninput="updateSlot(${ri},${si},'pct',this.value)" style="width:65px;" /></td>
        <td><div class="payout-cell">${payout.toLocaleString()}g</div></td>
        <td><input type="text" value="${sl.note}" oninput="updateSlot(${ri},${si},'note',this.value)" placeholder="Note..." /></td>
        <td><button class="remove-slot-btn" onclick="removeSlot(${ri},${si})">&#x2715;</button></td>
      </tr>`;
    }).join('');
    return`<div class="role-section">
      <div class="role-hdr">
        <div class="role-title">${role.name}</div>
        <div class="role-summary">${rolePct.toFixed(2)}% &nbsp;|&nbsp; ${rolePayout.toLocaleString()}g</div>
      </div>
      <table class="splits-table">
        <thead><tr><th>Slot</th><th>Name</th><th>%</th><th>Payout</th><th>Note</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <button class="add-slot-btn" onclick="addSlot(${ri})">+ Add Slot</button>
    </div>`;
  }).join('');

  return`<div class="splits-wrap">
    <div class="admin-cut-bar">
      <div style="font-family:'Cinzel',serif;font-size:.65rem;color:var(--text-muted);letter-spacing:.1em;">Admin Cut</div>
      <div class="fg" style="flex-direction:row;align-items:center;gap:.5rem;">
        <input type="number" id="admin-cut-inp" value="${splits.adminCut}" min="0" max="99" step="1" style="width:70px;" oninput="updateAdminCut(this.value)" />
        <span style="font-size:.85rem;color:var(--text-muted);">%</span>
      </div>
      <div style="font-family:'Cinzel',serif;font-size:.85rem;color:var(--gold);">${adminAmt.toLocaleString()}g admin</div>
      <div style="font-family:'Cinzel',serif;font-size:.85rem;color:var(--gold-light);">${distributable.toLocaleString()}g to raiders</div>
      <div style="margin-left:auto;">${sanityOk?`<span class="sanity-ok">&#10003; 100%</span>`:`<span class="sanity-warn">&#9888; ${totalPct.toFixed(2)}% (should be 100%)</span>`}</div>
      <button class="btn btn-outline btn-sm" onclick="saveSplits()">Save</button>
    </div>
    <div class="admin-cut-bar" style="gap:.75rem;">
      <div style="font-family:'Cinzel',serif;font-size:.65rem;color:var(--text-muted);letter-spacing:.1em;white-space:nowrap;">Loot categories</div>
      <input type="text" id="cat-settings-inp" value="${raidCategories.join(', ')}" placeholder="Tier, Physical, Caster/Healer" style="flex:1;" />
      <button class="btn btn-outline btn-sm" onclick="saveCategories()">Save</button>
    </div>
    <div class="splits-summary">
      <div class="splits-stat"><div class="splits-stat-lbl">Total Pot</div><div class="splits-stat-val">${p.toLocaleString()}g</div></div>
      <div class="splits-stat"><div class="splits-stat-lbl">Admin (${splits.adminCut}%)</div><div class="splits-stat-val">${adminAmt.toLocaleString()}g</div></div>
      <div class="splits-stat"><div class="splits-stat-lbl">To Raiders</div><div class="splits-stat-val">${distributable.toLocaleString()}g</div></div>
      <div class="splits-stat"><div class="splits-stat-lbl">Sanity</div><div class="splits-stat-val ${sanityOk?'ok':'warn'}">${totalPct.toFixed(2)}%</div></div>
    </div>
    ${roleSections}
  </div>`;
}

function updateSlot(ri,si,field,val){
  splits.roles[ri].slots[si][field]=field==='pct'?parseFloat(val)||0:val;
  // Re-render splits only
  const wrap=document.querySelector('.splits-wrap');
  if(wrap){wrap.outerHTML=renderSplits();}
  // Actually re-render inline
  renderMain();
}

function updateAdminCut(val){splits.adminCut=Math.max(0,Math.min(99,parseFloat(val)||0));renderMain();}
function addSlot(ri){splits.roles[ri].slots.push({label:'New',player:'',pct:1,note:''});renderMain();}
function removeSlot(ri,si){splits.roles[ri].slots.splice(si,1);renderMain();}
function saveSplits(){update(runRef('/splits'),splits);toast('Splits saved');}

// ── Side Panel ────────────────────────────────────────────────────────────
function setPanelTab(t){
  panelTab=t;
  const rb=document.getElementById('panel-tab-raiders');
  const ab=document.getElementById('panel-tab-audit');
  const xb=document.getElementById('panel-tab-runs');
  if(rb)rb.className='btn '+(t==='raiders'?'btn-gold':'btn-outline')+' btn-sm';
  if(ab)ab.className='btn '+(t==='audit'?'btn-gold':'btn-outline')+' btn-sm';
  if(xb)xb.className='btn '+(t==='runs'?'btn-gold':'btn-outline')+' btn-sm';
  if(t==='raiders')renderPanel();
  else if(t==='audit')renderAuditPanel();
  else if(t==='runs')renderPastRunsPanel();
}

let _panelHoverT=null;
function openPanel(){
  if(panelOpen)return;
  panelOpen=true;
  const panel=document.getElementById('side-panel');
  if(panel)panel.classList.add('open');
  if(panelTab==='raiders')renderPanel();
  else if(panelTab==='audit')renderAuditPanel();
  else renderPastRunsPanel();
}
function closePanel(){
  panelOpen=false;
  const panel=document.getElementById('side-panel');
  if(panel)panel.classList.remove('open');
}
function togglePanel(){panelOpen?closePanel():openPanel();}

// Set up hover zone after DOM ready
function initPanelHover(){
  const zone=document.getElementById('panel-hover-zone');
  const panel=document.getElementById('side-panel');
  if(!zone||!panel)return;
  const doOpen=()=>{clearTimeout(_panelHoverT);_panelHoverT=setTimeout(openPanel,120);};
  const doClose=()=>{_panelHoverT=setTimeout(()=>{if(!document.hidden)closePanel();},400);};
  zone.addEventListener('mouseenter',doOpen);
  zone.addEventListener('mouseleave',()=>clearTimeout(_panelHoverT));
  panel.addEventListener('mouseenter',()=>clearTimeout(_panelHoverT));
  panel.addEventListener('mouseleave',doClose);
}

function renderPanel(){
  const body=document.getElementById('side-panel-body');if(!body)return;
  const lootMap=getAllRaiderLoot();
  const raiders=Object.keys(lootMap).sort((a,b)=>{
    const totalA=lootMap[a].reduce((s,i)=>s+i.price,0);
    const totalB=lootMap[b].reduce((s,i)=>s+i.price,0);
    return totalB-totalA;
  });
  if(!raiders.length){body.innerHTML='<div style="color:var(--text-muted);font-size:.85rem;text-align:center;padding:2rem 0;">No items sold yet</div>';return;}
  // Unpaid summary
  const unpaidRaiders=raiders.filter(n=>lootMap[n].some(i=>!i.paid));
  const unpaidBanner=unpaidRaiders.length?`<div style="background:rgba(226,96,96,0.1);border:1px solid rgba(226,96,96,0.3);border-radius:3px;padding:.5rem .75rem;margin-bottom:.75rem;font-size:.78rem;font-family:'Cinzel',serif;">
    <span style="color:var(--red);">&#9888; Unpaid:</span> <span style="color:var(--text-bright);">${unpaidRaiders.join(', ')}</span>
  </div>`:'';
  body.innerHTML=unpaidBanner+raiders.map(name=>{
    const items=lootMap[name];
    const total=items.reduce((s,i)=>s+i.price,0);
    const owed=items.filter(i=>!i.paid).reduce((s,i)=>s+i.price,0);
    const allPaid=owed===0;
    const unpaidIds=items.filter(i=>!i.paid).map(i=>i.auctionId);
    const selectAllBtn=!allPaid?`<button onclick="markAllPaid([${unpaidIds.map(id=>`'${id}'`).join(',')}])" style="font-family:'Cinzel',serif;font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;background:transparent;color:var(--green);border:1px solid rgba(96,204,128,0.4);padding:.2rem .55rem;border-radius:3px;margin-bottom:.35rem;">Mark All Paid</button>`:'';
    const statusLine=allPaid
      ?`<div style="font-size:.75rem;color:var(--green);margin-bottom:.4rem;font-family:'Cinzel',serif;letter-spacing:.05em;">&#10003; Settled</div>`
      :`<div style="font-size:.75rem;color:var(--red);margin-bottom:.4rem;">Owed: ${owed.toLocaleString()}g</div>`;
    const rowBorder=allPaid?'var(--border-gold)':'rgba(226,96,96,0.4)';
    const itemRows=items.map(i=>`
      <div class="raider-item" style="gap:.5rem;">
        <input type="checkbox" ${i.paid?'checked':''} onchange="togglePaid('${i.auctionId}')"
          style="width:15px;height:15px;flex-shrink:0;cursor:pointer;accent-color:var(--green);" />
        ${i.icon?`<img src="${iconUrl(i.icon)}" style="width:20px;height:20px;border-radius:2px;flex-shrink:0;" />`:''}
        <span class="raider-item-name item-name ${i.quality}" style="font-size:.78rem;flex:1;">${i.name}</span>
        <span class="raider-item-price" style="${i.paid?'color:var(--text-muted);text-decoration:line-through;':''}">${i.price.toLocaleString()}g</span>
      </div>`).join('');
    return`<div class="raider-row" style="border-color:${rowBorder};">
      <div class="raider-name" style="margin-bottom:.25rem;"><span>${name}</span><span class="raider-total">${total.toLocaleString()}g total</span></div>
      ${statusLine}${selectAllBtn}
      ${itemRows}
    </div>`;
  }).join('');
}

// ── Rollout Mode ──────────────────────────────────────────────────────────
function enterRollout(){
  rolloutMode=true;
  // Broadcast to all raiders that the run is wrapping up
  update(runRef(),{rolloutActive:true});
  renderRollout();
}
function exitRollout(){
  rolloutMode=false;
  update(runRef(),{rolloutActive:false});
  document.querySelectorAll('.rollout-overlay').forEach(e=>e.remove());
  document.getElementById('raider-summary-overlay')?.remove();
}
function renderRollout(){
  document.querySelectorAll('.rollout-overlay').forEach(e=>e.remove());
  const lootMap=getAllRaiderLoot();
  const raiders=Object.keys(lootMap).sort((a,b)=>{
    const owedA=lootMap[a].filter(i=>!i.paid).reduce((s,i)=>s+i.price,0);
    const owedB=lootMap[b].filter(i=>!i.paid).reduce((s,i)=>s+i.price,0);
    if(owedB!==owedA)return owedB-owedA;
    const totalA=lootMap[a].reduce((s,i)=>s+i.price,0);
    const totalB=lootMap[b].reduce((s,i)=>s+i.price,0);
    return totalB-totalA;
  });
  const totalOwed=raiders.reduce((s,n)=>s+lootMap[n].filter(i=>!i.paid).reduce((ss,i)=>ss+i.price,0),0);
  const unpaidCount=raiders.filter(n=>lootMap[n].some(i=>!i.paid)).length;
  const ol=document.createElement('div');
  ol.className='rollout-overlay';
  ol.innerHTML=`
    <div class="rollout-hdr">
      <div class="rollout-hdr-left">
        <span class="rollout-hdr-title">&#9760; Rollout</span>
        <span class="rollout-hdr-meta">${raiders.length} raiders &middot; ${unpaidCount} unpaid &middot; ${totalOwed.toLocaleString()}g owed</span>
      </div>
      <button class="rollout-exit" onclick="exitRollout()">&#x2715; Exit Rollout</button>
    </div>
    <div class="rollout-body" id="rollout-body">
      ${raiders.length?raiders.map(name=>{
        const items=lootMap[name];
        const total=items.reduce((s,i)=>s+i.price,0);
        const owed=items.filter(i=>!i.paid).reduce((s,i)=>s+i.price,0);
        const allPaid=owed===0;
        const unpaidIds=items.filter(i=>!i.paid).map(i=>`'${i.auctionId}'`);
        return`<div class="rollout-card${allPaid?' all-paid':''}" id="rollout-card-${name.replace(/\s/g,'_')}">
          <div class="rollout-card-hdr">
            <span class="rollout-card-name">${name}</span>
            <div class="rollout-card-right">
              <span class="rollout-card-total">${total.toLocaleString()}g total</span>
              ${allPaid
                ?`<span class="rollout-card-settled">&#10003; Settled</span>`
                :`<span class="rollout-card-owed">${owed.toLocaleString()}g owed</span>`}
            </div>
          </div>
          <div class="rollout-items">
            ${items.map(i=>{
              const whAttr=i.itemId?`data-wowhead="item=${i.itemId}&domain=tbc" data-wh-icon-size="small"`:'';
              return`
              <div class="rollout-item" id="rollout-item-${i.auctionId}">
                ${i.icon
                  ?`<img class="rollout-item-icon" src="${iconUrl(i.icon)}" ${whAttr} />`
                  :`<div class="rollout-item-icon-ph" ${whAttr}></div>`}
                <span class="rollout-item-name item-name ${i.quality||'epic'}" ${whAttr}>${i.name}</span>
                <span class="rollout-item-price${i.paid?' paid':''}">${i.price.toLocaleString()}g</span>
                ${!i.paid?`<button class="rollout-pay-btn" onclick="rolloutTogglePaid('${i.auctionId}','${name}')">&#10003;</button>`
                         :`<span style="font-size:.65rem;color:rgba(46,180,80,0.5);font-family:'Cinzel',serif;">Paid</span>`}
              </div>`;}).join('')}
          </div>
          ${!allPaid?`<button class="rollout-markall" onclick="rolloutMarkAll([${unpaidIds.join(',')}],'${name}')">Mark All Paid</button>`:''}
        </div>`;
      }).join(''):`<div style="color:var(--text-muted);font-size:.85rem;padding:2rem;text-align:center;">No sold items yet</div>`}
    </div>`;
  document.body.appendChild(ol);
  refreshWowheadLinks();
}
function rolloutTogglePaid(id,name){
  if(!isRL)return;
  const a=auctions[id];if(!a)return;
  update(runRef(`/auctions/${id}`),{paid:!a.paid}).then(()=>renderRollout());
}
function rolloutMarkAll(ids,name){
  if(!isRL)return;
  const updates={};
  ids.forEach(id=>{updates[`auctions/${id}/paid`]=true;});
  if(Object.keys(updates).length)update(runRef(),updates).then(()=>renderRollout());
}

function renderRaiderSummary(){
  if(!user||isRL)return;
  document.getElementById('raider-summary-overlay')?.remove();
  const won=auctionList().filter(a=>a.status==='sold'&&(()=>{const b=Object.values(a.bids||{}).sort((x,y)=>y.amount-x.amount);return b[0]?.bidder===user;})());
  const totalSpent=won.reduce((s,a)=>s+a.currentBid,0);
  const ol=document.createElement('div');
  ol.id='raider-summary-overlay';
  ol.style.cssText='position:fixed;inset:0;z-index:8999;background:rgba(8,6,4,0.88);display:flex;align-items:center;justify-content:center;padding:1rem;backdrop-filter:blur(6px);';
  ol.innerHTML=`
    <div style="background:#1a1612;border:1px solid var(--border-gold-strong);border-radius:6px;width:100%;max-width:480px;max-height:85vh;display:flex;flex-direction:column;overflow:hidden;">
      <div style="padding:1.25rem 1.5rem .9rem;border-bottom:1px solid rgba(201,168,76,0.15);display:flex;align-items:center;justify-content:space-between;">
        <div>
          <div style="font-family:'Cinzel',serif;font-size:1rem;letter-spacing:.1em;color:var(--gold);">Run Complete</div>
          <div style="font-size:.72rem;color:var(--text-muted);margin-top:.2rem;">${won.length} item${won.length!==1?'s':''} won &middot; ${totalSpent.toLocaleString()}g spent</div>
        </div>
        <button onclick="document.getElementById('raider-summary-overlay').remove()" style="background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:1rem;padding:.25rem .4rem;">&#10005;</button>
      </div>
      <div style="overflow-y:auto;flex:1;padding:.5rem 0;">
        ${won.length?won.map(a=>{
          const iconHtml=getIconImg(a.itemId,a.itemIcon,32);

// ── Grids & Cards ─────────────────────────────────────────────────────────
function renderCategoryRows(list,mode){
  if(!list.length)return`<div class="empty"><div style="font-family:'Cinzel',serif;color:var(--gold-dim);">No live auctions</div></div>`;
  const catOrder=['Tier','Physical','Caster/Healer','Other'];
  const catLabelClass={'Tier':'cat-row-tier','Physical':'cat-row-physical','Caster/Healer':'cat-row-caster','Other':'cat-row-other'};
  const cardWrap=(a)=>{
    const checked=selectedItems.has(a.id);
    const checkbox=isRL?`<div class="card-check ${checked?'checked':''}" onclick="toggleSelect(event,'${a.id}','${mode}')" title="Select">${checked?'✓':''}</div>`:'';
    return`<div id="wrap-${a.id}" class="card-wrap ${checked?'card-selected':''}" style="position:relative;${isRL?'cursor:pointer;':''}" onclick="cardClick(event,'${a.id}','${mode}')">${checkbox}${renderCard(a,mode)}</div>`;
  };
  // Group by category
  const groups={};
  list.forEach(a=>{
    const cat=a.category||'Other';
    if(!groups[cat])groups[cat]=[];
    groups[cat].push(a);
  });
  // Render in order, skip empty categories
  const rows=catOrder.filter(c=>groups[c]?.length).map(cat=>{
    const items=groups[cat];
    const cls=catLabelClass[cat]||'cat-row-other';
    const cards=items.map(cardWrap).join('');
    return`<div class="cat-row">
      <div class="cat-row-label ${cls}">${cat}</div>
      <div class="cat-row-scroll">${cards}</div>
    </div>`;
  });
  // Any uncategorized categories not in catOrder
  Object.keys(groups).filter(c=>!catOrder.includes(c)).forEach(cat=>{
    const cards=groups[cat].map(cardWrap).join('');
    rows.push(`<div class="cat-row">
      <div class="cat-row-label cat-row-other">${cat}</div>
      <div class="cat-row-scroll">${cards}</div>
    </div>`);
  });
  const bulkBar=isRL?renderBulkBar(list,mode):'';
  return bulkBar+rows.join('');
}

function cardClick(evt,id,mode){
  if(!isRL)return;
  // Ignore clicks on interactive elements — let them do their job
  if(evt.target.closest('button,input,a,.card-check,select,textarea'))return;
  toggleSelect(evt,id,mode);
}
function toggleSelect(evt,id,mode){
  evt.stopPropagation();
  const list=currentModeList(mode);
  const ids=list.map(a=>a.id);
  if(evt.shiftKey&&lastSelectedId&&lastSelectedMode===mode){
    const a=ids.indexOf(lastSelectedId),b=ids.indexOf(id);
    if(a>=0&&b>=0){const[lo,hi]=[Math.min(a,b),Math.max(a,b)];for(let i=lo;i<=hi;i++)selectedItems.add(ids[i]);}
  } else {
    if(selectedItems.has(id))selectedItems.delete(id);else selectedItems.add(id);
  }
  lastSelectedId=id;lastSelectedMode=mode;
  renderMain();
}

function toggleSelectAll(mode){
  const list=currentModeList(mode);
  const ids=list.map(a=>a.id);
  const allSelected=ids.length>0&&ids.every(id=>selectedItems.has(id));
  if(allSelected)ids.forEach(id=>selectedItems.delete(id));
  else ids.forEach(id=>selectedItems.add(id));
  renderMain();
}

function clearSelection(){selectedItems.clear();lastSelectedId=null;renderMain();}

function currentModeList(mode){
  const all=auctionList();
  if(mode==='open')return all.filter(a=>a.status==='open');
  if(mode==='queued')return all.filter(a=>a.status==='queued');
  if(mode==='sold')return all.filter(a=>a.status==='sold');
  if(mode==='expired')return all.filter(a=>a.status==='expired');
  return [];
}

function selectedList(){return auctionList().filter(a=>selectedItems.has(a.id));}

function bulkRestart(){
  const items=selectedList().filter(a=>a.status==='expired');
  items.forEach(a=>restartAuction(a.id,true));
  clearSelection();
  toast(`Restarted ${items.length} item${items.length!==1?'s':''}`);
}

function bulkStart(){
  const items=selectedList().filter(a=>a.status==='queued');
  items.forEach(a=>startOne(a.id,true));
  clearSelection();
  toast(`Started ${items.length} item${items.length!==1?'s':''}`);
}

function bulkPause(){
  const items=selectedList().filter(a=>a.status==='open');
  items.forEach(a=>{if(!a.paused)togglePause(a.id);});
  clearSelection();
}

function bulkClose(){
  const items=selectedList().filter(a=>a.status==='open');
  wowConfirm({
    title:'Close Auctions?',
    msg:`Close ${items.length} live auction${items.length!==1?'s':''}? Items with bids will be sold to the current winner.`,
    confirmLabel:'Close',
    danger:true,
    onConfirm:()=>{
      items.forEach(a=>closeAuction(a.id,true));
      clearSelection();
    }
  });
}

let _lastRemoved=null;
function bulkRemove(mode){
  const items=selectedList();
  const cnt=items.length;
  wowConfirm({
    title:'Remove Items?',
    msg:`Remove ${cnt} item${cnt!==1?'s':''}?`,
    confirmLabel:'Remove',
    danger:true,
    onConfirm:()=>{
      // Snapshot for undo
      _lastRemoved=items.map(a=>({...a}));
      const updates={};
      items.forEach(a=>{updates[`auctions/${a.id}`]=null;});
      update(runRef(),updates);
      auditLog('bulk_remove',{count:cnt,items:items.map(a=>a.name)});
      clearSelection();
      toastUndo(`Removed ${cnt} item${cnt!==1?'s':''}`,undoBulkRemove);
    }
  });
}
function undoBulkRemove(){
  if(!_lastRemoved||!_lastRemoved.length)return;
  const updates={};
  _lastRemoved.forEach(a=>{updates[`auctions/${a.id}`]=a;});
  update(runRef(),updates);
  toast(`Restored ${_lastRemoved.length} item${_lastRemoved.length!==1?'s':''}`);
  _lastRemoved=null;
}

function renderGrid(list,mode){
  if(!list.length){const msgs={open:'No live auctions',queued:'Queue is empty',sold:'No items sold yet',expired:'No expired items'};return`<div class="empty"><div style="font-family:'Cinzel',serif;color:var(--gold-dim);">${msgs[mode]||'Nothing here'}</div></div>`;}
  const draggable=mode==='queued'&&isRL;
  const bulkBar=isRL?renderBulkBar(list,mode):'';
  return bulkBar+`<div class="grid">${list.map(a=>{
    const checked=selectedItems.has(a.id);
    const checkbox=isRL?`<div class="card-check ${checked?'checked':''}" onclick="toggleSelect(event,'${a.id}','${mode}')" title="Select">${checked?'✓':''}</div>`:'';
    return`<div ${draggable?`draggable="true" ondragstart="dragStart(event,'${a.id}')" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="dragDrop(event,'${a.id}')" ondragend="dragEnd(event)"`:''} id="wrap-${a.id}" class="card-wrap ${checked?'card-selected':''}" style="${draggable?'cursor:grab;':(isRL?'cursor:pointer;':'')}position:relative;" onclick="cardClick(event,'${a.id}','${mode}')">${checkbox}${renderCard(a,mode)}</div>`;
  }).join('')}</div>`;
}

function renderBulkBar(list,mode){
  const ids=list.map(a=>a.id);
  const selectedInMode=ids.filter(id=>selectedItems.has(id));
  const allSelected=ids.length>0&&selectedInMode.length===ids.length;
  const n=selectedInMode.length;
  let actions='';
  if(n>0){
    if(mode==='expired')actions=`<button class="btn btn-green btn-sm" onclick="event.stopPropagation();bulkRestart()">&#9654; Restart ${n}</button><button class="btn btn-danger btn-sm" onclick="event.stopPropagation();bulkRemove('${mode}')">Remove ${n}</button>`;
    else if(mode==='queued')actions=`<button class="btn btn-green btn-sm" onclick="event.stopPropagation();bulkStart()">&#9654; Start ${n}</button><button class="btn btn-danger btn-sm" onclick="event.stopPropagation();bulkRemove('${mode}')">Remove ${n}</button>`;
    else if(mode==='sold')actions=`<button class="btn btn-danger btn-sm" onclick="event.stopPropagation();bulkRemove('${mode}')">Remove ${n}</button>`;
    else if(mode==='open')actions=`<button class="btn btn-outline btn-sm" onclick="event.stopPropagation();bulkPause()">&#10073;&#10073; Pause ${n}</button><button class="btn btn-danger btn-sm" onclick="event.stopPropagation();bulkClose()">Close ${n}</button>`;
  }
  return`<div class="bulk-bar bar-clickable" onclick="toggleSelectAll('${mode}')">
    <div class="card-check bulk-all ${allSelected?'checked':''}" onclick="event.stopPropagation();toggleSelectAll('${mode}')" title="Select all">${allSelected?'✓':''}</div>
    <span style="font-size:.7rem;color:var(--text-muted);font-family:'Cinzel',serif;letter-spacing:.06em;">${n>0?`${n} selected`:'Select all'}</span>
    <div style="flex:1;"></div>
    ${actions}
    ${n>0?`<button class="btn btn-outline btn-sm" onclick="event.stopPropagation();clearSelection()">Clear</button>`:''}
  </div>`;
}

function renderCard(a,mode){
  const allBids=Object.entries(a.bids||{}).sort((x,y)=>y[1].amount-x[1].amount);
  const bids=allBids.map(([,b])=>b).filter(b=>!b.retracted);
  const top=bids[0]||null,isLeading=top&&top.bidder===user;
  const hasMyBid=bids.some(b=>b.bidder===user);
  const isBehind=hasMyBid&&!isLeading;
  const now=Date.now();
  const rem=a.status==='open'&&!a.paused&&a.endsAt?Math.max(0,Math.floor((a.endsAt-now)/1000)):(a.remaining||0);
  const pct=a.status==='open'?Math.round((rem/(a.duration||120))*100):0;
  const urgent=rem<=15&&a.status==='open'&&!a.paused;
  const minNext=(a.currentBid||0)+(a.minIncrement||250);
  const showCustom=!!customOpen[a.id];
  const activeBids=allBids.filter(([,b])=>!b.retracted).slice(0,5);
  const retractedBids=allBids.filter(([,b])=>b.retracted);
  const histEntries=[...activeBids,...retractedBids];
  const histItems=histEntries.map(([key,b])=>{
    const isRetracted=!!b.retracted;
    const name=b.bidder===user?'You':b.bidder;
    const rlX=isRL&&!isRetracted?`<button onclick="rlRetractBid('${a.id}','${key}')" style="background:none;border:none;color:var(--red);cursor:pointer;font-size:.65rem;padding:0 .2rem;opacity:.5;flex-shrink:0;" title="Retract this bid">✕</button>`:'';
    return`<div class="hist-row" style="${isRetracted?'opacity:.4;':''}">
      <span class="${b.bidder===user&&!isRetracted?'you-bid':''}" style="${isRetracted?'text-decoration:line-through;color:var(--red);':''};">${name}${isRetracted?' ↩':''}</span>
      <span style="margin-left:auto;${isRetracted?'text-decoration:line-through;color:var(--red);':''}">${b.amount.toLocaleString()}g</span>
      ${rlX}
    </div>`;
  }).join('');
  const iconHTML=a.itemId
    ?`<a href="https://www.wowhead.com/tbc/item=${a.itemId}" data-wowhead="item=${a.itemId}&domain=tbc" target="_blank" style="display:inline-block;line-height:0;">${getIconImg(a.itemId,a.itemIcon,56)}</a>`
    :a.itemIcon
    ?`${getIconImg(null,a.itemIcon,56)}`
    :`<div class="item-icon-placeholder"></div>`;
  const nameHTML=a.itemId?`<a class="item-name ${a.quality||'common'}" href="https://www.wowhead.com/tbc/item=${a.itemId}" data-wowhead="item=${a.itemId}&domain=tbc" target="_blank" style="text-decoration:none;">${a.name}</a>`:`<span class="item-name ${a.quality||'common'}">${a.name}</span>`;
  const catBadge=a.category&&a.category!=='Other'?`<span class="category-badge ${catClass(a.category)}">${a.category}</span>`:'';
  const itemHeader=`<div class="item-header" style="padding-right:.6rem;padding-left:.5rem;">${iconHTML}<div style="flex:1;min-width:0;overflow-wrap:break-word;height:4.2rem;overflow:hidden;">${nameHTML}</div></div>`;
  let timerSection='';
  if(mode==='open'){const fc=a.paused?'#e8a430':urgent?'#e26060':'#c9a84c',tc=a.paused?'var(--amber)':urgent?'var(--red)':'var(--text-muted)';const tBtns=isRL?`<button class="btn btn-outline btn-sm" style="padding:.2rem .5rem;font-size:.65rem;flex-shrink:0;" onclick="extendTimer('${a.id}')">+30s</button><button class="btn btn-outline btn-sm" style="padding:.2rem .5rem;font-size:.65rem;flex-shrink:0;" onclick="openEdit('${a.id}')">Edit</button>`:'';timerSection=`<div class="timer-row"><div class="timer-bar"><div id="tfill-${a.id}" class="timer-fill" style="width:${pct}%;background:${fc};"></div></div><span id="ttext-${a.id}" class="timer" style="color:${tc};">${a.paused?'Paused':fmtTime(rem)}</span>${tBtns}</div>`;}
  let bidSection='';
  if(mode==='open'&&!a.paused){
    const btns=a.bidButtons||raidSettings.defaultBidButtons||[250,500,1000];
    const cur=bids[0]?.amount||(bids.length===0?(a.startBid||1000):0);
    const noteHTML=a.note?`<div style="font-size:.78rem;color:var(--amber);margin-bottom:.2rem;">&#128203; ${a.note}</div>`:'';
    const hasBids=bids.length>0;
    const isGuest=!discordUser&&!isRL;
    const qbtns=isGuest
      ?`<div style="text-align:center;padding:.5rem;font-size:.75rem;color:var(--text-muted);font-family:'Cinzel',serif;letter-spacing:.05em;">&#128274; <a onclick="joinDiscord()" style="color:var(--gold);cursor:pointer;text-decoration:underline;">Login with Discord</a> to bid</div>`
      :(hasBids
        ? btns.map(inc=>{const amt=cur+inc;return`<button class="qb" style="text-align:center;flex:1;" onclick="quickBid('${a.id}',${amt},event)">+${inc.toLocaleString()}g</button>`;}).join('')
        : `<button class="qb" style="flex:1;text-align:center;" onclick="quickBid('${a.id}',${cur},event)">Bid ${cur.toLocaleString()}g</button>`);
    const bidRightBtns=isRL?`<div style="display:flex;flex-direction:column;gap:.25rem;margin-left:auto;align-self:flex-start;margin-top:.5rem;">
      <button class="btn btn-clone btn-sm" style="padding:.2rem .55rem;font-size:.65rem;" onclick="duplicateItem('${a.id}')">Clone</button>
      <button class="btn btn-outline btn-sm" style="padding:.2rem .55rem;font-size:.65rem;" onclick="resetAuction('${a.id}')">Reset</button>
      <button class="btn btn-danger btn-sm" style="padding:.2rem .55rem;font-size:.65rem;margin-top:.15rem;" onclick="cancelAuction('${a.id}')">Cancel</button>
    </div>`:'' ;
    const cbtn=isGuest?'':`<button class="qb qb-custom ${showCustom?'active-custom':''}" style="width:100%;text-align:center;padding:.6rem .7rem;font-size:.85rem;font-weight:600;border-width:2px;margin-top:.35rem;" onclick="toggleCustom('${a.id}')">${showCustom?'&#x2715; Hide Custom':'Custom Bid'}</button>`;
    const crow=(!isGuest&&showCustom)?`<div class="custom-bid-row"><input type="number" id="bid-${a.id}" placeholder="Enter amount..." min="${minNext}" step="${a.minIncrement||250}" onkeydown="if(event.key==='Enter')placeBid('${a.id}',event)" /><button class="btn btn-outline btn-sm" onclick="placeBid('${a.id}',event)">Bid</button></div>`:'';
    const autoBidSet=autoBids[a.id];
    const autoBidBtn=!isRL?`<div style="margin-top:.3rem;display:flex;align-items:center;gap:.4rem;">
      ${autoBidSet
        ?`<span style="font-size:.7rem;color:var(--amber);font-family:'Cinzel',serif;">Auto: up to ${autoBidSet.toLocaleString()}g</span>
           <button onclick="clearAutoBid('${a.id}')" style="background:none;border:none;color:var(--red);cursor:pointer;font-size:.7rem;padding:0;">✕</button>`
        :`<button onclick="setAutoBid('${a.id}')" style="background:rgba(201,168,76,0.12);border:1px solid rgba(201,168,76,0.4);color:var(--gold);cursor:pointer;font-size:.7rem;font-family:'Cinzel',serif;letter-spacing:.06em;padding:.3rem .7rem;border-radius:3px;">&#9654; Set Limit Bid</button>`
      }
    </div>`:'' ;
    bidSection=`<div class="bid-section">${noteHTML}<div style="display:flex;align-items:flex-start;gap:.5rem;"><div><div class="bid-amt">${cur.toLocaleString()}g</div><div class="bid-ldr ${isLeading?'you':''}">${top?(top.bidder===user?'You are leading':top.bidder+' leads'):'Starting bid'}</div></div>${bidRightBtns}</div><div class="min-bid-note">Min next: ${minNext.toLocaleString()}g</div><div class="quick-bids">${qbtns}</div>${cbtn}${crow}${autoBidBtn}</div>`;
  }else if(mode==='open'&&a.paused){
    const noteHTML=a.note?`<div style="font-size:.78rem;color:var(--amber);margin-bottom:.2rem;">&#128203; ${a.note}</div>`:'';
    bidSection=`<div class="bid-section">${noteHTML}<div class="bid-amt">${(a.currentBid||0).toLocaleString()}g</div><div style="font-size:.78rem;color:var(--amber);">Bidding paused</div></div>`;
  }
  else if(mode==='queued'){
    const noteHTML=a.note?`<div style="font-size:.78rem;color:var(--amber);">&#128203; ${a.note}</div>`:'';
    bidSection=`<div class="bid-section"><div class="bid-amt">${(a.currentBid||0).toLocaleString()}g</div>${noteHTML}</div>`;
  }
  else if(mode==='sold'){
    const isWinner=top&&top.bidder===user;
    const canToggle=isRL||isWinner;
    const paidBtn=canToggle
      ?(isRL
        ?`<button onclick="togglePaid('${a.id}')" style="width:100%;margin-top:.5rem;padding:.55rem;border-radius:4px;font-family:'Cinzel',serif;font-size:.72rem;letter-spacing:.07em;font-weight:600;cursor:pointer;border:none;transition:background .15s;${a.paid?'background:rgba(46,180,80,0.15);color:#4dff70;border:1px solid rgba(46,180,80,0.4);':'background:rgba(226,96,96,0.12);color:#ff8080;border:1px solid rgba(226,96,96,0.4);'}">${a.paid?'&#10003; Paid — tap to undo':'&#9679; Unpaid — tap to confirm'}</button>`
        :(!a.paid?`<button onclick="togglePaid('${a.id}')" style="width:100%;margin-top:.5rem;padding:.55rem;border-radius:4px;font-family:'Cinzel',serif;font-size:.72rem;letter-spacing:.07em;font-weight:600;cursor:pointer;border:none;background:rgba(226,96,96,0.12);color:#ff8080;border:1px solid rgba(226,96,96,0.4);">&#9679; Unpaid — tap to confirm</button>`
          :`<div style="margin-top:.4rem;font-size:.75rem;color:var(--green);font-family:'Cinzel',serif;">&#10003; Paid</div>`))
      :(a.paid?`<div style="margin-top:.4rem;font-size:.75rem;color:var(--green);font-family:'Cinzel',serif;">&#10003; Paid</div>`:'');
    const noteHTML=a.note?`<div style="font-size:.78rem;color:var(--amber);margin-top:.2rem;">&#128203; ${a.note}</div>`:'';
    bidSection=`<div class="bid-section"><div class="bid-amt">${(a.currentBid||0).toLocaleString()}g</div><div class="bid-ldr">Won by ${top?top.bidder:'&mdash;'}</div>${noteHTML}${paidBtn}</div>`;
  }
  else if(mode==='expired'){bidSection=`<div class="bid-section"><div class="bid-amt">${(a.currentBid||0).toLocaleString()}g</div><div style="font-size:.85rem;color:var(--red);">No bids placed</div></div>`;}
  let rlControls='';
  let badge='';
  if(isRL){
    if(mode==='open'){
      const bottomBtns=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:.35rem;">
        <button class="btn ${a.paused?'btn-amber-resume':'btn-amber'} btn-sm" style="display:flex;align-items:center;justify-content:center;gap:.3rem;" onclick="togglePause('${a.id}')">${a.paused?'&#9654; Resume':'<svg width="9" height="11" viewBox="0 0 9 11"><rect x="0" y="0" width="3" height="11" rx="1" fill="currentColor"/><rect x="6" y="0" width="3" height="11" rx="1" fill="currentColor"/></svg> Pause'}</button>
        <button class="btn btn-gold btn-sm" onclick="closeAuction('${a.id}')">Close</button>
      </div>`;
      rlControls=bottomBtns;
    }
    else if(mode==='queued')rlControls=`<div class="rl-controls" data-wowhead-no-hover style="display:grid;grid-template-columns:1fr 1fr;gap:.3rem;"><button class="btn btn-green btn-sm" onclick="startOne('${a.id}')">&#9654; Start</button><button class="btn btn-outline btn-sm" onclick="openEdit('${a.id}')">Edit</button><button class="btn btn-clone btn-sm" onclick="duplicateItem('${a.id}')">Clone</button><button class="btn btn-danger btn-sm" onclick="removeQueued('${a.id}')">Remove</button></div>`;
    else if(mode==='expired')rlControls=`<div class="rl-controls"><button class="btn btn-green btn-sm" onclick="restartAuction('${a.id}')">&#9654; Restart</button><button class="btn btn-outline btn-sm" onclick="openEdit('${a.id}')">Edit</button><button class="btn btn-danger btn-sm" onclick="removeQueued('${a.id}')">Remove</button></div>`;
    else if(mode==='sold')rlControls=`<div class="rl-controls"><button class="btn btn-green btn-sm" onclick="restartFromSold('${a.id}')">&#9654; Restart</button><button class="btn btn-outline btn-sm" onclick="openEditSold('${a.id}')">Edit</button><button class="btn btn-danger btn-sm" onclick="removeSold('${a.id}')">Remove</button></div>`;
  }
  const qualityClass=(a.quality==='legendary')?'quality-legendary':(a.quality==='epic')?'quality-epic':'';
  const cc=[mode==='queued'?'queued':mode==='expired'?'expiring':isLeading?'leading':isBehind?'behind':a.paused?'paused':urgent?'expiring':'', qualityClass].filter(Boolean).join(' ');
  // Status pill now lives in the slot row (right-aligned), never overlapping the name
  let statusBadge='';
  if(mode==='open'&&a.paused)statusBadge=`<div class="badge badge-paused" style="position:static;">Paused</div>`;
  else if(mode==='open')statusBadge=`<div class="badge badge-open" style="position:static;">Live</div>`;
  else if(mode==='queued')statusBadge=`<div class="badge badge-queued" style="position:static;">Queued</div>`;
  else if(mode==='expired')statusBadge=`<div class="badge badge-expired" style="position:static;">Expired</div>`;
  else statusBadge=`<div class="badge badge-sold" style="position:static;">Sold</div>`;
  const slotBadgeRow=`<div style="display:flex;align-items:center;gap:.35rem;margin-bottom:.25rem;">${catBadge}${a.slot?`<span class="item-slot">${a.slot}</span>`:''}<span style="margin-left:auto;">${statusBadge}</span></div>`;
  bidSection=bidSection.replace('<div class="bid-section">','<div class="bid-section">'+slotBadgeRow);
  // Involvement badge removed — card border/glow handles leading/behind/won states
  const wonClass=mode==='sold'&&top&&top.bidder===user?'won-card':'';
  return`<div class="card ${[cc,wonClass].filter(Boolean).join(' ')}" id="card-${a.id}" style="position:relative;">${badge}${itemHeader}${timerSection}${bidSection}${bids.length||retractedBids.length?`<div class="hist">${histItems}</div>`:''}${rlControls}</div>`;
}

function addToQueue(){
  if(!selectedItem){toast('Please search and select an item first');return;}
  const qty=Math.max(1,Math.min(20,parseInt(document.getElementById('m-qty')?.value)||1));

    set(nr,{id:nr.key,name,slot:selectedItem.slot||'',quality:modalQuality,itemId:selectedItem.id,itemIcon:selectedItem.icon||null,currentBid:startBid,startBid,minIncrement:btn1,duration:dur,bidButtons:[btn1,btn2,btn3],category:modalCategory||'Other',note:document.getElementById('m-note')?.value?.trim()||'',bids:{},status:'queued',order:queuedCount+i,remaining:dur,paused:false,endsAt:null});

function setAutoBid(id){
  const a=auctions[id];if(!a||a.status!=='open')return;
  const cur=Object.values(a.bids||{}).filter(b=>!b.retracted).sort((x,y)=>y.amount-x.amount)[0]?.amount||a.currentBid||0;
  const min=cur+(a.minIncrement||250);
  wowConfirm({
    title:'Set Limit Bid',
    msg:`<strong style="color:#f5d060;">${a.name}</strong><br>Current: ${cur.toLocaleString()}g &nbsp;·&nbsp; Min: ${min.toLocaleString()}g`,
    confirmLabel:'Set Limit',
    danger:false,
    input:{placeholder:`e.g. ${(min*4).toLocaleString()}`,min,step:a.minIncrement||250,errorMsg:`Must be at least ${min.toLocaleString()}g`},
    onConfirm:(max)=>{

function cancelAll(){

function togglePauseAll(){
  const live=auctionList().filter(a=>a.status==='open');
  if(!live.length)return;
  const anyRunning=live.some(a=>!a.paused);
  const now=Date.now();
  const updates={};
  live.forEach(a=>{
    if(anyRunning){
      // Pause all running ones
      if(!a.paused){updates[`auctions/${a.id}/paused`]=true;updates[`auctions/${a.id}/remaining`]=Math.max(0,Math.floor((a.endsAt-now)/1000));}
    } else {
      // Resume all paused ones
      if(a.paused){updates[`auctions/${a.id}/paused`]=false;updates[`auctions/${a.id}/endsAt`]=now+(a.remaining||0)*1000;}
    }
  });
  if(Object.keys(updates).length){update(runRef(),updates);toast(anyRunning?'All auctions paused':'All auctions resumed');}
}

function coinExplosionAt(goldAmount, rect){
  const cx=rect ? rect.left+rect.width/2  : window.innerWidth/2;
  const cy=rect ? rect.top +rect.height/2 : window.innerHeight/2;

  let tiers=[];
  if(goldAmount>=100000)     tiers=[{n:6,s:320,d:1.4,fs:2.2},{n:14,s:420,d:1.8,fs:1.8},{n:22,s:560,d:2.2,fs:1.4},{n:32,s:700,d:2.6,fs:1.1}];
  else if(goldAmount>=50000) tiers=[{n:5,s:260,d:1.3,fs:2.0},{n:12,s:360,d:1.7,fs:1.6},{n:18,s:480,d:2.0,fs:1.2}];
  else if(goldAmount>=25000) tiers=[{n:4,s:200,d:1.2,fs:1.8},{n:10,s:300,d:1.6,fs:1.4},{n:14,s:400,d:1.9,fs:1.1}];
  else if(goldAmount>=10000) tiers=[{n:4,s:160,d:1.1,fs:1.6},{n:8,s:240,d:1.5,fs:1.2}];
  else                       tiers=[{n:5,s:120,d:1.0,fs:1.4}];

  const emojis=['🪙','🪙','🪙','💰','✨'];
  tiers.forEach((tier,ti)=>{
    setTimeout(()=>{
      for(let i=0;i<tier.n;i++){
        setTimeout(()=>{
          const el=document.createElement('span');
          el.className='coin-burst';
          const angle=Math.random()*Math.PI*2;
          const dist=tier.s*(0.6+Math.random()*0.7);
          const ex=Math.cos(angle)*dist;
          const ey=Math.sin(angle)*dist-dist*0.3;
          const rot=(Math.random()-0.5)*720;
          const scale=0.3+Math.random()*0.5;
          el.style.cssText=`left:${cx}px;top:${cy}px;font-size:${tier.fs}rem;`
            +`--cx:${ex}px;--cy:${ey}px;--cr:${rot}deg;--cs:${scale};--cd:${tier.d*(0.7+Math.random()*0.6)}s;`;
          el.textContent=emojis[Math.floor(Math.random()*emojis.length)];
          document.body.appendChild(el);
          setTimeout(()=>el.remove(),(tier.d*1.2)*1000);
        },i*40);
      }
    },ti*180);
  });
  playCoinSound();
  if(goldAmount>=25000) setTimeout(()=>playCoinSound(),200);
  if(goldAmount>=100000) setTimeout(()=>playCoinSound(),400);
}

function coinExplosion(auctionId, goldAmount, preRect){
  const card=document.getElementById('card-'+auctionId);
  const rect=card?card.getBoundingClientRect():preRect||null;
  coinExplosionAt(goldAmount, rect);
}

}

function toggleMute(){
  soundMuted=!soundMuted;
  localStorage.setItem('gdkp_muted',soundMuted?'1':'0');
  const btn=document.getElementById('mute-btn');
  if(btn)btn.textContent=soundMuted?'🔇':'🔊';
  toast(soundMuted?'Sound muted':'Sound on');
}
function playCoinSound(){
  if(soundMuted)return;
  try{
    const a=new Audio(_coinSrc);
    a.volume=0.07;
    a.play().catch(()=>{});
  }catch(e){}
}
function spawnCoin(e){
  // Spawn from the button/element that triggered the bid if available, else center of screen
  const x=e?.clientX??window.innerWidth/2;
  const y=e?.clientY??window.innerHeight*0.7;
  const coins=['🪙','🪙','💰'];
  for(let i=0;i<3;i++){
    setTimeout(()=>{
      const el=document.createElement('span');
      el.className='coin-particle';
      el.textContent=coins[i%coins.length];
      el.style.left=(x + (Math.random()-0.5)*40)+'px';
      el.style.top=y+'px';
      el.style.animationDelay=(i*60)+'ms';
      document.body.appendChild(el);
      setTimeout(()=>el.remove(),1100);
    },i*60);
  }
}

  if(e.key==='Enter'&&open){e.preventDefault();const idx=_searchFocusIdx>=0?_searchFocusIdx:0;if(searchResults[idx])selectItem(searchResults[idx].id);_searchFocusIdx=-1;return;}
}
function handleDropdownItemKey(e,id){
  const dd=document.getElementById('item-dropdown');
  const items=dd?Array.from(dd.querySelectorAll('.dropdown-item')):[];
  const inp=document.getElementById('item-search-input');
  const idx=items.indexOf(e.currentTarget);
  if(e.key==='Enter'||e.key===' '){e.preventDefault();selectItem(id);_searchFocusIdx=-1;return;}
  if(e.key==='Escape'){if(dd)dd.style.display='none';_searchFocusIdx=-1;if(inp)inp.focus();return;}
  if(e.key==='Tab'&&!e.shiftKey){
    // last item — let Tab fall through naturally to next field after closing dropdown
    if(idx>=items.length-1){selectItem(id);_searchFocusIdx=-1;return;}
    e.preventDefault();_searchFocusIdx=idx+1;items[_searchFocusIdx].focus();return;
  }
  if(e.key==='Tab'&&e.shiftKey){
    e.preventDefault();
    if(idx<=0){_searchFocusIdx=-1;if(inp)inp.focus();return;}
    _searchFocusIdx=idx-1;items[_searchFocusIdx].focus();return;
  }
  if(e.key==='ArrowDown'){e.preventDefault();_searchFocusIdx=(idx+1)%items.length;items[_searchFocusIdx].focus();return;}
  if(e.key==='ArrowUp'){e.preventDefault();_searchFocusIdx=(idx-1+items.length)%items.length;items[_searchFocusIdx].focus();return;}
  // Any printable character — return focus to search input
  if(e.key.length===1){if(inp){inp.focus();inp.value+=e.key;onSearchInput(inp.value);}}
}
// Tab-through handler for button groups (Quality, Category)
function handleGroupKeydown(e,buttons,selectFn,values){
  const idx=buttons.indexOf(document.activeElement);
  if(idx===-1)return;
  if(e.key==='Enter'||e.key===' '){e.preventDefault();selectFn(values[idx]);return;}
  if(e.key==='Tab'&&!e.shiftKey){
    if(idx>=buttons.length-1)return; // let Tab leave the group naturally
    e.preventDefault();buttons[idx+1].focus();return;
  }
  if(e.key==='Tab'&&e.shiftKey){
    if(idx<=0)return; // let Shift+Tab leave the group naturally
    e.preventDefault();buttons[idx-1].focus();return;
  }
  if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();buttons[(idx+1)%buttons.length].focus();return;}
  if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();buttons[(idx-1+buttons.length)%buttons.length].focus();return;}
}

function retractBid(id){
  const a=auctions[id];if(!a||a.status!=='open')return;
  const bidEntries=Object.entries(a.bids||{}).sort((x,y)=>y[1].amount-x[1].amount);
  const myTopEntry=bidEntries.find(([,b])=>b.bidder===user);
  if(!myTopEntry){toast('No bid to retract');return;}
  if(bidEntries[0][1].bidder!==user){toast('You are not the current leader');return;}
  const [topKey]=myTopEntry;
  // Mark as retracted rather than delete so history shows it
  const prevBid=bidEntries[1]?.[1]?.amount||0;
  const updates={};
  updates[`auctions/${id}/bids/${topKey}/retracted`]=true;
  updates[`auctions/${id}/currentBid`]=prevBid;
  update(runRef(),updates);
  toast('Bid retracted');
}
function rlRetractBid(id, specificKey){
  const a=auctions[id];if(!a||a.status!=='open'||!isRL)return;
  const bidEntries=Object.entries(a.bids||{}).sort((x,y)=>y[1].amount-x[1].amount);
  const activeEntries=bidEntries.filter(([,b])=>!b.retracted);
  const keyToRetract=specificKey||(activeEntries[0]?.[0]);
  if(!keyToRetract){toast('No bids to retract');return;}
  const bidToRetract=a.bids[keyToRetract];
  if(!bidToRetract){toast('Bid not found');return;}
  // Find highest remaining active bid after this one is retracted
  const remaining=activeEntries.filter(([k])=>k!==keyToRetract);
  const newCurrentBid=remaining[0]?.[1]?.amount||0;
  const updates={};
  updates[`auctions/${id}/bids/${keyToRetract}/retracted`]=true;
  updates[`auctions/${id}/currentBid`]=newCurrentBid;
  update(runRef(),updates);
  writeAudit(`${user} retracted ${bidToRetract.bidder}'s bid of ${bidToRetract.amount.toLocaleString()}g on ${a.name}`);
  toast(`${bidToRetract.bidder}'s bid retracted — price now ${newCurrentBid.toLocaleString()}g`);
}

let chatCollapsed=true;

function renderChatMessages(msgs){
  const box=document.getElementById('chat-messages');
  if(!box) return;
  const wasAtBottom=box.scrollHeight-box.scrollTop-box.clientHeight<40;
  box.innerHTML=msgs.map(m=>{

    const t=new Date(m.ts);

// ── DM System ─────────────────────────────────────────────────────────────
let activeChatTab='raid';
let openDMs=[];
let dmSubs={};
let dmUnread={};

function dmKey(a,b){ return [a,b].sort().join('__'); }
function dmRef(partner){ return ref(db,`dms/${dmKey(user,partner)}`); }

function openDM(partner){
  if(partner===user) return;
  if(!openDMs.includes(partner)) openDMs.push(partner);
  activeChatTab=partner;
  if(chatCollapsed) toggleChat();
  dmUnread[partner]=0;
  renderChatTabs();
  updateChatHeader();
  subscribeToDM(partner);
  get(dmRef(partner)).then(snap=>{
    const msgs=Object.entries(snap.val()||{}).map(([k,v])=>({key:k,...v})).sort((a,b)=>a.ts-b.ts).slice(-100);
    renderChatMessages(msgs);
  });
}

function subscribeToDM(partner){
  if(dmSubs[partner]) return;
  dmSubs[partner]=onValue(dmRef(partner), snap=>{
    const msgs=Object.entries(snap.val()||{}).map(([k,v])=>({key:k,...v})).sort((a,b)=>a.ts-b.ts).slice(-100);
    if(activeChatTab===partner){ renderChatMessages(msgs); }
    else{ dmUnread[partner]=(dmUnread[partner]||0)+1; renderChatTabs(); updateChatUnread(); }
  });
}

function closeDM(partner,e){
  if(e) e.stopPropagation();
  openDMs=openDMs.filter(d=>d!==partner);
  if(dmSubs[partner]){ dmSubs[partner](); delete dmSubs[partner]; }
  delete dmUnread[partner];
  if(activeChatTab===partner){ activeChatTab='raid'; updateChatHeader(); }
  renderChatTabs();
}

function switchChatTab(tab){
  activeChatTab=tab;
  if(tab==='raid'){
    chatUnread=0;
    subscribeToChat();
  } else {
    dmUnread[tab]=0;
    subscribeToDM(tab);
    get(dmRef(tab)).then(snap=>{
      const msgs=Object.entries(snap.val()||{}).map(([k,v])=>({key:k,...v})).sort((a,b)=>a.ts-b.ts).slice(-100);
      renderChatMessages(msgs);
    });
  }
  renderChatTabs();
  updateChatHeader();
  updateChatUnread();
}

function updateChatHeader(){
  const title=document.getElementById('chat-hdr-title');
  if(title) title.textContent=activeChatTab==='raid'?'Raid Chat':'DM: '+activeChatTab;
}

function updateChatUnread(){
  const badge=document.getElementById('chat-unread');
  const total=chatUnread+Object.values(dmUnread).reduce((s,v)=>s+v,0);
  if(badge){ badge.textContent=total>9?'9+':total; badge.style.display=total>0?'flex':'none'; }
}

function renderChatTabs(){
  const bar=document.getElementById('chat-tabs');
  if(!bar) return;
  if(!openDMs.length){ bar.style.display='none'; return; }
  bar.style.display='flex';
  const tabs=[
    `<div class="chat-tab ${activeChatTab==='raid'?'active':''}" onclick="switchChatTab('raid')">Raid${chatUnread>0&&activeChatTab!=='raid'?` <span class="chat-tab-unread">${chatUnread>9?'9+':chatUnread}</span>`:''}</div>`,
    ...openDMs.map(p=>`<div class="chat-tab ${activeChatTab===p?'active':''}" onclick="switchChatTab('${p}')">${p}${dmUnread[p]>0&&activeChatTab!==p?` <span class="chat-tab-unread">${dmUnread[p]>9?'9+':dmUnread[p]}</span>`:''}<button class="chat-tab-close" onclick="closeDM('${p}',event)">✕</button></div>`)
  ];
  bar.innerHTML=tabs.join('');
}

let crossRunFetching=false;

function banKey(m){return m.discordId?'discord_'+m.discordId:'name_'+m.name;}

function subscribeToBans(){
  onValue(ref(db,'bans'),snap=>{
    banList=snap.val()||{};
    if(user&&isBanned({discordId:discordUser?.id,name:user}))handleBanned();
  });
}

function isBanned(m){
  if(m.discordId&&banList['discord_'+m.discordId])return true;
  if(m.name&&banList['name_'+m.name])return true;
  return false;
}

function kickBan(m){
  if(!isRL)return;
  wowConfirm({
    title:'Kick & Ban',
    msg:`Ban ${m.name}? They cannot rejoin until unbanned.`,
    confirmLabel:'Ban',
    danger:true,
    onConfirm:()=>{
      const key=banKey(m);
      set(ref(db,'bans/'+key),{name:m.name,discordId:m.discordId||null,discordName:m.discordName||null,bannedAt:Date.now(),bannedBy:user});
      if(m.name)remove(ref(db,`runs/${runId}/presence/${m.name}`));
      writeAudit(user+' banned '+m.name);
      toast(m.name+' has been banned');
    }
  });
}

function unban(key){
  if(!isRL)return;
  const b=banList[key];
  remove(ref(db,'bans/'+key));
  writeAudit(user+' unbanned '+(b?.name||key));
  toast((b?.name||key)+' has been unbanned');
  if(panelOpen)renderPanel();
}

function handleBanned(){
  if(unsubRun)unsubRun();
  clearPresence();
  user=null;isRL=false;discordUser=null;
  localStorage.clear();
  document.getElementById('main').innerHTML=`
    <div class="login-wrap">

function restoreArchivedRun(archiveKey){
  wowConfirm({
    title:'Restore this run?',
    msg:'All sold items, bids, and winners will be copied into the current run exactly as archived. The pot will reflect the restored totals.',
    confirmLabel:'Restore',
    onConfirm:async()=>{
      try{
        const snap=await get(ref(db,`runs/${archiveKey}`));
        const archiveRun=snap.val();
        if(!archiveRun){toast('Archived run not found');return;}
        const archiveAuctions=archiveRun.auctions||{};
        const soldItems=Object.values(archiveAuctions).filter(a=>a&&a.status==='sold'&&a.name);
        if(!soldItems.length){toast('No sold items to restore');return;}
        // Write each sold item into the current run preserving all data
        const writes=soldItems.map(a=>{
          const nr=push(runRef('/auctions'));
          const item={
            id:nr.key,
            name:a.name,
            slot:a.slot||'',
            quality:a.quality||'epic',
            itemId:a.itemId||null,
            itemIcon:a.itemIcon||null,
            currentBid:a.currentBid||0,
            startBid:a.startBid||0,
            minIncrement:a.minIncrement||250,
            duration:a.duration||120,
            bidButtons:a.bidButtons||[250,500,1000],
            category:a.category||'Other',
            note:a.note||'',
            status:'sold',
            paid:a.paid||false,
            paused:false,
            endsAt:null,
            remaining:0,
            order:a.order??0,
          };
          // Restore bids if present
          if(a.bids&&Object.keys(a.bids).length) item.bids=a.bids;
          return set(nr,item);
        });
        // Also restore settings/title if current run has none
        const titleSnap=await get(runRef('/settings/raidTitle'));
        if(!titleSnap.val()&&archiveRun.settings?.raidTitle){
          await update(runRef('/settings'),{raidTitle:archiveRun.settings.raidTitle});
        }
        await Promise.all(writes);
        toast(`${soldItems.length} items restored`);
        closePanel();
        setTab('sold');
      }catch(e){
        console.error('restoreArchivedRun error:',e);
        toast('Failed to restore: '+e.message);
      }
    }
  });
}

async function deleteRun(runKey){
  if(!isRL) return;
  // Store for undo
  const snap=await get(ref(db,`runs/${runKey}`));
  _pendingDeleteRun={key:runKey, data:snap.val()};
  // Remove immediately
  await remove(ref(db,`runs/${runKey}`));
  crossRunCache=null;
  renderPastRunsPanel();
  // Show undo toast
  clearTimeout(_deleteUndoTimer);
  const el=document.getElementById('toast');
  if(el){
    el.innerHTML=`Run deleted. <button onclick="undoDeleteRun()" style="background:none;border:1px solid var(--gold);color:var(--gold);cursor:pointer;font-family:'Cinzel',serif;font-size:.7rem;padding:.1rem .4rem;border-radius:3px;margin-left:.5rem;">Undo</button>`;
    el.style.pointerEvents='auto';
    el.classList.add('show');
  }
  _deleteUndoTimer=setTimeout(()=>{
    _pendingDeleteRun=null;
    const el=document.getElementById('toast');
    if(el){el.classList.remove('show');el.style.pointerEvents='';el.textContent='';}
  }, 10000);
}

async function undoDeleteRun(){
  if(!_pendingDeleteRun) return;
  clearTimeout(_deleteUndoTimer);
  await set(ref(db,`runs/${_pendingDeleteRun.key}`), _pendingDeleteRun.data);
  _pendingDeleteRun=null;
  crossRunCache=null;
  renderPastRunsPanel();
  toast('Run restored');
}

// ── Cross-run stats ────────────────────────────────────────────────────────
async function fetchCrossRunStats(forceRefresh){
  if(crossRunCache&&!forceRefresh) return crossRunCache;
  if(crossRunFetching) return crossRunCache;
  crossRunFetching=true;
  try{
    const snap=await get(ref(db,'runs'));
    const runs=snap.val()||{};
    const stats={};
    Object.values(runs).forEach(run=>{
      Object.values(run.auctions||{}).filter(a=>a.status==='sold').forEach(a=>{
        const bids=Object.values(a.bids||{}).sort((x,y)=>y.amount-x.amount);
        if(!bids[0])return;
        const winner=bids[0].bidder;
        if(!stats[winner])stats[winner]={totalSpent:0,itemsWon:0,items:[],runs:new Set()};
        stats[winner].totalSpent+=(a.currentBid||0);
        stats[winner].itemsWon++;
        stats[winner].items.push({name:a.name,price:a.currentBid,quality:a.quality||'common',itemId:a.itemId||null});
        if(run.createdAt) stats[winner].runs.add(run.createdAt);
      });
    });
    // Convert Set to count
    Object.values(stats).forEach(s=>{ s.runCount=s.runs.size; delete s.runs; });
    crossRunCache=stats;
    return stats;
  }catch(e){return crossRunCache||null;}
  finally{crossRunFetching=false;}
}

function showMemberTooltipFixed(event, memberName){

  const existing=document.querySelector('.member-tooltip');

  document.querySelectorAll('.member-tooltip').forEach(t=>t.remove());

  tip.dataset.member=memberName;

  const x=Math.min(event.clientX+16, window.innerWidth-300);
  const y=Math.min(event.clientY-10, window.innerHeight-260);
  tip.style.left=x+'px';
  tip.style.top=y+'px';
  tip.addEventListener('mouseenter',()=>{ _tipActive=true; clearTimeout(_tipHideTimer); });

  document.body.appendChild(tip);
  _loadTipContent(tip, memberName);
}

async function _loadTipContent(tip, memberName){
  const stats=await fetchCrossRunStats();
  if(!document.body.contains(tip)) return;
  if(!stats||!stats[memberName]){
    tip.innerHTML='<div style="color:var(--text-muted);font-size:.78rem;">No purchase history yet</div>';
    return;
  }
  const s=stats[memberName];
  const currentSpend=auctionList().filter(a=>a.status==='sold').reduce((sum,a)=>{
    const bids=Object.values(a.bids||{}).sort((x,y)=>y.amount-x.amount);
    return sum+(bids[0]?.bidder===memberName?a.currentBid:0);
  },0);
  const topItems=[...s.items].sort((a,b)=>b.price-a.price).slice(0,3);
  if(!document.body.contains(tip)) return;
  tip.innerHTML=`
    <div style="font-family:'Cinzel',serif;font-size:.78rem;color:var(--gold);margin-bottom:.4rem;border-bottom:1px solid var(--border-gold);padding-bottom:.3rem;display:flex;align-items:center;justify-content:space-between;">
      <span>${memberName}</span>
      <button onclick="crossRunCache=null;document.querySelectorAll('.member-tooltip').forEach(t=>t.remove());" style="background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:.65rem;padding:0;" title="Refresh stats">↻</button>
    </div>
    <div style="font-size:.72rem;color:var(--text-muted);margin-bottom:.15rem;">All-time (${s.runCount||'?'} run${s.runCount!==1?'s':''})</div>
    <div style="font-family:'Cinzel',serif;font-size:.95rem;color:var(--gold-light);">${s.totalSpent.toLocaleString()}g</div>
    <div style="font-size:.72rem;color:var(--text-muted);">${s.itemsWon} item${s.itemsWon!==1?'s':''} won</div>
    ${currentSpend?`<div style="font-size:.75rem;color:var(--amber);margin-top:.35rem;padding-top:.35rem;border-top:1px solid var(--border-gold);">This run: ${currentSpend.toLocaleString()}g</div>`:''}
    ${topItems.length?`<div style="margin-top:.35rem;font-size:.68rem;color:var(--text-muted);padding-top:.35rem;border-top:1px solid var(--border-gold);">Top wins:</div>${topItems.map(i=>`<div style="font-size:.73rem;" class="item-name ${i.quality}">${i.itemId?`<a href="https://www.wowhead.com/tbc/item=${i.itemId}" data-wowhead="item=${i.itemId}&domain=tbc" class="item-name ${i.quality}" style="font-size:.73rem;text-decoration:none;">${i.name}</a>`:i.name} <span style="color:var(--text-muted);">${i.price.toLocaleString()}g</span></div>`).join('')}`:''}`;
  if(window.$WowheadPower) window.$WowheadPower.refreshLinks();
}

function _scheduleHideTip(){
  _tipActive=false;
  clearTimeout(_tipHideTimer);
  _tipHideTimer=setTimeout(()=>{
    if(_tipActive) return;
    // Check if mouse is currently over the tooltip
    const tip=document.querySelector('.member-tooltip');
    if(tip){
      const r=tip.getBoundingClientRect();
      if(_mouseX>=r.left&&_mouseX<=r.right&&_mouseY>=r.top&&_mouseY<=r.bottom){
        _tipActive=true; return;
      }
    }
    document.querySelectorAll('.member-tooltip').forEach(t=>t.remove());
  }, 200);
}

let _dragId=null,_dragEl=null;
function dragStart(e,id){
  _dragId=id;
  _dragEl=e.currentTarget;
  e.dataTransfer.effectAllowed='move';
  try{e.dataTransfer.setData('text/plain',id);}catch(_){}
  // Lifted look on the dragged card
  setTimeout(()=>{if(_dragEl)_dragEl.classList.add('dragging');},0);
}
function dragOver(e){
  e.preventDefault();
  e.dataTransfer.dropEffect='move';
  const target=e.currentTarget;
  if(!target||target===_dragEl)return;
  // Decide whether to insert before or after based on cursor position
  const rect=target.getBoundingClientRect();
  const horizontal=rect.width>rect.height; // grid rows are horizontal
  const before=horizontal
    ? (e.clientX < rect.left+rect.width/2)
    : (e.clientY < rect.top+rect.height/2);
  // Clear other indicators
  document.querySelectorAll('.drop-before,.drop-after').forEach(el=>{
    if(el!==target)el.classList.remove('drop-before','drop-after');
  });
  target.classList.toggle('drop-before',before);
  target.classList.toggle('drop-after',!before);
}
function dragLeave(e){
  // Only clear if actually leaving the element (not entering a child)
  if(e.currentTarget.contains(e.relatedTarget))return;
  e.currentTarget.classList.remove('drop-before','drop-after');
}
function dragDrop(e,targetId){
  e.preventDefault();
  const target=e.currentTarget;
  const insertAfter=target&&target.classList.contains('drop-after');
  document.querySelectorAll('.drop-before,.drop-after').forEach(el=>el.classList.remove('drop-before','drop-after'));
  if(!_dragId||_dragId===targetId)return;
  const queued=auctionList().filter(a=>a.status==='queued').sort((a,b)=>(a.order??99999)-(b.order??99999));
  const ids=queued.map(a=>a.id);
  const fromIdx=ids.indexOf(_dragId);
  let toIdx=ids.indexOf(targetId);
  if(fromIdx===-1||toIdx===-1)return;
  ids.splice(fromIdx,1);
  // Recompute target index after removal
  toIdx=ids.indexOf(targetId);
  if(insertAfter)toIdx+=1;
  ids.splice(toIdx,0,_dragId);
  const updates={};
  ids.forEach((id,i)=>{updates[`auctions/${id}/order`]=i;});
  update(runRef(),updates);
}
function dragEnd(e){
  if(_dragEl)_dragEl.classList.remove('dragging');
  document.querySelectorAll('.drop-before,.drop-after').forEach(el=>el.classList.remove('drop-before','drop-after'));
  _dragId=null;_dragEl=null;
}

// ── Swipe gestures ────────────────────────────────────────────────────────
(function(){
  let tx=0, ty=0;
  document.addEventListener('touchstart', e=>{
    tx=e.touches[0].clientX;
    ty=e.touches[0].clientY;
  }, {passive:true});

  document.addEventListener('touchend', e=>{
    const dx=e.changedTouches[0].clientX - tx;
    const dy=e.changedTouches[0].clientY - ty;
    const adx=Math.abs(dx), ady=Math.abs(dy);

    // Horizontal swipes
    if(adx > ady && adx >= 40){
      if(dx < 0 && !sidebarCollapsed) toggleMembersSidebar();
      if(dx > 0 && tx < 30 && sidebarCollapsed) toggleMembersSidebar();
      if(dx < 0 && tx > window.innerWidth - 30 && !panelOpen) togglePanel();
      if(dx > 0 && panelOpen) togglePanel();
    }

    // Vertical swipes — chat box
    if(ady > adx && ady >= 40){
      const chatBox=document.getElementById('chat-box');
      const nearBottom=ty > window.innerHeight - 120;
      if(dy > 0 && !chatCollapsed && chatBox && chatBox.contains(e.target)) toggleChat();
      if(dy < 0 && chatCollapsed && nearBottom) toggleChat();
    }
  }, {passive:true});
})();

// Scroll wheel on number inputs without requiring focus first
document.addEventListener('wheel',e=>{
  const el=e.target.closest('input[type="number"]');
  if(!el)return;
  e.preventDefault();
  const step=parseFloat(el.step)||1;
  const min=el.min!==''?parseFloat(el.min):-Infinity;
  const max=el.max!==''?parseFloat(el.max):Infinity;
  const curr=parseFloat(el.value)||0;
  const next=e.deltaY<0?Math.min(max,curr+step):Math.max(min,curr-step);
  el.value=next;
  el.dispatchEvent(new Event('input',{bubbles:true}));
  el.dispatchEvent(new Event('change',{bubbles:true}));
},{passive:false});
