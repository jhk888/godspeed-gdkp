<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Godspeed GDKP</title>
<link rel="icon" type="image/x-icon" href="./favicon.ico" />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
<script src="https://wow.zamimg.com/widgets/power.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --gold:#d4a93c;--gold-light:#f0cc6a;--gold-dim:#8a6830;
    --bg-deep:#0e0c09;--bg-panel:#1a1610;--bg-card:#221d14;--bg-input:#161208;
    --border-gold:rgba(212,169,60,0.35);--border-gold-strong:rgba(212,169,60,0.65);
    --text-bright:#f8f0d8;--text-muted:#a89060;
    --epic:#b44aff;--rare:#2288ff;--uncommon:#44ff44;--common:#ffffff;--poor:#aaaaaa;
    --red:#ff6060;--green:#60cc80;--amber:#f0a830;
  }
  html{font-size:20px;}
  body{background:var(--bg-deep);font-family:'Inter',sans-serif;color:var(--text-bright);min-height:100vh;}

  /* Background image */
  body::before{
    content:'';
    position:fixed;inset:0;
    background:url('./tbc.jpg') center center / cover no-repeat;
    filter:brightness(0.28) saturate(0.8);
    z-index:-1;
  }

  #app{min-height:100vh;display:flex;flex-direction:column;}
  .hdr{border-bottom:1px solid var(--border-gold);padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;background:rgba(10,8,5,0.88);backdrop-filter:blur(6px);position:relative;}
  .logo-center{position:absolute;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none;}
  .logo-center .logo-sub{pointer-events:auto;}
  .logo{font-family:'Cinzel',serif;font-size:1.6rem;font-weight:600;color:var(--gold);letter-spacing:.1em;}
  .logo-sub{font-family:'Cinzel',serif;font-size:.75rem;letter-spacing:.25em;color:var(--text-muted);text-transform:uppercase;margin-top:.1rem;}
  .rl-badge{font-family:'Cinzel',serif;font-size:.75rem;letter-spacing:.1em;background:rgba(212,169,60,0.18);color:var(--gold);border:1px solid var(--border-gold-strong);padding:.25rem .65rem;border-radius:2px;margin-right:.5rem;}
  .usr-chip{font-family:'Cinzel',serif;font-size:.85rem;letter-spacing:.05em;color:var(--gold-light);background:rgba(212,169,60,0.1);border:1px solid var(--border-gold);padding:.3rem .8rem;border-radius:3px;}
  .conn-dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:.4rem;background:var(--green);}
  .members-sidebar{position:fixed;left:0;top:0;height:100vh;width:200px;background:rgba(14,12,9,0.97);border-right:1px solid var(--border-gold);z-index:90;display:flex;flex-direction:column;transition:transform .25s;backdrop-filter:blur(8px);}
  .members-sidebar.collapsed{transform:translateX(-200px);}
  .members-sidebar-hdr{padding:.75rem .75rem .5rem;border-bottom:1px solid var(--border-gold);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
  .members-sidebar-title{font-family:'Cinzel',serif;font-size:.65rem;letter-spacing:.12em;color:var(--text-muted);text-transform:uppercase;}
  .members-sidebar-toggle{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:.8rem;padding:.1rem .3rem;}
  .members-sidebar-toggle:hover{color:var(--gold);}
  .members-sidebar-body{flex:1;overflow-y:auto;padding:.5rem .5rem;}
  .member-row{display:flex;align-items:center;gap:.5rem;padding:.35rem .4rem;border-radius:3px;cursor:pointer;transition:background .1s;position:relative;}
  .member-row:hover{background:rgba(201,168,76,0.07);}
  .member-row-avatar{width:28px;height:28px;border-radius:50%;flex-shrink:0;object-fit:cover;border:1px solid var(--border-gold);}
  .member-row-placeholder{width:28px;height:28px;border-radius:50%;flex-shrink:0;background:var(--bg-input);border:1px solid var(--border-gold);display:flex;align-items:center;justify-content:center;font-size:.7rem;color:var(--text-muted);}
  .member-row-info{flex:1;min-width:0;}
  .member-row-name{font-family:'Cinzel',serif;font-size:.7rem;color:var(--gold-light);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .member-row-spend{font-size:.65rem;color:var(--text-muted);}
  .sidebar-toggle-tab{position:fixed;left:200px;top:50%;transform:translateY(-50%);background:rgba(14,12,9,0.97);border:1px solid var(--border-gold);border-left:none;border-radius:0 4px 4px 0;padding:.6rem .4rem;cursor:pointer;z-index:91;color:var(--text-muted);transition:left .25s;display:flex;flex-direction:column;align-items:center;gap:.4rem;}
  .sidebar-toggle-tab:hover{color:var(--gold);border-color:var(--gold);}
  .sidebar-toggle-tab.collapsed{left:0px;}
  .main{flex:1;padding:1.5rem 2rem;max-width:1600px;margin:0 auto;width:100%;transition:padding-left .25s;}
  .member-chip{display:none;}
  .member-avatar{width:24px;height:24px;border-radius:50%;object-fit:cover;border:1px solid var(--border-gold);}
  .member-avatar-placeholder{width:24px;height:24px;border-radius:50%;background:var(--bg-input);border:1px solid var(--border-gold);display:flex;align-items:center;justify-content:center;font-size:.65rem;color:var(--text-muted);}
  .member-name{font-family:'Cinzel',serif;font-size:.65rem;color:var(--gold-light);letter-spacing:.04em;}
  .discord-btn{display:flex;align-items:center;gap:.5rem;background:#5865F2;color:#fff;border:none;border-radius:4px;padding:.55rem 1rem;font-family:'Cinzel',serif;font-size:.75rem;letter-spacing:.06em;cursor:pointer;transition:background .15s;}
  .discord-btn:hover{background:#4752c4;}
  .discord-btn img{width:18px;height:18px;}

  .banned-row{display:flex;align-items:center;gap:.5rem;padding:.4rem 0;border-bottom:1px solid rgba(201,168,76,0.08);}
  .banned-name{flex:1;font-size:.85rem;color:var(--text-muted);}
  .banned-label{font-size:.7rem;color:var(--red);font-family:'Cinzel',serif;letter-spacing:.05em;}
  .audit-row{display:flex;gap:.75rem;padding:.35rem 0;border-bottom:1px solid rgba(201,168,76,0.08);font-size:.82rem;}
  .audit-time{color:var(--text-muted);font-size:.75rem;white-space:nowrap;min-width:55px;}
  .audit-msg{color:var(--text-bright);}
  .audit-discord{color:#5865F2;font-size:.72rem;}
  .btn{font-family:'Cinzel',serif;font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;border-radius:3px;padding:.6rem 1.2rem;transition:all .15s;}
  .btn-gold{background:var(--gold);color:var(--bg-deep);border:1px solid var(--gold);font-weight:600;}
  .btn-gold:hover{background:var(--gold-light);}
  .btn-outline{background:transparent;color:var(--gold);border:1px solid var(--border-gold-strong);}
  .btn-outline:hover{border-color:var(--gold);background:rgba(212,169,60,0.09);}
  .btn-green{background:transparent;color:var(--green);border:1px solid rgba(96,204,128,0.45);}
  .btn-green:hover{background:rgba(96,204,128,0.12);border-color:var(--green);}
  .btn-amber{background:#b87010;color:#fff;border:2px solid #e8900a;font-weight:600;letter-spacing:.1em;}
  .btn-amber:hover{background:#d08318;border-color:#f0a020;}
  .btn-amber-resume{background:#1a6b30;color:#fff;border:2px solid #28a048;font-weight:600;letter-spacing:.1em;}
  .btn-amber-resume:hover{background:#236b33;border-color:#40ff66;}
  .qb-custom{background:#1a5c2a !important;color:#6aff8a !important;border:1px solid #2ecc52 !important;border-style:solid !important;font-weight:600;}
  .qb-custom:hover{background:#236b33 !important;border-color:#40ff66 !important;}
  .qb-custom.active-custom{background:#0e3d1c !important;color:#4dff70 !important;border-color:#28cc44 !important;}
  .btn-sm{padding:.38rem .8rem;font-size:.76rem;}
  .btn-danger{background:transparent;color:var(--red);border:1px solid rgba(255,96,96,0.35);font-size:.76rem;}
  .btn-danger:hover{background:rgba(255,96,96,0.12);border-color:var(--red);}
  .main{flex:1;padding:1.5rem 2rem;max-width:1600px;margin:0 auto;width:100%;}
  input[type=text],input[type=number],input[type=password]{width:100%;background:var(--bg-input);border:1px solid var(--border-gold);color:var(--text-bright);padding:.6rem .8rem;font-family:'Inter',sans-serif;font-size:1rem;border-radius:3px;outline:none;transition:border-color .2s;}
  input[type=text]:focus,input[type=number]:focus,input[type=password]:focus{border-color:var(--gold);}
  .lbl{font-family:'Cinzel',serif;font-size:.75rem;letter-spacing:.1em;color:var(--text-muted);text-transform:uppercase;margin-bottom:.3rem;}
  .fg{display:flex;flex-direction:column;gap:.3rem;position:relative;}
  .login-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;gap:1.75rem;}
  .login-brand .wordmark{font-family:'Cinzel',serif;font-size:3rem;font-weight:600;color:var(--gold);letter-spacing:.15em;text-align:center;text-shadow:0 0 40px rgba(212,169,60,0.5);}
  .login-brand .wordmark-sub{font-family:'Cinzel',serif;font-size:.85rem;letter-spacing:.35em;color:var(--text-muted);margin-top:.3rem;text-align:center;}
  .login-box{background:rgba(22,19,12,0.96);border:1px solid var(--border-gold);padding:2.25rem 2.5rem;border-radius:4px;width:100%;max-width:400px;display:flex;flex-direction:column;gap:1rem;backdrop-filter:blur(10px);}
  .pot-bar{background:rgba(30,26,16,0.92);border:1px solid var(--border-gold);border-radius:4px;padding:1.1rem 1.5rem;display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;gap:1rem;flex-wrap:wrap;backdrop-filter:blur(4px);text-align:center;}
  .pot-val{font-family:'Cinzel',serif;font-size:2rem;color:var(--gold);font-weight:600;}
  .pot-lbl{font-family:'Cinzel',serif;font-size:.78rem;color:var(--text-muted);letter-spacing:.1em;text-transform:uppercase;}
  .settings-bar{background:rgba(30,26,16,0.92);border:1px solid var(--border-gold);border-radius:4px;padding:.9rem 1.5rem;display:flex;align-items:center;gap:1.75rem;margin-bottom:1.5rem;flex-wrap:wrap;backdrop-filter:blur(4px);}
  .settings-bar input{width:100px;}
  .tabs{display:flex;border-bottom:1px solid var(--border-gold);margin-bottom:1.5rem;}
  .tab{font-family:'Cinzel',serif;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;padding:.7rem 1.4rem;cursor:pointer;color:var(--text-muted);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s;}
  .tab:hover{color:var(--text-bright);}
  .tab.active{color:var(--gold);border-bottom-color:var(--gold);}
  .sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.2rem;flex-wrap:wrap;gap:.5rem;}
  @media(max-width:600px){
    html{font-size:14px;}
    .main{padding:.75rem;}
    .hdr{padding:.5rem .75rem;flex-wrap:nowrap;gap:.3rem;}
    .hdr>div:first-child{width:0;display:none;}
    .logo{font-size:1rem;}
    .logo-sub{display:none;}
    .rl-badge{display:none;}
    .usr-chip{font-size:.65rem;padding:.2rem .45rem;}
    .btn-sm{padding:.25rem .45rem;font-size:.6rem;}
    .grid{grid-template-columns:1fr;}
    .pot-bar{flex-direction:column;text-align:center;gap:.6rem;}
    .tabs{overflow-x:auto;-webkit-overflow-scrolling:touch;}
    .tab{padding:.45rem .6rem;font-size:.62rem;white-space:nowrap;}
    .modal{width:calc(100vw - 1.5rem);max-width:100%;padding:1rem;}
    .three-col{grid-template-columns:1fr;}
    .rl-controls{flex-wrap:wrap;}
    .side-panel{width:100vw;right:-100vw;}
    .sec-hdr{position:sticky;top:0;background:rgba(14,12,9,0.95);z-index:10;padding:.4rem 0;backdrop-filter:blur(4px);}
    .fab{display:flex;}
    .chat-box{right:4px;width:calc(100vw - 8px);}
    .members-sidebar{width:150px;}
    .sidebar-toggle-tab{left:150px;}
    .sidebar-toggle-tab.collapsed{left:0;}
    body.sidebar-open .main{padding-left:166px;}
    .hdr-user-inner{flex-wrap:wrap;gap:.3rem;}
  }
  .fab{position:fixed;bottom:1.5rem;right:1.5rem;z-index:40;display:none;align-items:center;justify-content:center;width:56px;height:56px;border-radius:50%;background:var(--gold);color:var(--bg-deep);font-size:1.6rem;font-weight:700;border:none;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,0.5);}
  .sec-title{font-family:'Cinzel',serif;font-size:1.15rem;color:var(--gold);letter-spacing:.08em;font-weight:500;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1.2rem;margin-bottom:1.75rem;}
  .card{background:rgba(30,26,16,0.93);border:1px solid var(--border-gold);border-radius:5px;padding:1.2rem 1.3rem;display:flex;flex-direction:column;gap:.7rem;position:relative;transition:border-color .2s,box-shadow .2s;backdrop-filter:blur(4px);}
  .card:hover{border-color:var(--border-gold-strong);}
  .card.leading{border-color:rgba(212,169,60,0.7);}
  .card.expiring{border-color:rgba(255,96,96,0.6);}
  .card.queued{border-color:rgba(212,169,60,0.18);opacity:.88;}
  .card.paused{border-color:rgba(240,168,48,0.55);}
  .card.quality-epic{border-color:rgba(180,74,255,0.5);box-shadow:0 0 12px rgba(180,74,255,0.18);}
  .card.quality-legendary{border-color:rgba(255,128,0,0.6);box-shadow:0 0 16px rgba(255,128,0,0.22);}
  [draggable=true]:active{cursor:grabbing;}
  .chat-box{position:fixed;bottom:0;right:12px;width:340px;max-width:calc(100vw - 24px);background:rgba(14,12,9,0.97);border:1px solid var(--border-gold);border-bottom:none;border-radius:4px 4px 0 0;z-index:95;display:flex;flex-direction:column;transition:height .2s;height:360px;backdrop-filter:blur(8px);}
  .chat-input-row{padding:.4rem .5rem;border-top:1px solid var(--border-gold);display:flex;gap:.35rem;flex-shrink:0;overflow:hidden;}
  .chat-tabs{display:flex;border-bottom:1px solid var(--border-gold);overflow-x:auto;flex-shrink:0;scrollbar-width:none;}
  .chat-tabs::-webkit-scrollbar{display:none;}
  .chat-tab{font-family:'Cinzel',serif;font-size:.58rem;letter-spacing:.07em;text-transform:uppercase;padding:.35rem .6rem;cursor:pointer;color:var(--text-muted);border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:.3rem;flex-shrink:0;}
  .chat-tab.active{color:var(--gold);border-bottom-color:var(--gold);}
  .chat-tab:hover{color:var(--text-bright);}
  .chat-tab-close{color:var(--text-muted);font-size:.65rem;padding:.1rem .2rem;background:none;border:none;cursor:pointer;opacity:.5;}
  .chat-tab-close:hover{opacity:1;color:var(--red);}
  .chat-tab-unread{background:var(--red);color:#fff;border-radius:50%;width:14px;height:14px;font-size:.55rem;display:inline-flex;align-items:center;justify-content:center;}
  .chat-box.collapsed{height:36px;}
  .chat-hdr{padding:.45rem .75rem;border-bottom:1px solid var(--border-gold);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;cursor:pointer;user-select:none;}
  .chat-hdr-title{font-family:'Cinzel',serif;font-size:.65rem;letter-spacing:.1em;color:var(--text-muted);text-transform:uppercase;}
  .chat-messages{flex:1;overflow-y:auto;padding:.5rem .6rem;display:flex;flex-direction:column;gap:.3rem;}
  .chat-msg{display:flex;flex-direction:column;gap:.1rem;padding:.25rem .35rem;border-radius:3px;position:relative;}
  .chat-msg:hover{background:rgba(201,168,76,0.05);}
  .chat-msg.mine{background:rgba(201,168,76,0.06);}
  .chat-msg-header{display:flex;align-items:center;gap:.35rem;}
  .chat-msg-avatar{width:16px;height:16px;border-radius:50%;object-fit:cover;flex-shrink:0;}
  .chat-msg-name{font-family:'Cinzel',serif;font-size:.62rem;color:var(--gold-light);}
  .chat-msg-name.rl{color:var(--gold);}
  .chat-msg-time{font-size:.58rem;color:var(--text-muted);margin-left:auto;}
  .chat-msg-text{font-size:.82rem;color:var(--text-bright);padding-left:21px;line-height:1.3;}
  .chat-delete{position:absolute;right:.3rem;top:.3rem;background:none;border:none;color:var(--red);cursor:pointer;font-size:.65rem;opacity:0;padding:.1rem .25rem;}
  .chat-msg:hover .chat-delete{opacity:.6;}
  .chat-delete:hover{opacity:1 !important;}
  .chat-input-row{padding:.4rem .5rem;border-top:1px solid var(--border-gold);display:flex;gap:.35rem;flex-shrink:0;}
  .chat-input{flex:1;background:var(--bg-input);border:1px solid var(--border-gold);color:var(--text-bright);padding:.35rem .5rem;font-family:'Inter',sans-serif;font-size:.82rem;border-radius:3px;outline:none;}
  .chat-input:focus{border-color:var(--gold);}
  .chat-send{font-family:'Cinzel',serif;font-size:.6rem;letter-spacing:.06em;cursor:pointer;border-radius:3px;padding:.35rem .6rem;background:var(--gold);color:var(--bg-deep);border:none;}
  .chat-unread{background:var(--red);color:#fff;border-radius:50%;width:16px;height:16px;font-size:.6rem;display:inline-flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;}
  .category-badge{font-family:'Cinzel',serif;font-size:.58rem;letter-spacing:.08em;text-transform:uppercase;padding:.15rem .4rem;border-radius:2px;display:inline-block;}
  .cat-tier{background:rgba(255,180,0,0.15);color:#ffcc44;border:1px solid rgba(255,180,0,0.4);}
  .cat-physical{background:rgba(226,96,96,0.15);color:#ff8080;border:1px solid rgba(226,96,96,0.35);}
  .cat-caster{background:rgba(50,150,255,0.15);color:#80c0ff;border:1px solid rgba(50,150,255,0.35);}
  .cat-other{background:rgba(201,168,76,0.1);color:var(--text-muted);border:1px solid var(--border-gold);}
  .cat-filter-bar{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1rem;}
  .cat-filter-btn{font-family:'Cinzel',serif;font-size:.65rem;letter-spacing:.07em;text-transform:uppercase;padding:.3rem .75rem;border-radius:3px;cursor:pointer;transition:all .15s;}
  .cat-filter-btn.active{background:var(--gold);color:var(--bg-deep);border:1px solid var(--gold);}
  .cat-filter-btn.inactive{background:transparent;color:var(--text-muted);border:1px solid var(--border-gold);}
  .member-tooltip{position:fixed;background:#1a1612;border:1px solid var(--border-gold-strong);border-radius:4px;padding:.65rem .85rem;z-index:1000;min-width:220px;max-width:280px;box-shadow:0 4px 20px rgba(0,0,0,0.85);pointer-events:none;}
  .member-chip{position:relative;}
  .raid-title-display{font-family:'Cinzel',serif;font-size:.85rem;color:var(--text-muted);letter-spacing:.08em;margin-top:.1rem;cursor:pointer;}
  .raid-title-input{font-family:'Cinzel',serif;font-size:.85rem;color:var(--gold);background:transparent;border:none;border-bottom:1px solid var(--border-gold);outline:none;width:200px;letter-spacing:.08em;}
  .item-header{display:flex;align-items:center;gap:.75rem;padding-right:5rem;}
  .item-icon{width:48px;height:48px;border-radius:4px;border:1px solid rgba(212,169,60,0.35);flex-shrink:0;object-fit:cover;}
  .item-icon-placeholder{width:48px;height:48px;border-radius:4px;border:1px solid rgba(212,169,60,0.2);background:var(--bg-input);flex-shrink:0;}
  .item-name{font-family:'Cinzel',serif;font-size:1.05rem;font-weight:500;}
  .item-name.epic{color:var(--epic);}
  .item-name.rare{color:var(--rare);}
  .item-name.uncommon{color:var(--uncommon);}
  .item-name.common{color:var(--common);}
  .item-name.poor{color:var(--poor);}
  .item-name.legendary{color:#ff8000;}
  .item-slot{font-size:.9rem;color:var(--text-muted);}
  .bid-section{border-top:1px solid rgba(212,169,60,0.15);padding-top:.7rem;display:flex;flex-direction:column;gap:.55rem;}
  .bid-amt{font-family:'Cinzel',serif;font-size:1.3rem;color:var(--gold-light);font-weight:500;}
  .bid-ldr{font-size:.88rem;color:var(--text-muted);}
  .bid-ldr.you{color:var(--green);}
  .min-bid-note{font-size:.85rem;color:var(--text-muted);}
  .quick-bids{display:flex;gap:.45rem;flex-wrap:wrap;}
  .qb{font-family:'Cinzel',serif;font-size:.75rem;letter-spacing:.05em;cursor:pointer;border-radius:3px;padding:.35rem .7rem;background:rgba(212,169,60,0.1);border:1px solid var(--border-gold);color:var(--gold-light);transition:all .15s;}
  .qb:hover{background:rgba(212,169,60,0.22);border-color:var(--gold);}
  .qb-custom{background:rgba(212,169,60,0.05);color:var(--text-muted);border-style:dashed;}
  .qb-custom.active-custom{background:rgba(212,169,60,0.15);border-color:var(--gold);color:var(--gold);border-style:solid;}
  .custom-bid-row{display:flex;gap:.45rem;align-items:center;}
  .custom-bid-row input{flex:1;padding:.45rem .6rem;font-size:1rem;}
  .badge{font-family:'Cinzel',serif;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;padding:.22rem .55rem;border-radius:2px;position:absolute;top:.85rem;right:.85rem;}
  .badge-open{background:rgba(96,204,128,0.18);color:var(--green);border:1px solid rgba(96,204,128,0.4);}
  .badge-sold{background:rgba(212,169,60,0.12);color:var(--gold-dim);border:1px solid var(--border-gold);}

function fmtTime(s){if(s==null||s<0)return'0s';if(s>=60)return Math.floor(s/60)+'m '+(s%60).toString().padStart(2,'0')+'s';return s+'s';}

// Raider loot summary
function getRaiderLoot(name){
  const won=[];
  auctionList().filter(a=>a.status==='sold').forEach(a=>{
    const bids=Object.values(a.bids||{}).sort((x,y)=>y.amount-x.amount);
    if(bids[0]&&bids[0].bidder===name){
      won.push({name:a.name,price:a.currentBid,icon:a.itemIcon||null,quality:a.quality||'common',itemId:a.itemId||null,paid:a.paid||false});
    }
  });
  return won;
}

function getAllRaiderLoot(){
  const map={};
  auctionList().filter(a=>a.status==='sold').forEach(a=>{
    const bids=Object.values(a.bids||{}).sort((x,y)=>y.amount-x.amount);
    if(!bids[0])return;
    const winner=bids[0].bidder;
    if(!map[winner])map[winner]=[];
    map[winner].push({auctionId:a.id,name:a.name,price:a.currentBid,icon:a.itemIcon||null,quality:a.quality||'common',itemId:a.itemId||null,paid:a.paid||false});
  });
  return map;
}

// ── Search ────────────────────────────────────────────────────────────────
async function searchWowhead(query){
  if(!query||query.length<2){searchResults=[];isSearching=false;refreshDropdown();return;}
  isSearching=true;refreshDropdown();
  try{
    const res=await fetch(`${SEARCH_WORKER_URL}?q=${encodeURIComponent(query)}`);
    if(!res.ok)throw new Error('Worker '+res.status);
    searchResults=await res.json();
  }catch(e){searchResults=[];}
  isSearching=false;refreshDropdown();
}

function refreshDropdown(){
  const dd=document.getElementById('item-dropdown');if(!dd)return;
  if(isSearching){dd.innerHTML='<div class="dropdown-status">Searching...</div>';dd.style.display='block';return;}
  if(!searchResults.length&&searchQuery.length>=2){dd.innerHTML='<div class="dropdown-status">No items found</div>';dd.style.display='block';return;}
  if(!searchResults.length){dd.style.display='none';return;}
  dd.innerHTML=searchResults.map(item=>`
    <div class="dropdown-item" onclick="selectItem(${item.id})">
      ${item.icon?`<img src="${iconUrl(item.icon)}" onerror="this.style.display='none'" />`:'<div class="dropdown-item-icon-placeholder"></div>'}
      <a class="dropdown-item-name ${item.quality||'common'}" href="https://www.wowhead.com/tbc/item=${item.id}" data-wowhead="item=${item.id}&domain=tbc" onclick="return false;">${item.name}</a>
      <span class="dropdown-item-sub">${item.slot||''}</span>
    </div>`).join('');
  dd.style.display='block';
  if(window.$WowheadPower) window.$WowheadPower.refreshLinks();
}

function selectItem(id){
  const item=searchResults.find(r=>r.id===id);if(!item)return;
  selectedItem=item;modalQuality=item.quality==='legendary'?'epic':item.quality||'epic';
  searchQuery=item.name;searchResults=[];
  const inp=document.getElementById('item-search-input');if(inp)inp.value=item.name;
  const dd=document.getElementById('item-dropdown');if(dd)dd.style.display='none';
  const slotInp=document.getElementById('m-slot');if(slotInp&&item.slot)slotInp.value=item.slot;
  renderSearchPreview();
  ['epic','rare','uncommon'].forEach(x=>{
    const b=document.getElementById('q-'+x);if(!b)return;
    const s=x===modalQuality?Q_STYLES[x].on:Q_STYLES[x].off;
    b.setAttribute('style',s+"font-family:'Cinzel',serif;font-size:.7rem;letter-spacing:.06em;font-weight:"+(x===modalQuality?'600':'400')+';');
  });
}

function renderSearchPreview(){
  const wrap=document.getElementById('search-preview-wrap');if(!wrap)return;
  if(!selectedItem){wrap.innerHTML='';return;}
  wrap.innerHTML=`<div class="search-preview">
    ${selectedItem.icon?`<img src="${iconUrl(selectedItem.icon)}" onerror="this.style.display='none'" />`:''}
    <a class="search-preview-name ${selectedItem.quality||'common'}" href="https://www.wowhead.com/tbc/item=${selectedItem.id}" data-wowhead="item=${selectedItem.id}&domain=tbc" onclick="return false;">${selectedItem.name}</a>

// ── Tick ──────────────────────────────────────────────────────────────────
function startTick(){
  if(tickInterval)clearInterval(tickInterval);
  tickInterval=setInterval(()=>{
    const now=Date.now();
    auctionList().forEach(a=>{
      if(a.status!=='open'||a.paused||!a.endsAt)return;
      const r=Math.max(0,Math.floor((a.endsAt-now)/1000));
      const pct=Math.round((r/(a.duration||120))*100),urgent=r<=15;
      const fe=document.getElementById('tfill-'+a.id),te=document.getElementById('ttext-'+a.id);
      if(fe){fe.style.width=pct+'%';fe.style.background=urgent?'#e26060':'#c9a84c';}
      if(te){te.textContent=fmtTime(r);te.style.color=urgent?'var(--red)':'var(--text-muted)';}
      if(r===0&&isRL){
        const bids=Object.values(a.bids||{}).sort((x,y)=>y.amount-x.amount);
        if(bids.length>0){
          update(runRef(`/auctions/${a.id}`),{status:'sold',remaining:0});
          toast(a.name+' sold to '+bids[0].bidder+' for '+(a.currentBid||0).toLocaleString()+'g');
        } else {
          update(runRef(`/auctions/${a.id}`),{status:'expired',remaining:0});
          toast(a.name+' expired — no bids placed');
        }
      }
    });
  },1000);
}

let presenceData = {};

function subscribeToRun(){
  if(unsubRun)unsubRun();
  unsubRun=onValue(runRef(),snap=>{
    const data=snap.val()||{};
    auctions=data.auctions||{};
    presenceData=data.presence||{};
    if(data.settings){
      raidSettings={...raidSettings,...data.settings};
      if(data.settings.categories) raidCategories=data.settings.categories;
    }
    if(data.splits&&!splitsLoaded){splits=data.splits;splitsLoaded=true;}
    // Don't re-render if modal is open — would wipe user's typed input
    if(modal) return;
    render();
    if(panelOpen&&panelTab==='raiders')renderPanel();
    if(panelOpen&&panelTab==='audit')renderAuditPanel();
    if(panelOpen&&panelTab==='runs')renderPastRunsPanel();
  });
}

async function getOrCreateRun(){
  const snap=await get(ref(db,'runs'));const runs=snap.val()||{};
  const keys=Object.keys(runs).filter(k=>!runs[k].archived).sort().reverse();
  if(keys.length>0){runId=keys[0];}
  else{const nr=push(ref(db,'runs'));runId=nr.key;await set(nr,{createdAt:Date.now(),settings:raidSettings,auctions:{}});}
  splitsLoaded=false;
  subscribeToRun();startTick();startPresence();subscribeToBans();subscribeToChat();
  // Write audit entry
  const loginType = discordUser ? ` (Discord: ${discordUser.username})` : ' (character name)';
  writeAudit(`${user} joined${loginType}`);
}

function join(){
  const name=document.getElementById('li')?.value?.trim();if(!name)return;
  user=name;isRL=document.getElementById('rlcode')?.value===RAID_LEADER_CODE;
  // Check ban before joining
  if(isBanned({name:user})){handleBanned();return;}
  localStorage.setItem('gdkp_user',user);
  localStorage.setItem('gdkp_isRL',isRL?'1':'0');
  getOrCreateRun();renderHdr();
}
function logout(){
  user=null;isRL=false;discordUser=null;
  localStorage.removeItem('gdkp_user');
  localStorage.removeItem('gdkp_isRL');
  localStorage.removeItem('gdkp_discord');
  if(unsubRun)unsubRun();if(tickInterval)clearInterval(tickInterval);
  clearPresence();panelOpen=false;render();
}

    ${expired.length||isRL?`<div class="tab ${tab==='expired'?'active':''}" onclick="setTab('expired')" style="${expired.length?'color:var(--red);':''}">Expired (${expired.length})</div>`:''}

function renderSplits(){
  const p=pot();

  const totalPct=splits.roles.reduce((s,r)=>s+r.slots.reduce((ss,sl)=>ss+(parseFloat(sl.pct)||0),0),0);
  const sanityOk=Math.abs(totalPct-100)<0.01;

  const roleSections=splits.roles.map((role,ri)=>{
    const rolePct=role.slots.reduce((s,sl)=>s+(parseFloat(sl.pct)||0),0);
    const rolePayout=Math.floor(distributable*(rolePct/100));
    const rows=role.slots.map((sl,si)=>{
      const payout=Math.floor(distributable*((parseFloat(sl.pct)||0)/100));
      return`<tr>
        <td><input type="text" value="${sl.label}" oninput="updateSlot(${ri},${si},'label',this.value)" style="width:80px;" /></td>
        <td><input type="text" value="${sl.player}" oninput="updateSlot(${ri},${si},'player',this.value)" placeholder="Name..." /></td>
        <td><input type="number" value="${sl.pct}" step="0.25" min="0" oninput="updateSlot(${ri},${si},'pct',this.value)" style="width:65px;" /></td>
        <td><div class="payout-cell">${payout.toLocaleString()}g</div></td>
        <td><input type="text" value="${sl.note}" oninput="updateSlot(${ri},${si},'note',this.value)" placeholder="Note..." /></td>
        <td><button class="remove-slot-btn" onclick="removeSlot(${ri},${si})">&#x2715;</button></td>
      </tr>`;
    }).join('');
    return`<div class="role-section">
      <div class="role-hdr">
        <div class="role-title">${role.name}</div>
        <div class="role-summary">${rolePct.toFixed(2)}% &nbsp;|&nbsp; ${rolePayout.toLocaleString()}g</div>
      </div>
      <table class="splits-table">
        <thead><tr><th>Slot</th><th>Name</th><th>%</th><th>Payout</th><th>Note</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <button class="add-slot-btn" onclick="addSlot(${ri})">+ Add Slot</button>
    </div>`;
  }).join('');

  return`<div class="splits-wrap">
    <div class="admin-cut-bar">
      <div style="font-family:'Cinzel',serif;font-size:.65rem;color:var(--text-muted);letter-spacing:.1em;">Admin Cut</div>
      <div class="fg" style="flex-direction:row;align-items:center;gap:.5rem;">
        <input type="number" id="admin-cut-inp" value="${splits.adminCut}" min="0" max="99" step="1" style="width:70px;" oninput="updateAdminCut(this.value)" />
        <span style="font-size:.85rem;color:var(--text-muted);">%</span>
      </div>
      <div style="font-family:'Cinzel',serif;font-size:.85rem;color:var(--gold);">${adminAmt.toLocaleString()}g admin</div>
      <div style="font-family:'Cinzel',serif;font-size:.85rem;color:var(--gold-light);">${distributable.toLocaleString()}g to raiders</div>
      <div style="margin-left:auto;">${sanityOk?`<span class="sanity-ok">&#10003; 100%</span>`:`<span class="sanity-warn">&#9888; ${totalPct.toFixed(2)}% (should be 100%)</span>`}</div>
      <button class="btn btn-outline btn-sm" onclick="saveSplits()">Save</button>
    </div>
    <div class="admin-cut-bar" style="gap:.75rem;">
      <div style="font-family:'Cinzel',serif;font-size:.65rem;color:var(--text-muted);letter-spacing:.1em;white-space:nowrap;">Loot categories</div>
      <input type="text" id="cat-settings-inp" value="${raidCategories.join(', ')}" placeholder="Tier, Physical, Caster/Healer" style="flex:1;" />
      <button class="btn btn-outline btn-sm" onclick="saveCategories()">Save</button>
    </div>
    <div class="splits-summary">
      <div class="splits-stat"><div class="splits-stat-lbl">Total Pot</div><div class="splits-stat-val">${p.toLocaleString()}g</div></div>
      <div class="splits-stat"><div class="splits-stat-lbl">Admin (${splits.adminCut}%)</div><div class="splits-stat-val">${adminAmt.toLocaleString()}g</div></div>
      <div class="splits-stat"><div class="splits-stat-lbl">To Raiders</div><div class="splits-stat-val">${distributable.toLocaleString()}g</div></div>
      <div class="splits-stat"><div class="splits-stat-lbl">Sanity</div><div class="splits-stat-val ${sanityOk?'ok':'warn'}">${totalPct.toFixed(2)}%</div></div>
    </div>

  </div>`;
}

function updateSlot(ri,si,field,val){
  splits.roles[ri].slots[si][field]=field==='pct'?parseFloat(val)||0:val;
  // Re-render splits only
  const wrap=document.querySelector('.splits-wrap');
  if(wrap){wrap.outerHTML=renderSplits();}
  // Actually re-render inline
  renderMain();
}

function updateAdminCut(val){splits.adminCut=Math.max(0,Math.min(99,parseFloat(val)||0));renderMain();}
function addSlot(ri){splits.roles[ri].slots.push({label:'New',player:'',pct:1,note:''});renderMain();}
function removeSlot(ri,si){splits.roles[ri].slots.splice(si,1);renderMain();}
function saveSplits(){update(runRef('/splits'),splits);toast('Splits saved');}

// ── Side Panel ────────────────────────────────────────────────────────────
function setPanelTab(t){
  panelTab=t;
  const rb=document.getElementById('panel-tab-raiders');
  const ab=document.getElementById('panel-tab-audit');
  const xb=document.getElementById('panel-tab-runs');
  if(rb)rb.className='btn '+(t==='raiders'?'btn-gold':'btn-outline')+' btn-sm';
  if(ab)ab.className='btn '+(t==='audit'?'btn-gold':'btn-outline')+' btn-sm';
  if(xb)xb.className='btn '+(t==='runs'?'btn-gold':'btn-outline')+' btn-sm';
  if(t==='raiders')renderPanel();
  else if(t==='audit')renderAuditPanel();
  else if(t==='runs')renderPastRunsPanel();
}

function togglePanel(){
  panelOpen=!panelOpen;
  const panel=document.getElementById('side-panel');
  if(panelOpen){
    panel.classList.add('open');
    if(panelTab==='raiders')renderPanel();
    else renderAuditPanel();
  } else panel.classList.remove('open');
}

function renderPanel(){
  const body=document.getElementById('side-panel-body');if(!body)return;
  const lootMap=getAllRaiderLoot();
  const raiders=Object.keys(lootMap).sort((a,b)=>{
    const totalA=lootMap[a].reduce((s,i)=>s+i.price,0);
    const totalB=lootMap[b].reduce((s,i)=>s+i.price,0);
    return totalB-totalA;
  });
  if(!raiders.length){body.innerHTML='<div style="color:var(--text-muted);font-size:.85rem;text-align:center;padding:2rem 0;">No items sold yet</div>';return;}
  body.innerHTML=raiders.map(name=>{
    const items=lootMap[name];
    const total=items.reduce((s,i)=>s+i.price,0);
    const owed=items.filter(i=>!i.paid).reduce((s,i)=>s+i.price,0);
    const allPaid=owed===0;
    const unpaidIds=items.filter(i=>!i.paid).map(i=>i.auctionId);
    const selectAllBtn=!allPaid?`<button onclick="markAllPaid([${unpaidIds.map(id=>`'${id}'`).join(',')}])" style="font-family:'Cinzel',serif;font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;background:transparent;color:var(--green);border:1px solid rgba(96,204,128,0.4);padding:.2rem .55rem;border-radius:3px;margin-bottom:.35rem;">Mark All Paid</button>`:'';
    const statusLine=allPaid
      ?`<div style="font-size:.75rem;color:var(--green);margin-bottom:.4rem;font-family:'Cinzel',serif;letter-spacing:.05em;">&#10003; Settled</div>`
      :`<div style="font-size:.75rem;color:var(--red);margin-bottom:.4rem;">Owed: ${owed.toLocaleString()}g</div>`;
    const itemRows=items.map(i=>`
      <div class="raider-item" style="gap:.5rem;">
        <input type="checkbox" ${i.paid?'checked':''} onchange="togglePaid('${i.auctionId}')"
          style="width:15px;height:15px;flex-shrink:0;cursor:pointer;accent-color:var(--green);" />
        ${i.icon?`<img src="${iconUrl(i.icon)}" style="width:20px;height:20px;border-radius:2px;flex-shrink:0;" />`:''}
        <span class="raider-item-name item-name ${i.quality}" style="font-size:.78rem;flex:1;">${i.name}</span>
        <span class="raider-item-price" style="${i.paid?'color:var(--text-muted);text-decoration:line-through;':''}">${i.price.toLocaleString()}g</span>
      </div>`).join('');
    return`<div class="raider-row">
      <div class="raider-name" style="margin-bottom:.25rem;"><span>${name}</span><span class="raider-total">${total.toLocaleString()}g total</span></div>
      ${statusLine}${selectAllBtn}
      ${itemRows}
    </div>`;
  }).join('');
}

// ── Reset ─────────────────────────────────────────────────────────────────
function confirmReset(){
  if(!confirm('Archive this run and start a new one?\n\nThe current run will be saved and a fresh run will begin.'))return;
  resetRun();
}

async function resetRun(){
  // Archive current run
  await update(runRef(),{archived:true,archivedAt:Date.now()});
  // Create new run
  const nr=push(ref(db,'runs'));
  runId=nr.key;
  splitsLoaded=false;
  splits=JSON.parse(JSON.stringify(DEFAULT_SPLITS));
  await set(nr,{createdAt:Date.now(),settings:raidSettings,auctions:{}});
  subscribeToRun();
  toast('New run started — previous run archived');
  tab='active';
}

// ── Grids & Cards ─────────────────────────────────────────────────────────
function renderGrid(list,mode){
  if(!list.length){const msgs={open:'No live auctions',queued:'Queue is empty',sold:'No items sold yet',expired:'No expired items'};return`<div class="empty"><div style="font-family:'Cinzel',serif;color:var(--gold-dim);">${msgs[mode]||'Nothing here'}</div></div>`;}
  const draggable=mode==='queued'&&isRL;
  return`<div class="grid">${list.map(a=>`<div ${draggable?`draggable="true" ondragstart="dragStart(event,'${a.id}')" ondragover="dragOver(event)" ondrop="dragDrop(event,'${a.id}')" ondragend="dragEnd(event)"`:''} id="wrap-${a.id}" style="${draggable?'cursor:grab;':''}">${renderCard(a,mode)}</div>`).join('')}</div>`;
}

function renderCard(a,mode){
  const bids=Object.values(a.bids||{}).sort((x,y)=>y.amount-x.amount);
  const top=bids[0]||null,isLeading=top&&top.bidder===user;
  const now=Date.now();
  const rem=a.status==='open'&&!a.paused&&a.endsAt?Math.max(0,Math.floor((a.endsAt-now)/1000)):(a.remaining||0);
  const pct=a.status==='open'?Math.round((rem/(a.duration||120))*100):0;
  const urgent=rem<=15&&a.status==='open'&&!a.paused;
  const minNext=(a.currentBid||0)+(a.minIncrement||100);
  const showCustom=!!customOpen[a.id];
  const histItems=bids.slice(0,5).map(b=>`<div class="hist-row"><span class="${b.bidder===user?'you-bid':''}">${b.bidder===user?'You':b.bidder}</span><span>${b.amount.toLocaleString()}g</span></div>`).join('');
  const iconHTML=a.itemIcon?`<img class="item-icon" src="${iconUrl(a.itemIcon)}" onerror="this.style.display='none'" />`:`<div class="item-icon-placeholder"></div>`;
  const nameHTML=a.itemId?`<a class="item-name ${a.quality||'common'}" href="https://www.wowhead.com/tbc/item=${a.itemId}" data-wowhead="item=${a.itemId}&domain=tbc" target="_blank">${a.name}</a>`:`<span class="item-name ${a.quality||'common'}">${a.name}</span>`;
  const catBadge=a.category&&a.category!=='Other'?`<span class="category-badge ${catClass(a.category)}">${a.category}</span>`:'';
  const itemHeader=`<div class="item-header">${iconHTML}<div>${nameHTML}<div class="item-slot">${a.slot||''}${catBadge?` ${catBadge}`:''}</div></div></div>`;
  let timerSection='';
  if(mode==='open'){const fc=a.paused?'#e8a430':urgent?'#e26060':'#c9a84c',tc=a.paused?'var(--amber)':urgent?'var(--red)':'var(--text-muted)';timerSection=`<div class="timer-row"><div class="timer-bar"><div id="tfill-${a.id}" class="timer-fill" style="width:${pct}%;background:${fc};"></div></div><span id="ttext-${a.id}" class="timer" style="color:${tc};">${a.paused?'Paused':fmtTime(rem)}</span></div>`;}
  let bidSection='';
  if(mode==='open'&&!a.paused){
    const btns=a.bidButtons||[5,10,25];
    const cur=a.currentBid||0;
    const noteHTML=a.note?`<div style="font-size:.78rem;color:var(--amber);margin-bottom:.2rem;">&#128203; ${a.note}</div>`:'';
    const hasBids=bids.length>0;
    const qbtns=hasBids
      ? btns.map(pct=>{const amt=Math.ceil(cur*(1+pct/100)/100)*100;return`<button class="qb" onclick="quickBid('${a.id}',${amt})">+${pct}% <span style="font-size:.65em;opacity:.75;">${amt.toLocaleString()}g</span></button>`;}).join('')
      : `<button class="qb" style="flex:1;" onclick="quickBid('${a.id}',${cur})">Bid ${cur.toLocaleString()}g <span style="font-size:.65em;opacity:.75;">starting bid</span></button>`;
    const cbtn=`<button class="qb qb-custom ${showCustom?'active-custom':''}" onclick="toggleCustom('${a.id}')">${showCustom?'&#x2715; Custom':'Custom'}</button>`;
    const crow=showCustom?`<div class="custom-bid-row"><input type="number" id="bid-${a.id}" placeholder="Enter amount..." min="${minNext}" step="${a.minIncrement||100}" onkeydown="if(event.key==='Enter')placeBid('${a.id}')" /><button class="btn btn-outline btn-sm" onclick="placeBid('${a.id}')">Bid</button></div>`:'';
    const retractBtn=isLeading&&!isRL?`<button class="btn btn-danger btn-sm" onclick="retractBid('${a.id}')" style="margin-top:.3rem;">Retract Bid</button>`:'';
    bidSection=`<div class="bid-section">${noteHTML}<div><div class="bid-amt">${cur.toLocaleString()}g</div><div class="bid-ldr ${isLeading?'you':''}">${top?(top.bidder===user?'You are leading':top.bidder+' leads'):'Starting bid'}</div></div><div class="min-bid-note">Min next: ${minNext.toLocaleString()}g</div><div class="quick-bids">${qbtns}${cbtn}</div>${crow}${retractBtn}</div>`;
  }else if(mode==='open'&&a.paused){
    const noteHTML=a.note?`<div style="font-size:.78rem;color:var(--amber);margin-bottom:.2rem;">&#128203; ${a.note}</div>`:'';
    bidSection=`<div class="bid-section">${noteHTML}<div class="bid-amt">${(a.currentBid||0).toLocaleString()}g</div><div style="font-size:.78rem;color:var(--amber);">Bidding paused</div></div>`;
  }
  else if(mode==='queued'){
    const noteHTML=a.note?`<div style="font-size:.78rem;color:var(--amber);">&#128203; ${a.note}</div>`:'';
    bidSection=`<div class="bid-section"><div class="bid-amt">${(a.currentBid||0).toLocaleString()}g</div>${noteHTML}</div>`;
  }
  else if(mode==='sold'){
    const paidBox=isRL?`<label style="display:flex;align-items:center;gap:.4rem;cursor:pointer;margin-top:.3rem;">
      <input type="checkbox" ${a.paid?'checked':''} onchange="togglePaid('${a.id}')" style="width:16px;height:16px;cursor:pointer;accent-color:var(--green);" />
      <span style="font-size:.8rem;color:${a.paid?'var(--green)':'var(--text-muted)'};">${a.paid?'Paid':'Mark as paid'}</span>
    </label>`:'';
    const noteHTML=a.note?`<div style="font-size:.78rem;color:var(--amber);margin-top:.2rem;">&#128203; ${a.note}</div>`:'';
    bidSection=`<div class="bid-section"><div class="bid-amt">${(a.currentBid||0).toLocaleString()}g</div><div class="bid-ldr">Won by ${top?top.bidder:'&mdash;'}</div>${noteHTML}${paidBox}</div>`;
  }
  else if(mode==='expired'){bidSection=`<div class="bid-section"><div class="bid-amt">${(a.currentBid||0).toLocaleString()}g</div><div style="font-size:.85rem;color:var(--red);">No bids placed</div></div>`;}
  let rlControls='';
  if(isRL){
    if(mode==='open')rlControls=`<div class="rl-controls"><button class="btn ${a.paused?'btn-amber-resume':'btn-amber'} btn-sm" onclick="togglePause('${a.id}')">${a.paused?'&#9654; Resume':'&#9646;&#9646; Pause'}</button><button class="btn btn-outline btn-sm" onclick="extendTimer('${a.id}')">+30s</button><button class="btn btn-outline btn-sm" onclick="openEdit('${a.id}')">Edit</button><button class="btn btn-outline btn-sm" onclick="duplicateItem('${a.id}')">Dupe</button><button class="btn btn-danger btn-sm" onclick="closeAuction('${a.id}')">Close</button></div>`;
    else if(mode==='queued')rlControls=`<div class="rl-controls"><button class="btn btn-green btn-sm" onclick="startOne('${a.id}')">&#9654; Start</button><button class="btn btn-outline btn-sm" onclick="openEdit('${a.id}')">Edit</button><button class="btn btn-outline btn-sm" onclick="duplicateItem('${a.id}')">Dupe</button><button class="btn btn-danger btn-sm" onclick="removeQueued('${a.id}')">Remove</button></div>`;
    else if(mode==='expired')rlControls=`<div class="rl-controls"><button class="btn btn-green btn-sm" onclick="restartAuction('${a.id}')">&#9654; Restart</button><button class="btn btn-outline btn-sm" onclick="openEdit('${a.id}')">Edit</button><button class="btn btn-danger btn-sm" onclick="removeQueued('${a.id}')">Remove</button></div>`;
    else if(mode==='sold')rlControls=`<div class="rl-controls"><button class="btn btn-outline btn-sm" onclick="openEditSold('${a.id}')">Edit</button><button class="btn btn-danger btn-sm" onclick="removeSold('${a.id}')">Remove</button></div>`;
  }
  const qualityClass=(a.quality==='legendary')?'quality-legendary':(a.quality==='epic')?'quality-epic':'';
  const cc=[mode==='queued'?'queued':mode==='expired'?'expiring':isLeading?'leading':a.paused?'paused':urgent?'expiring':'', qualityClass].filter(Boolean).join(' ');
  let badge='';
  if(mode==='open'&&a.paused)badge=`<div class="badge badge-paused">Paused</div>`;
  else if(mode==='open')badge=`<div class="badge badge-open">Live</div>`;
  else if(mode==='queued')badge=`<div class="badge badge-queued">Queued</div>`;
  else if(mode==='expired')badge=`<div class="badge badge-expired">Expired</div>`;
  else badge=`<div class="badge badge-sold">Sold</div>`;
  return`<div class="card ${cc}" id="card-${a.id}">${badge}${itemHeader}${timerSection}${bidSection}${bids.length?`<div class="hist">${histItems}</div>`:''}${rlControls}</div>`;
}

// ── Actions ───────────────────────────────────────────────────────────────
function addToQueue(){
  if(!selectedItem){toast('Please search and select an item first');return;}
  const nr=push(runRef('/auctions'));
  const dur=Math.max(10,parseInt(document.getElementById('m-timer')?.value)||raidSettings.defaultTimer);
  const btn1=Math.max(1,parseInt(document.getElementById('m-btn1')?.value)||5);
  const btn2=Math.max(1,parseInt(document.getElementById('m-btn2')?.value)||10);
  const btn3=Math.max(1,parseInt(document.getElementById('m-btn3')?.value)||25);
  const name=selectedItem.name;
  const queuedCount=auctionList().filter(a=>a.status==='queued').length;
  set(nr,{id:nr.key,name,slot:document.getElementById('m-slot')?.value?.trim()||selectedItem.slot||'Unknown',quality:modalQuality,itemId:selectedItem.id,itemIcon:selectedItem.icon||null,currentBid:parseInt(document.getElementById('m-start')?.value)||1000,minIncrement:50,duration:dur,bidButtons:[btn1,btn2,btn3],category:document.getElementById('m-cat')?.value||'Other',note:document.getElementById('m-note')?.value?.trim()||'',bids:{},status:'queued',order:queuedCount,remaining:dur,paused:false,endsAt:null});
  // Keep modal open for adding more items — just reset the search fields
  selectedItem=null;searchQuery='';
  const inp=document.getElementById('item-search-input');
  if(inp){inp.value='';inp.focus();}
  const wrap=document.getElementById('search-preview-wrap');
  if(wrap)wrap.innerHTML='';
  const dd=document.getElementById('item-dropdown');
  if(dd)dd.style.display='none';
  // Reset quality to epic
  modalQuality='epic';
  ['legendary','epic','rare','uncommon'].forEach(x=>{
    const b=document.getElementById('q-'+x);if(!b)return;
    const s=x==='epic'?Q_STYLES[x].on:Q_STYLES[x].off;
    b.setAttribute('style',s+"font-family:'Cinzel',serif;font-size:.65rem;letter-spacing:.06em;font-weight:"+(x==='epic'?'600':'400')+';');
  });
  toast(name+' added — search for next item or close');
}
function saveEdit(){
  const raw=document.getElementById('item-search-input')?.value?.trim();
  const name=selectedItem?selectedItem.name:raw;
  if(!name){toast('Search and select an item');return;}
  const btn1=Math.max(1,parseInt(document.getElementById('m-btn1')?.value)||5);
  const btn2=Math.max(1,parseInt(document.getElementById('m-btn2')?.value)||10);
  const btn3=Math.max(1,parseInt(document.getElementById('m-btn3')?.value)||25);
  const updates={name,slot:document.getElementById('m-slot')?.value?.trim()||'Unknown',quality:modalQuality,currentBid:parseInt(document.getElementById('m-start')?.value)||1000,minIncrement:50,duration:Math.max(10,parseInt(document.getElementById('m-timer')?.value)||raidSettings.defaultTimer),bidButtons:[btn1,btn2,btn3]};
  updates.category=document.getElementById('m-cat')?.value||'Other';
  updates.note=document.getElementById('m-note')?.value?.trim()||'';
  if(selectedItem){updates.itemId=selectedItem.id;updates.itemIcon=selectedItem.icon||null;}
  update(runRef(`/auctions/${editId}`),updates);
  modal=false;editId=null;selectedItem=null;searchQuery='';toast(name+' updated');
}
function startOne(id){const a=auctions[id];if(!a||a.status!=='queued')return;update(runRef(`/auctions/${id}`),{status:'open',paused:false,endsAt:Date.now()+a.duration*1000,remaining:a.duration});toast(a.name+' started!');tab='active';}
function startAll(){const now=Date.now();auctionList().filter(a=>a.status==='queued').forEach(a=>{update(runRef(`/auctions/${a.id}`),{status:'open',paused:false,endsAt:now+a.duration*1000,remaining:a.duration});});toast('All auctions started!');tab='active';}
function togglePause(id){const a=auctions[id];if(!a||a.status!=='open')return;if(a.paused){update(runRef(`/auctions/${id}`),{paused:false,endsAt:Date.now()+(a.remaining||0)*1000});toast(a.name+' resumed');}else{update(runRef(`/auctions/${id}`),{paused:true,remaining:Math.max(0,Math.floor((a.endsAt-Date.now())/1000))});toast(a.name+' paused');}}
function extendTimer(id){const a=auctions[id];if(!a||a.status!=='open')return;if(a.paused){update(runRef(`/auctions/${id}`),{remaining:(a.remaining||0)+30});}else{update(runRef(`/auctions/${id}`),{endsAt:(a.endsAt||Date.now())+30000});}toast('+30s added to '+a.name);}
function closeAuction(id){const a=auctions[id];if(!a)return;const bids=Object.values(a.bids||{}).sort((x,y)=>y.amount-x.amount);update(runRef(`/auctions/${id}`),{status:'sold',remaining:0,paused:false});toast(a.name+' closed — '+(bids[0]?bids[0].bidder:'nobody')+' wins for '+(a.currentBid||0).toLocaleString()+'g');}
function restartAuction(id){
  const a=auctions[id];if(!a||a.status!=='expired')return;
  update(runRef(`/auctions/${id}`),{status:'queued',remaining:a.duration,paused:false,endsAt:null,bids:{}});
  toast(a.name+' moved back to queue');tab='queued';
}
function removeQueued(id){remove(runRef(`/auctions/${id}`));toast('Removed from queue');}

function removeSold(id){
  if(!confirm('Remove this sold item? This will reduce the pot total.'))return;
  remove(runRef(`/auctions/${id}`));
  toast('Item removed');
}

function openEditSold(id){
  const a=auctions[id];if(!a)return;
  // Build a simple inline edit modal for sold items
  const overlay=document.createElement('div');
  overlay.className='modal-overlay';
  overlay.id='sold-edit-overlay';
  overlay.innerHTML=`<div class="modal" onclick="event.stopPropagation()">
    <div class="modal-title">Edit Sold Item</div>
    <div class="fg"><div class="lbl">Winner</div><input type="text" id="se-winner" value="${Object.values(a.bids||{}).sort((x,y)=>y.amount-x.amount)[0]?.bidder||''}" placeholder="Character name" /></div>
    <div class="fg"><div class="lbl">Sale price (g)</div><input type="number" id="se-price" value="${a.currentBid||0}" min="0" step="100" /></div>
    <div class="fg"><div class="lbl">Note</div><input type="text" id="se-note" value="${a.note||''}" placeholder="Optional note..." /></div>
    <div class="modal-actions">
      <button class="btn btn-outline btn-sm" onclick="document.getElementById('sold-edit-overlay').remove()">Cancel</button>
      <button class="btn btn-gold btn-sm" onclick="saveSoldEdit('${id}')">Save</button>
    </div>
  </div>`;
  overlay.addEventListener('mousedown', e=>{ if(e.target===overlay) overlay.remove(); });
  document.body.appendChild(overlay);
}

function saveSoldEdit(id){
  const winner=document.getElementById('se-winner')?.value?.trim();
  const price=parseInt(document.getElementById('se-price')?.value)||0;
  const note=document.getElementById('se-note')?.value?.trim()||'';
  if(!winner){toast('Enter a winner name');return;}
  // Update currentBid and inject a corrected top bid
  const bidRef=push(runRef(`/auctions/${id}/bids`));
  set(bidRef,{bidder:winner,amount:price,ts:Date.now(),corrected:true});
  update(runRef(`/auctions/${id}`),{currentBid:price,note});
  document.getElementById('sold-edit-overlay')?.remove();
  toast('Sale updated');
}
function quickBid(id,amount){const a=auctions[id];if(!a||a.status!=='open'||a.paused)return;const hasBids=Object.keys(a.bids||{}).length>0;const mn=hasBids?(a.currentBid||0)+(a.minIncrement||50):(a.currentBid||0);if(amount<mn){toast('Below min of '+mn.toLocaleString()+'g');return;}submitBid(id,amount);}
function placeBid(id){const inp=document.getElementById('bid-'+id);const val=parseInt(inp?.value);const a=auctions[id];if(!a||a.status!=='open'||a.paused)return;const mn=(a.currentBid||0)+(a.minIncrement||100);if(!val||val<mn){toast('Min bid is '+mn.toLocaleString()+'g');return;}customOpen[id]=false;submitBid(id,val);if(inp)inp.value='';}
function submitBid(id,val){const a=auctions[id];if(!a)return;const br=push(runRef(`/auctions/${id}/bids`));set(br,{bidder:user,amount:val,ts:Date.now()});update(runRef(`/auctions/${id}`),{currentBid:val});if(!a.paused&&a.endsAt&&Math.floor((a.endsAt-Date.now())/1000)<30){update(runRef(`/auctions/${id}`),{endsAt:Date.now()+30000,remaining:30});toast('Bid: '+val.toLocaleString()+'g — timer extended to 30s');return;}toast('Bid placed: '+val.toLocaleString()+'g');}
function toggleCustom(id){customOpen[id]=!customOpen[id];const a=auctions[id];if(!a)return;const el=document.getElementById('card-'+id);if(el){const t=document.createElement('div');t.innerHTML=renderCard(a,a.status==='open'?'open':a.status==='queued'?'queued':'sold');el.replaceWith(t.firstElementChild);}}
function onSearchInput(val){searchQuery=val;if(selectedItem&&val!==selectedItem.name){selectedItem=null;const w=document.getElementById('search-preview-wrap');if(w)w.innerHTML='';}clearTimeout(searchTimer);if(val.length<2){const dd=document.getElementById('item-dropdown');if(dd)dd.style.display='none';return;}searchTimer=setTimeout(()=>searchWowhead(val),350);}
function setQ(q){modalQuality=q;['legendary','epic','rare','uncommon'].forEach(x=>{const b=document.getElementById('q-'+x);if(!b)return;const s=x===q?Q_STYLES[x].on:Q_STYLES[x].off;b.setAttribute('style',s+"font-family:'Cinzel',serif;font-size:.65rem;letter-spacing:.06em;font-weight:"+(x===q?'600':'400')+';');});}

  const a=auctions[id];if(!a||a.status!=='open')return;
  const bids=Object.values(a.bids||{}).sort((x,y)=>y.amount-x.amount);
  if(!bids[0]||bids[0].bidder!==user){toast('You are not the current leader');return;}

  const topBidKey=Object.entries(a.bids||{}).sort((x,y)=>y[1].amount-x[1].amount)[0]?.[0];
  if(!topBidKey)return;
  remove(runRef(`/auctions/${id}/bids/${topBidKey}`));
  const prevBid=bids[1]?.amount||a.currentBid-((a.bidButtons||[5])[0]/100*a.currentBid);
  update(runRef(`/auctions/${id}`),{currentBid:bids[1]?.amount||0});
  toast('Bid retracted');
}

function writePresence(){

function clearPresence(){

function getActiveMembers(presenceData){
  const now = Date.now();
  return Object.values(presenceData||{}).filter(p => now - (p.lastSeen||0) < 45000);
}

function getMemberSpend(name){
  return auctionList().filter(a=>a.status==='sold').reduce((sum,a)=>{
    const bids=Object.values(a.bids||{}).sort((x,y)=>y.amount-x.amount);
    return sum+(bids[0]?.bidder===name?a.currentBid:0);
  },0);
}

// ── Chat ──────────────────────────────────────────────────────────────────
let chatCollapsed=false;
let chatUnread=0;
let unsubChat=null;

function chatRef(){ return ref(db, `runs/${runId}/chat`); }

function subscribeToChat(){
  if(unsubChat) unsubChat();
  unsubChat=onValue(chatRef(), snap=>{
    const msgs=Object.entries(snap.val()||{})
      .map(([k,v])=>({key:k,...v}))
      .sort((a,b)=>a.ts-b.ts)
      .slice(-100);
    renderChatMessages(msgs);
  });
}

function renderChatMessages(msgs){
  const box=document.getElementById('chat-messages');
  if(!box) return;
  const wasAtBottom=box.scrollHeight-box.scrollTop-box.clientHeight<40;
  box.innerHTML=msgs.map(m=>{
    const mine=m.sender===user;
    const t=new Date(m.ts);
    const time=t.getHours().toString().padStart(2,'0')+':'+t.getMinutes().toString().padStart(2,'0');
    const avatarEl=m.avatar?`<img class="chat-msg-avatar" src="${m.avatar}" />`:`<span style="width:16px;height:16px;border-radius:50%;background:var(--bg-input);display:inline-block;flex-shrink:0;"></span>`;
    const rlClass=m.senderIsRL?' rl':'';
    const delBtn=isRL?`<button class="chat-delete" onclick="deleteChat('${m.key}')">✕</button>`:'';
    return`<div class="chat-msg${mine?' mine':''}">
      ${delBtn}
      <div class="chat-msg-header">${avatarEl}<span class="chat-msg-name${rlClass}">${m.sender}${m.senderIsRL?' ★':''}</span><span class="chat-msg-time">${time}</span></div>
      <div class="chat-msg-text">${formatChatText(m.text)}</div>
    </div>`;
  }).join('');
  if(wasAtBottom) box.scrollTop=box.scrollHeight;
  // Unread badge
  if(chatCollapsed && msgs.length){
    chatUnread++;
    const badge=document.getElementById('chat-unread');
    if(badge){badge.textContent=chatUnread>9?'9+':chatUnread;badge.style.display='flex';}
  }
}

function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function formatChatText(s){
  return escapeHtml(s).replace(/@(\w+)/g,'<span style="color:var(--gold);font-weight:500;">@$1</span>');
}

function mentionMember(name){
  if(name===user) return; // can't DM yourself
  openDM(name);
}

function sendChat(){
  const inp=document.getElementById('chat-input');
  const text=inp?.value?.trim();
  if(!text||!user) return;
  inp.value='';
  const msgData={sender:user,senderIsRL:isRL,avatar:discordUser?.avatar||null,text,ts:Date.now()};
  if(activeChatTab==='raid'){
    if(!runId) return;
    set(push(chatRef()),msgData);
  } else {
    set(push(dmRef(activeChatTab)),msgData);
  }
}

function deleteChat(key){
  if(!isRL) return;
  if(activeChatTab==='raid') remove(ref(db,`runs/${runId}/chat/${key}`));
  else remove(ref(db,`dms/${dmKey(user,activeChatTab)}/${key}`));
}

function toggleChat(){
  chatCollapsed=!chatCollapsed;
  const box=document.getElementById('chat-box');
  const icon=document.getElementById('chat-toggle-icon');
  const inputRow=document.getElementById('chat-input-row');
  const tabBar=document.getElementById('chat-tabs');
  if(box) box.classList.toggle('collapsed',chatCollapsed);
  if(icon) icon.textContent=chatCollapsed?'▲':'▼';
  if(inputRow) inputRow.style.display=chatCollapsed?'none':'flex';
  if(tabBar&&openDMs.length>0) tabBar.style.display=chatCollapsed?'none':'flex';
  if(!chatCollapsed){
    chatUnread=0;
    if(activeChatTab!=='raid') dmUnread[activeChatTab]=0;
    updateChatUnread();
    const msgs=document.getElementById('chat-messages');
    if(msgs) setTimeout(()=>msgs.scrollTop=msgs.scrollHeight,50);
  }

// ── DM System ─────────────────────────────────────────────────────────────
let activeChatTab='raid';
let openDMs=[];
let dmSubs={};
let dmUnread={};

function dmKey(a,b){ return [a,b].sort().join('__'); }
function dmRef(partner){ return ref(db,`dms/${dmKey(user,partner)}`); }

function openDM(partner){
  if(partner===user) return;
  if(!openDMs.includes(partner)) openDMs.push(partner);
  activeChatTab=partner;
  if(chatCollapsed) toggleChat();
  dmUnread[partner]=0;
  renderChatTabs();
  updateChatHeader();
  subscribeToDM(partner);
  get(dmRef(partner)).then(snap=>{
    const msgs=Object.entries(snap.val()||{}).map(([k,v])=>({key:k,...v})).sort((a,b)=>a.ts-b.ts).slice(-100);
    renderChatMessages(msgs);
  });
}

function subscribeToDM(partner){
  if(dmSubs[partner]) return;
  dmSubs[partner]=onValue(dmRef(partner), snap=>{
    const msgs=Object.entries(snap.val()||{}).map(([k,v])=>({key:k,...v})).sort((a,b)=>a.ts-b.ts).slice(-100);
    if(activeChatTab===partner){ renderChatMessages(msgs); }
    else{ dmUnread[partner]=(dmUnread[partner]||0)+1; renderChatTabs(); updateChatUnread(); }
  });
}

function closeDM(partner,e){
  if(e) e.stopPropagation();
  openDMs=openDMs.filter(d=>d!==partner);
  if(dmSubs[partner]){ dmSubs[partner](); delete dmSubs[partner]; }
  delete dmUnread[partner];
  if(activeChatTab===partner){ activeChatTab='raid'; updateChatHeader(); }
  renderChatTabs();
}

function switchChatTab(tab){
  activeChatTab=tab;
  if(tab==='raid'){
    chatUnread=0;
    subscribeToChat();
  } else {
    dmUnread[tab]=0;
    subscribeToDM(tab);
    get(dmRef(tab)).then(snap=>{
      const msgs=Object.entries(snap.val()||{}).map(([k,v])=>({key:k,...v})).sort((a,b)=>a.ts-b.ts).slice(-100);
      renderChatMessages(msgs);
    });
  }
  renderChatTabs();
  updateChatHeader();
  updateChatUnread();
}

function updateChatHeader(){
  const title=document.getElementById('chat-hdr-title');
  if(title) title.textContent=activeChatTab==='raid'?'Raid Chat':'DM: '+activeChatTab;
}

function updateChatUnread(){
  const badge=document.getElementById('chat-unread');
  const total=chatUnread+Object.values(dmUnread).reduce((s,v)=>s+v,0);
  if(badge){ badge.textContent=total>9?'9+':total; badge.style.display=total>0?'flex':'none'; }
}

function renderChatTabs(){
  const bar=document.getElementById('chat-tabs');
  if(!bar) return;
  if(!openDMs.length){ bar.style.display='none'; return; }
  bar.style.display='flex';
  const tabs=[
    `<div class="chat-tab ${activeChatTab==='raid'?'active':''}" onclick="switchChatTab('raid')">Raid${chatUnread>0&&activeChatTab!=='raid'?` <span class="chat-tab-unread">${chatUnread>9?'9+':chatUnread}</span>`:''}</div>`,
    ...openDMs.map(p=>`<div class="chat-tab ${activeChatTab===p?'active':''}" onclick="switchChatTab('${p}')">${p}${dmUnread[p]>0&&activeChatTab!==p?` <span class="chat-tab-unread">${dmUnread[p]>9?'9+':dmUnread[p]}</span>`:''}<button class="chat-tab-close" onclick="closeDM('${p}',event)">✕</button></div>`)
  ];
  bar.innerHTML=tabs.join('');
}

let banList={};
let crossRunCache=null;
let crossRunFetching=false;
let activeCategory='all';
let raidCategories=['Tier','Physical','Caster/Healer','Other'];
let editingTitle=false;

function banKey(m){return m.discordId?'discord_'+m.discordId:'name_'+m.name;}

function subscribeToBans(){
  onValue(ref(db,'bans'),snap=>{
    banList=snap.val()||{};
    if(user&&isBanned({discordId:discordUser?.id,name:user}))handleBanned();
  });
}

function isBanned(m){
  if(m.discordId&&banList['discord_'+m.discordId])return true;
  if(m.name&&banList['name_'+m.name])return true;
  return false;
}

function kickBan(m){
  if(!isRL)return;
  if(!confirm('Kick and ban '+m.name+'? They cannot rejoin until unbanned.'))return;
  const key=banKey(m);
  set(ref(db,'bans/'+key),{name:m.name,discordId:m.discordId||null,discordName:m.discordName||null,bannedAt:Date.now(),bannedBy:user});
  if(m.name)remove(ref(db,`runs/${runId}/presence/${m.name}`));
  writeAudit(user+' banned '+m.name);
  toast(m.name+' has been banned');
}

function unban(key){
  if(!isRL)return;
  const b=banList[key];
  remove(ref(db,'bans/'+key));
  writeAudit(user+' unbanned '+(b?.name||key));
  toast((b?.name||key)+' has been unbanned');
  if(panelOpen)renderPanel();
}

function handleBanned(){
  if(unsubRun)unsubRun();
  clearPresence();

// ── Cross-run stats ────────────────────────────────────────────────────────
async function fetchCrossRunStats(forceRefresh){
  if(crossRunCache&&!forceRefresh) return crossRunCache;
  if(crossRunFetching) return crossRunCache;
  crossRunFetching=true;
  try{
    const snap=await get(ref(db,'runs'));
    const runs=snap.val()||{};
    const stats={};
    Object.values(runs).forEach(run=>{
      Object.values(run.auctions||{}).filter(a=>a.status==='sold').forEach(a=>{
        const bids=Object.values(a.bids||{}).sort((x,y)=>y.amount-x.amount);
        if(!bids[0])return;
        const winner=bids[0].bidder;
        if(!stats[winner])stats[winner]={totalSpent:0,itemsWon:0,items:[],runs:new Set()};
        stats[winner].totalSpent+=(a.currentBid||0);
        stats[winner].itemsWon++;
        stats[winner].items.push({name:a.name,price:a.currentBid,quality:a.quality||'common',itemId:a.itemId||null});
        if(run.createdAt) stats[winner].runs.add(run.createdAt);
      });
    });
    // Convert Set to count
    Object.values(stats).forEach(s=>{ s.runCount=s.runs.size; delete s.runs; });
    crossRunCache=stats;
    return stats;
  }catch(e){return crossRunCache||null;}
  finally{crossRunFetching=false;}
}

let _tipHideTimer=null;
let _tipActive=false;
let _mouseX=0, _mouseY=0;

document.addEventListener('mousemove', e=>{ _mouseX=e.clientX; _mouseY=e.clientY; });

function showMemberTooltipFixed(event, memberName){
  _tipActive=true;
  clearTimeout(_tipHideTimer);
  const existing=document.querySelector('.member-tooltip');
  if(existing&&existing.dataset.member===memberName) return;
  document.querySelectorAll('.member-tooltip').forEach(t=>t.remove());
  const tip=document.createElement('div');
  tip.className='member-tooltip';
  tip.dataset.member=memberName;
  tip.innerHTML='<div style="color:var(--text-muted);font-size:.78rem;">Loading...</div>';
  const x=Math.min(event.clientX+16, window.innerWidth-300);
  const y=Math.min(event.clientY-10, window.innerHeight-260);
  tip.style.left=x+'px';
  tip.style.top=y+'px';
  tip.addEventListener('mouseenter',()=>{ _tipActive=true; clearTimeout(_tipHideTimer); });
  tip.addEventListener('mouseleave',()=>{ _scheduleHideTip(); });
  document.body.appendChild(tip);
  _loadTipContent(tip, memberName);
}

async function _loadTipContent(tip, memberName){
  const stats=await fetchCrossRunStats();
  if(!document.body.contains(tip)) return;
  if(!stats||!stats[memberName]){
    tip.innerHTML='<div style="color:var(--text-muted);font-size:.78rem;">No purchase history yet</div>';
    return;
  }
  const s=stats[memberName];
  const currentSpend=auctionList().filter(a=>a.status==='sold').reduce((sum,a)=>{
    const bids=Object.values(a.bids||{}).sort((x,y)=>y.amount-x.amount);
    return sum+(bids[0]?.bidder===memberName?a.currentBid:0);
  },0);
  const topItems=[...s.items].sort((a,b)=>b.price-a.price).slice(0,3);
  if(!document.body.contains(tip)) return;
  tip.innerHTML=`
    <div style="font-family:'Cinzel',serif;font-size:.78rem;color:var(--gold);margin-bottom:.4rem;border-bottom:1px solid var(--border-gold);padding-bottom:.3rem;display:flex;align-items:center;justify-content:space-between;">
      <span>${memberName}</span>
      <button onclick="crossRunCache=null;document.querySelectorAll('.member-tooltip').forEach(t=>t.remove());" style="background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:.65rem;padding:0;" title="Refresh stats">↻</button>
    </div>
    <div style="font-size:.72rem;color:var(--text-muted);margin-bottom:.15rem;">All-time (${s.runCount||'?'} run${s.runCount!==1?'s':''})</div>
    <div style="font-family:'Cinzel',serif;font-size:.95rem;color:var(--gold-light);">${s.totalSpent.toLocaleString()}g</div>
    <div style="font-size:.72rem;color:var(--text-muted);">${s.itemsWon} item${s.itemsWon!==1?'s':''} won</div>
    ${currentSpend?`<div style="font-size:.75rem;color:var(--amber);margin-top:.35rem;padding-top:.35rem;border-top:1px solid var(--border-gold);">This run: ${currentSpend.toLocaleString()}g</div>`:''}
    ${topItems.length?`<div style="margin-top:.35rem;font-size:.68rem;color:var(--text-muted);padding-top:.35rem;border-top:1px solid var(--border-gold);">Top wins:</div>${topItems.map(i=>`<div style="font-size:.73rem;" class="item-name ${i.quality}">${i.itemId?`<a href="https://www.wowhead.com/tbc/item=${i.itemId}" data-wowhead="item=${i.itemId}&domain=tbc" onclick="return false;" class="item-name ${i.quality}" style="font-size:.73rem;text-decoration:none;">${i.name}</a>`:i.name} <span style="color:var(--text-muted);">${i.price.toLocaleString()}g</span></div>`).join('')}`:''}`;
  if(window.$WowheadPower) window.$WowheadPower.refreshLinks();
}

function _scheduleHideTip(){
  _tipActive=false;
  clearTimeout(_tipHideTimer);
  _tipHideTimer=setTimeout(()=>{
    if(_tipActive) return;
    // Check if mouse is currently over the tooltip
    const tip=document.querySelector('.member-tooltip');
    if(tip){
      const r=tip.getBoundingClientRect();
      if(_mouseX>=r.left&&_mouseX<=r.right&&_mouseY>=r.top&&_mouseY<=r.bottom){
        _tipActive=true; return;
      }
    }
    document.querySelectorAll('.member-tooltip').forEach(t=>t.remove());
  }, 200);
}

function showMemberTooltip(el, memberName){
  const rect=el.getBoundingClientRect();
  showMemberTooltipFixed({clientX:rect.right, clientY:rect.top+rect.height/2}, memberName);
}

function hideMemberTooltip(el){
  _tipActive=false;
  clearTimeout(_tipHideTimer);
  _tipHideTimer=setTimeout(()=>{
    if(_tipActive) return;
    const tip=document.querySelector('.member-tooltip');
    if(tip){
      const r=tip.getBoundingClientRect();
      if(_mouseX>=r.left&&_mouseX<=r.right&&_mouseY>=r.top&&_mouseY<=r.bottom){
        _tipActive=true; return;
      }
    }
    document.querySelectorAll('.member-tooltip').forEach(t=>t.remove());
  }, 200);
}

// ── Categories ─────────────────────────────────────────────────────────────
function catClass(cat){
  if(!cat||cat==='Other')return'cat-other';
  if(cat==='Tier')return'cat-tier';
  if(cat==='Physical')return'cat-physical';
  return'cat-caster';
}

function getCategoryOptions(selected){
  return raidCategories.map(cat=>`<option value="${cat}" ${selected===cat?'selected':''}>${cat}</option>`).join('');
}

function renderCategoryFilterBar(list){
  const counts={all:list.length};
  raidCategories.forEach(cat=>{counts[cat]=list.filter(a=>a.category===cat||(!a.category&&cat==='Other')).length;});
  const buttons=[['all','All'],...raidCategories.map(c=>[c,c])].map(([key,label])=>`
    <button class="cat-filter-btn ${activeCategory===key?'active':'inactive'}" onclick="setCategoryFilter('${key}')">
      ${label} ${counts[key]?`<span style="opacity:.6;font-size:.6em;">(${counts[key]})</span>`:''}
    </button>`).join('');
  return`<div class="cat-filter-bar">${buttons}</div>`;
}

function setCategoryFilter(cat){activeCategory=cat;render();}

function closeModal(){
  const wasAdding=modal&&!editId;
  modal=false;editId=null;selectedItem=null;searchQuery='';
  if(wasAdding)tab='queued';
  render();
}
let _dragId=null;
function dragStart(e,id){_dragId=id;e.currentTarget.style.opacity='0.4';e.dataTransfer.effectAllowed='move';}
function dragOver(e){e.preventDefault();e.dataTransfer.dropEffect='move';e.currentTarget.style.outline='2px solid var(--gold)';}
function dragDrop(e,targetId){
  e.preventDefault();
  if(!_dragId||_dragId===targetId)return;
  const queued=auctionList().filter(a=>a.status==='queued').sort((a,b)=>(a.order??99999)-(b.order??99999));
  const ids=queued.map(a=>a.id);
  const fromIdx=ids.indexOf(_dragId);
  const toIdx=ids.indexOf(targetId);
  if(fromIdx===-1||toIdx===-1)return;
  ids.splice(fromIdx,1);ids.splice(toIdx,0,_dragId);
  const updates={};
  ids.forEach((id,i)=>{updates[`auctions/${id}/order`]=i;});
  update(runRef(),updates);
  e.currentTarget.style.outline='';
}
function dragEnd(e){e.currentTarget.style.opacity='';e.currentTarget.style.outline='';_dragId=null;}
function setTab(t){tab=t;render();}

document.addEventListener('click',e=>{
  const dd=document.getElementById('item-dropdown');
  if(dd&&!dd.contains(e.target)&&e.target.id!=='item-search-input')dd.style.display='none';
});

// Handle Discord OAuth callback
const _urlParams = new URLSearchParams(window.location.search);
const _discordUserParam = _urlParams.get('discord_user');
const _discordError = _urlParams.get('discord_error');
if (_discordUserParam) {
  try {
    discordUser = JSON.parse(decodeURIComponent(_discordUserParam));
    localStorage.setItem('gdkp_discord', JSON.stringify(discordUser));
    // Clear URL params
    window.history.replaceState({}, '', window.location.pathname);
  } catch(e) {}
}
if (_discordError) {
  window.history.replaceState({}, '', window.location.pathname);
}

if(_initSb)_initSb.classList.add('collapsed');
if(_initTab){_initTab.textContent='▶';_initTab.classList.add('collapsed');}
// Restore session on refresh
const _savedUser = localStorage.getItem('gdkp_user');
const _savedIsRL = localStorage.getItem('gdkp_isRL');
const _savedDiscord = localStorage.getItem('gdkp_discord');
if (_savedDiscord && !discordUser) {
  try { discordUser = JSON.parse(_savedDiscord); } catch(e) {}
}
if (_savedUser) {
  user = _savedUser;
  isRL = _savedIsRL === '1' || (discordUser?.id === RAID_LEADER_DISCORD_ID);
  getOrCreateRun();
} else if (discordUser) {
  user = discordUser.displayName || discordUser.username;
  isRL = discordUser.id === RAID_LEADER_DISCORD_ID;
  localStorage.setItem('gdkp_user', user);
  localStorage.setItem('gdkp_isRL', isRL ? '1' : '0');
  getOrCreateRun();
} else render();
