let _pendingDeleteRun=null;
let _deleteUndoTimer=null;

async function renderPastRunsPanel(){
  const body=document.getElementById('side-panel-body');
  if(!body) return;
  const scrollTop=body.scrollTop; // save scroll position
  body.innerHTML='<div style="color:var(--text-muted);font-size:.82rem;text-align:center;padding:1.5rem 0;">Loading...</div>';
  try{
    const snap=await get(ref(db,'runs'));
    const runs=snap.val()||{};
    const sorted=Object.entries(runs)
      .filter(([k,r])=>k!==runId)
      .sort((a,b)=>(b[1].createdAt||0)-(a[1].createdAt||0));
    // Filter to only runs with actual sold items
    const withItems=sorted.filter(([k,r])=>{
      const sold=Object.entries(r.auctions||{}).filter(([,a])=>a&&a.status==='sold'&&(a.currentBid||0)>0);
      return sold.length>0 && sold.reduce((s,[,a])=>s+(a.currentBid||0),0)>0;
    });
    if(!withItems.length){
      body.innerHTML='<div style="color:var(--text-muted);font-size:.82rem;text-align:center;padding:1.5rem 0;">No past runs yet</div>';
      return;
    }
    body.innerHTML=withItems.map(([runKey,run])=>{
      const sold=Object.entries(run.auctions||{}).filter(([,a])=>a&&a.status==='sold'&&(a.currentBid||0)>0);
      if(!sold.length) return '';
      const pot=sold.reduce((s,[,a])=>s+(a.currentBid||0),0);
      const _d=run.createdAt?new Date(run.createdAt):null;
      const date=_d?_d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric',timeZone:'America/New_York'})+' '+_d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:true,timeZone:'America/New_York'})+' ET':'Unknown date';
      const title=run.settings?.raidTitle||'Untitled Run';
      const itemRows=sold.map(([aId,a])=>{
        const bids=Object.values(a.bids||{}).sort((x,y)=>y.amount-x.amount);
        const winner=bids[0]?.bidder||'Unknown';
        const nameStyle='flex:1;min-width:0;font-size:.78rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;';
        const nameEl=a.itemId
          ?`<a class="item-name ${a.quality||'common'}" href="https://www.wowhead.com/tbc/item=${a.itemId}" data-wowhead="item=${a.itemId}&domain=tbc" style="${nameStyle}text-decoration:none;">${a.name}</a>`
          :`<span class="item-name ${a.quality||'common'}" style="${nameStyle}">${a.name}</span>`;
        return`<div style="display:flex;align-items:center;gap:.4rem;padding:.3rem .6rem;border-bottom:1px solid rgba(201,168,76,0.06);min-width:0;">
          ${a.itemIcon?`<img src="https://wow.zamimg.com/images/wow/icons/medium/${a.itemIcon}.jpg" style="width:20px;height:20px;border-radius:2px;flex-shrink:0;" />`:'<div style="width:20px;flex-shrink:0;"></div>'}
          ${nameEl}
          <span style="color:var(--text-muted);font-size:.7rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70px;flex-shrink:0;">${winner!=='Unknown'?winner:''}</span>
          <span style="color:var(--gold-light);font-family:'Cinzel',serif;font-size:.72rem;white-space:nowrap;flex-shrink:0;margin-left:auto;">${(a.currentBid||0).toLocaleString()}g</span>
          ${isRL?`<button onclick="removePastItem('${runKey}','${aId}')" style="background:none;border:none;color:var(--red);cursor:pointer;font-size:.7rem;padding:.1rem .2rem;flex-shrink:0;" title="Remove">✕</button>`:''}
        </div>`;
      }).join('');
      return`<div style="background:rgba(30,26,16,0.8);border:1px solid var(--border-gold);border-radius:4px;margin-bottom:.75rem;overflow:hidden;width:100%;">
        <div style="padding:.6rem .85rem;display:flex;align-items:center;justify-content:space-between;gap:.5rem;">
          <div style="min-width:0;flex:1;">
            <div style="font-family:'Cinzel',serif;font-size:.78rem;color:var(--gold);">${title}</div>
            ${date?`<div style="font-size:.7rem;color:var(--text-muted);">${date} · ${sold.length} items · ${pot.toLocaleString()}g</div>`:''}
          </div>
          ${isRL?`<button onclick="deleteRun('${runKey}')" style="background:none;border:1px solid rgba(255,96,96,0.3);color:var(--red);cursor:pointer;font-size:.6rem;font-family:'Cinzel',serif;letter-spacing:.06em;padding:.25rem .55rem;border-radius:3px;flex-shrink:0;align-self:center;">Delete</button>`:''}
        </div>
        <div style="border-top:1px solid var(--border-gold);padding:.35rem 0;max-height:60vh;overflow-y:auto;-webkit-overflow-scrolling:touch;">${itemRows}</div>
      </div>`;
    }).join('');
  }catch(e){
    body.innerHTML='<div style="color:var(--red);font-size:.82rem;padding:1rem;">Failed to load past runs</div>';
  }
  if(window.$WowheadPower) window.$WowheadPower.refreshLinks();
  // Restore scroll position
  requestAnimationFrame(()=>{ body.scrollTop=scrollTop; });
}

async function deleteRun(runKey){
  if(!isRL) return;
  // Store for undo
  const snap=await get(ref(db,`runs/${runKey}`));
  _pendingDeleteRun={key:runKey, data:snap.val()};
  // Remove immediately
  await remove(ref(db,`runs/${runKey}`));
  crossRunCache=null;
  renderPastRunsPanel();
  // Show undo toast
  clearTimeout(_deleteUndoTimer);
  const el=document.getElementById('toast');
  if(el){
    el.innerHTML=`Run deleted. <button onclick="undoDeleteRun()" style="background:none;border:1px solid var(--gold);color:var(--gold);cursor:pointer;font-family:'Cinzel',serif;font-size:.7rem;padding:.1rem .4rem;border-radius:3px;margin-left:.5rem;">Undo</button>`;
    el.classList.add('show');
  }
  _deleteUndoTimer=setTimeout(()=>{
    _pendingDeleteRun=null;
    const el=document.getElementById('toast');
    if(el){el.classList.remove('show');el.textContent='';}
  }, 10000);
}

async function undoDeleteRun(){
  if(!_pendingDeleteRun) return;
  clearTimeout(_deleteUndoTimer);
  await set(ref(db,`runs/${_pendingDeleteRun.key}`), _pendingDeleteRun.data);
  _pendingDeleteRun=null;
  crossRunCache=null;
  renderPastRunsPanel();
  toast('Run restored');
}

async function removePastItem(runKey, auctionId){
  if(!isRL) return;
  if(!confirm('Remove this item from history? This will affect cross-run totals.')) return;
  await remove(ref(db,`runs/${runKey}/auctions/${auctionId}`));
  crossRunCache=null; // invalidate cache
  toast('Item removed from history');
  renderPastRunsPanel();
}

function renderAuditPanel(){
  // RL-only panel rendered inside side panel when audit tab selected
  const body = document.getElementById('side-panel-body');
  if(!body) return;
  const auditRef = ref(db, `runs/${runId}/audit`);
  get(auditRef).then(snap => {
    const entries = Object.values(snap.val()||{}).sort((a,b)=>b.ts-a.ts).slice(0,50);
    if(!entries.length){ body.innerHTML='<div style="color:var(--text-muted);font-size:.85rem;text-align:center;padding:2rem 0;">No audit entries yet</div>'; return; }
    body.innerHTML = entries.map(e => {
      const d = new Date(e.ts);
      const t = d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');
      return `<div class="audit-row"><span class="audit-time">${t}</span><span class="audit-msg">${e.msg}</span></div>`;
    }).join('');
  });
}


// ── Cross-run stats ────────────────────────────────────────────────────────
async function fetchCrossRunStats(forceRefresh){
  if(crossRunCache&&!forceRefresh) return crossRunCache;
  if(crossRunFetching) return crossRunCache;
  crossRunFetching=true;
  try{
    const snap=await get(ref(db,'runs'));
    const runs=snap.val()||{};
    const stats={};
    Object.values(runs).forEach(run=>{
      Object.values(run.auctions||{}).filter(a=>a.status==='sold').forEach(a=>{
        const bids=Object.values(a.bids||{}).sort((x,y)=>y.amount-x.amount);
        if(!bids[0])return;
        const winner=bids[0].bidder;
        if(!stats[winner])stats[winner]={totalSpent:0,itemsWon:0,items:[],runs:new Set()};
        stats[winner].totalSpent+=(a.currentBid||0);
        stats[winner].itemsWon++;
        stats[winner].items.push({name:a.name,price:a.currentBid,quality:a.quality||'common',itemId:a.itemId||null});
        if(run.createdAt) stats[winner].runs.add(run.createdAt);
      });
    });
    // Convert Set to count
    Object.values(stats).forEach(s=>{ s.runCount=s.runs.size; delete s.runs; });
    crossRunCache=stats;
    return stats;
  }catch(e){return crossRunCache||null;}
  finally{crossRunFetching=false;}
}

let _tipHideTimer=null;
let _tipActive=false;
let _mouseX=0, _mouseY=0;

document.addEventListener('mousemove', e=>{ _mouseX=e.clientX; _mouseY=e.clientY; });

function showMemberTooltipFixed(event, memberName){
  _tipActive=true;
  clearTimeout(_tipHideTimer);
  const existing=document.querySelector('.member-tooltip');
  if(existing&&existing.dataset.member===memberName) return;
  document.querySelectorAll('.member-tooltip').forEach(t=>t.remove());
  const tip=document.createElement('div');
  tip.className='member-tooltip';
  tip.dataset.member=memberName;
  tip.innerHTML='<div style="color:var(--text-muted);font-size:.78rem;">Loading...</div>';
  const x=Math.min(event.clientX+16, window.innerWidth-300);
  const y=Math.min(event.clientY-10, window.innerHeight-260);
  tip.style.left=x+'px';
  tip.style.top=y+'px';
  tip.addEventListener('mouseenter',()=>{ _tipActive=true; clearTimeout(_tipHideTimer); });
  tip.addEventListener('mouseleave',()=>{ _scheduleHideTip(); });
  document.body.appendChild(tip);
  _loadTipContent(tip, memberName);
}

async function _loadTipContent(tip, memberName){
  const stats=await fetchCrossRunStats();
  if(!document.body.contains(tip)) return;
  if(!stats||!stats[memberName]){
    tip.innerHTML='<div style="color:var(--text-muted);font-size:.78rem;">No purchase history yet</div>';
    return;
  }
  const s=stats[memberName];
  const currentSpend=auctionList().filter(a=>a.status==='sold').reduce((sum,a)=>{
    const bids=Object.values(a.bids||{}).sort((x,y)=>y.amount-x.amount);
    return sum+(bids[0]?.bidder===memberName?a.currentBid:0);
  },0);
  const topItems=[...s.items].sort((a,b)=>b.price-a.price).slice(0,3);
  if(!document.body.contains(tip)) return;
  tip.innerHTML=`
    <div style="font-family:'Cinzel',serif;font-size:.78rem;color:var(--gold);margin-bottom:.4rem;border-bottom:1px solid var(--border-gold);padding-bottom:.3rem;display:flex;align-items:center;justify-content:space-between;">
      <span>${memberName}</span>
      <button onclick="crossRunCache=null;document.querySelectorAll('.member-tooltip').forEach(t=>t.remove());" style="background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:.65rem;padding:0;" title="Refresh stats">↻</button>
    </div>
    <div style="font-size:.72rem;color:var(--text-muted);margin-bottom:.15rem;">All-time (${s.runCount||'?'} run${s.runCount!==1?'s':''})</div>
    <div style="font-family:'Cinzel',serif;font-size:.95rem;color:var(--gold-light);">${s.totalSpent.toLocaleString()}g</div>
    <div style="font-size:.72rem;color:var(--text-muted);">${s.itemsWon} item${s.itemsWon!==1?'s':''} won</div>
    ${currentSpend?`<div style="font-size:.75rem;color:var(--amber);margin-top:.35rem;padding-top:.35rem;border-top:1px solid var(--border-gold);">This run: ${currentSpend.toLocaleString()}g</div>`:''}
    ${topItems.length?`<div style="margin-top:.35rem;font-size:.68rem;color:var(--text-muted);padding-top:.35rem;border-top:1px solid var(--border-gold);">Top wins:</div>${topItems.map(i=>`<div style="font-size:.73rem;" class="item-name ${i.quality}">${i.itemId?`<a href="https://www.wowhead.com/tbc/item=${i.itemId}" data-wowhead="item=${i.itemId}&domain=tbc" class="item-name ${i.quality}" style="font-size:.73rem;text-decoration:none;">${i.name}</a>`:i.name} <span style="color:var(--text-muted);">${i.price.toLocaleString()}g</span></div>`).join('')}`:''}`;
  if(window.$WowheadPower) window.$WowheadPower.refreshLinks();
}

function _scheduleHideTip(){
  _tipActive=false;
  clearTimeout(_tipHideTimer);
  _tipHideTimer=setTimeout(()=>{
    if(_tipActive) return;
    // Check if mouse is currently over the tooltip
    const tip=document.querySelector('.member-tooltip');
    if(tip){
      const r=tip.getBoundingClientRect();
      if(_mouseX>=r.left&&_mouseX<=r.right&&_mouseY>=r.top&&_mouseY<=r.bottom){
        _tipActive=true; return;
      }
    }
    document.querySelectorAll('.member-tooltip').forEach(t=>t.remove());
  }, 200);
}

function showMemberTooltip(el, memberName){
  const rect=el.getBoundingClientRect();
  showMemberTooltipFixed({clientX:rect.right, clientY:rect.top+rect.height/2}, memberName);
}

function hideMemberTooltip(el){
  _tipActive=false;
  clearTimeout(_tipHideTimer);
  _tipHideTimer=setTimeout(()=>{
    if(_tipActive) return;
    const tip=document.querySelector('.member-tooltip');
    if(tip){
      const r=tip.getBoundingClientRect();
      if(_mouseX>=r.left&&_mouseX<=r.right&&_mouseY>=r.top&&_mouseY<=r.bottom){
        _tipActive=true; return;
      }
    }
    document.querySelectorAll('.member-tooltip').forEach(t=>t.remove());
  }, 200);
}

function catClass(cat){

  if(cat==='Tier')return'cat-tier';

function renderCategoryFilterBar(list){
  const counts={all:list.length};
  raidCategories.forEach(cat=>{counts[cat]=list.filter(a=>a.category===cat||(!a.category&&cat==='Other')).length;});
  const catColors={
    'Tier':    {on:'border-color:#ffcc44;background:rgba(255,180,0,0.22);color:#ffcc44;',     off:'border-color:rgba(255,180,0,0.25);background:transparent;color:#888;'},
    'Physical':{on:'border-color:#ff8080;background:rgba(226,96,96,0.22);color:#ff8080;',     off:'border-color:rgba(226,96,96,0.2);background:transparent;color:#888;'},
    'Caster/Healer':{on:'border-color:#80c0ff;background:rgba(50,150,255,0.22);color:#80c0ff;',off:'border-color:rgba(50,150,255,0.2);background:transparent;color:#888;'},
    'Other':   {on:'border-color:#ccc;background:rgba(200,200,200,0.15);color:#ccc;',         off:'border-color:rgba(180,180,180,0.2);background:transparent;color:#888;'},
  };
  const allActive=activeCategory==='all';
  const buttons=[
    `<button class="cat-filter-btn" style="${allActive?'border-color:var(--gold);background:rgba(212,169,60,0.22);color:var(--gold-light);font-weight:600;':'border-color:var(--border-gold);background:transparent;color:var(--text-muted);'}" onclick="setCategoryFilter('all')">
      All ${counts.all?`<span style="opacity:.6;font-size:.6em;">(${counts.all})</span>`:''}
    </button>`,
    ...raidCategories.map(cat=>{
      const isActive=activeCategory===cat;
      const c=catColors[cat]||catColors['Other'];
      return`<button class="cat-filter-btn" style="${isActive?c.on:c.off}${isActive?'font-weight:600;':''}" onclick="setCategoryFilter('${cat}')">
        ${cat} ${counts[cat]?`<span style="opacity:.6;font-size:.6em;">(${counts[cat]})</span>`:''}
      </button>`;
    })
  ].join('');
  return`<div class="cat-filter-bar">${buttons}</div>`;
}

let _dragId=null;
function dragStart(e,id){_dragId=id;e.currentTarget.style.opacity='0.4';e.dataTransfer.effectAllowed='move';}
function dragOver(e){e.preventDefault();e.dataTransfer.dropEffect='move';e.currentTarget.style.outline='2px solid var(--gold)';}
function dragDrop(e,targetId){
  e.preventDefault();
  if(!_dragId||_dragId===targetId)return;
  const queued=auctionList().filter(a=>a.status==='queued').sort((a,b)=>(a.order??99999)-(b.order??99999));
  const ids=queued.map(a=>a.id);
  const fromIdx=ids.indexOf(_dragId);
  const toIdx=ids.indexOf(targetId);
  if(fromIdx===-1||toIdx===-1)return;
  ids.splice(fromIdx,1);ids.splice(toIdx,0,_dragId);
  const updates={};
  ids.forEach((id,i)=>{updates[`auctions/${id}/order`]=i;});
  update(runRef(),updates);
  e.currentTarget.style.outline='';
}
function dragEnd(e){e.currentTarget.style.opacity='';e.currentTarget.style.outline='';_dragId=null;}
function setTab(t){tab=t;render();}

// ── Swipe gestures ────────────────────────────────────────────────────────
(function(){
  let tx=0, ty=0;
  document.addEventListener('touchstart', e=>{
    tx=e.touches[0].clientX;
    ty=e.touches[0].clientY;
  }, {passive:true});

  document.addEventListener('touchend', e=>{
    const dx=e.changedTouches[0].clientX - tx;
    const dy=e.changedTouches[0].clientY - ty;
    const adx=Math.abs(dx), ady=Math.abs(dy);

    // Horizontal swipes
    if(adx > ady && adx >= 40){
      if(dx < 0 && !sidebarCollapsed) toggleMembersSidebar();
      if(dx > 0 && tx < 30 && sidebarCollapsed) toggleMembersSidebar();
      if(dx < 0 && tx > window.innerWidth - 30 && !panelOpen) togglePanel();
      if(dx > 0 && panelOpen) togglePanel();
    }

    // Vertical swipes — chat box
    if(ady > adx && ady >= 40){
      const chatBox=document.getElementById('chat-box');
      const nearBottom=ty > window.innerHeight - 120;
      if(dy > 0 && !chatCollapsed && chatBox && chatBox.contains(e.target)) toggleChat();
      if(dy < 0 && chatCollapsed && nearBottom) toggleChat();
    }
  }, {passive:true});
})();
